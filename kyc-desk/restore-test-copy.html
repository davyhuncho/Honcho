<style>
/* Layout: a floating frosted sidebar over a soft colour-field wallpaper. Every panel is translucent glass with a specular top edge; records sit in hairline tables. */
:root {
  --bg: #e8edf4;
  --orb-1: rgba(40, 140, 255, .55);
  --orb-2: rgba(60, 205, 190, .48);
  --orb-3: rgba(165, 120, 255, .44);
  --orb-4: rgba(255, 170, 110, .44);
  --orb-5: rgba(255, 120, 170, .26);
  --glass: rgba(255, 255, 255, .40);
  --glass-strong: rgba(255, 255, 255, .64);
  --glass-soft: rgba(255, 255, 255, .24);
  --glass-edge: rgba(255, 255, 255, .62);
  --glass-hi: rgba(255, 255, 255, .95);
  --glass-glow: rgba(255, 255, 255, .45);
  --seg-on: #ffffff;
  --sheen: linear-gradient(140deg, rgba(255, 255, 255, .62) 0%, rgba(255, 255, 255, .16) 30%, rgba(255, 255, 255, .03) 58%, rgba(255, 255, 255, .20) 100%);
  --scrim: rgba(18, 26, 40, .22);
  --ink: #0b1220;
  --muted: #5b6475;
  --line: rgba(15, 23, 42, .085);
  --fill: rgba(118, 118, 128, .12);
  --fill-strong: rgba(118, 118, 128, .2);
  --accent: #007aff;
  --accent-2: #4ea6ff;
  --accent-soft: rgba(0, 122, 255, .12);
  --on-accent: #ffffff;
  --manila: #9a5300;
  --manila-bg: rgba(255, 228, 186, .72);
  --manila-line: rgba(232, 160, 60, .45);
  --crit: #d70015; --crit-bg: rgba(255, 59, 48, .12);
  --warn: #a84b00; --warn-bg: rgba(255, 149, 0, .15);
  --ok: #1d7a34; --ok-bg: rgba(52, 199, 89, .15);
  --info: #0058d0; --info-bg: rgba(0, 122, 255, .11);
  --bar-high: #ff3b30; --bar-medium: #ff9500; --bar-low: #34c759;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 12px 32px -10px rgba(15, 23, 42, .16);
  --shadow-lg: 0 40px 90px -24px rgba(15, 23, 42, .38), 0 2px 8px rgba(15, 23, 42, .08);
  --blur: blur(42px) saturate(210%) brightness(1.03);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI Variable Display", "Segoe UI", Roboto, Arial, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI Variable Text", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
  --r: 22px;
  --r-sm: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06090f;
    --orb-1: rgba(10, 132, 255, .46); --orb-2: rgba(40, 200, 180, .28); --orb-3: rgba(140, 90, 255, .38); --orb-4: rgba(255, 130, 70, .20); --orb-5: rgba(255, 90, 150, .16);
    --glass: rgba(26, 30, 44, .40); --glass-strong: rgba(48, 52, 68, .62); --glass-soft: rgba(255, 255, 255, .04); --glass-glow: rgba(255, 255, 255, .10); --seg-on: rgba(255, 255, 255, .22);
    --glass-edge: rgba(255, 255, 255, .14); --glass-hi: rgba(255, 255, 255, .22);
    --sheen: linear-gradient(140deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, .04) 32%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, .07) 100%);
    --scrim: rgba(0, 0, 0, .45);
    --ink: #f2f4f8; --muted: #9ba4b4; --line: rgba(255, 255, 255, .08); --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
    --accent: #0a84ff; --accent-2: #5eb0ff; --accent-soft: rgba(10, 132, 255, .22); --on-accent: #ffffff;
    --manila: #ffc368; --manila-bg: rgba(110, 76, 24, .55); --manila-line: rgba(255, 179, 64, .30);
    --crit: #ff6b62; --crit-bg: rgba(255, 69, 58, .18); --warn: #ffb547; --warn-bg: rgba(255, 159, 10, .18);
    --ok: #4fdc72; --ok-bg: rgba(48, 209, 88, .16); --info: #6aabff; --info-bg: rgba(10, 132, 255, .2);
    --bar-high: #ff453a; --bar-medium: #ff9f0a; --bar-low: #30d158;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px -12px rgba(0, 0, 0, .6);
    --shadow-lg: 0 40px 90px -20px rgba(0, 0, 0, .75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #06090f;
  --orb-1: rgba(10, 132, 255, .46); --orb-2: rgba(40, 200, 180, .28); --orb-3: rgba(140, 90, 255, .38); --orb-4: rgba(255, 130, 70, .20); --orb-5: rgba(255, 90, 150, .16);
  --glass: rgba(26, 30, 44, .40); --glass-strong: rgba(48, 52, 68, .62); --glass-soft: rgba(255, 255, 255, .04); --glass-glow: rgba(255, 255, 255, .10); --seg-on: rgba(255, 255, 255, .22);
  --glass-edge: rgba(255, 255, 255, .14); --glass-hi: rgba(255, 255, 255, .22);
  --sheen: linear-gradient(140deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, .04) 32%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, .07) 100%);
  --scrim: rgba(0, 0, 0, .45);
  --ink: #f2f4f8; --muted: #9ba4b4; --line: rgba(255, 255, 255, .08); --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
  --accent: #0a84ff; --accent-2: #5eb0ff; --accent-soft: rgba(10, 132, 255, .22); --on-accent: #ffffff;
  --manila: #ffc368; --manila-bg: rgba(110, 76, 24, .55); --manila-line: rgba(255, 179, 64, .30);
  --crit: #ff6b62; --crit-bg: rgba(255, 69, 58, .18); --warn: #ffb547; --warn-bg: rgba(255, 159, 10, .18);
  --ok: #4fdc72; --ok-bg: rgba(48, 209, 88, .16); --info: #6aabff; --info-bg: rgba(10, 132, 255, .2);
  --bar-high: #ff453a; --bar-medium: #ff9f0a; --bar-low: #30d158;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px -12px rgba(0, 0, 0, .6);
  --shadow-lg: 0 40px 90px -20px rgba(0, 0, 0, .75);
  color-scheme: dark;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: rgba(250, 251, 253, .94); --glass-strong: rgba(255, 255, 255, .97); }
  :root[data-theme="dark"] { --glass: rgba(28, 32, 42, .95); --glass-strong: rgba(40, 44, 56, .97); }
}
@media (prefers-reduced-transparency: reduce) {
  :root { --glass: rgba(250, 251, 253, .97); --glass-strong: #ffffff; --blur: none; }
  :root[data-theme="dark"] { --glass: rgba(26, 30, 40, .98); --glass-strong: #2c303e; }
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; letter-spacing: -.003em; }
[hidden] { display: none !important; }
.wallpaper { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background:
  radial-gradient(42vmax 38vmax at 8% 6%, var(--orb-1), transparent 70%),
  radial-gradient(36vmax 34vmax at 92% 14%, var(--orb-3), transparent 70%),
  radial-gradient(40vmax 36vmax at 78% 96%, var(--orb-2), transparent 70%),
  radial-gradient(30vmax 28vmax at 22% 88%, var(--orb-4), transparent 70%),
  radial-gradient(26vmax 24vmax at 55% 48%, var(--orb-5), transparent 70%),
  var(--bg);
  background-size: 125% 125%; background-position: 0% 0%; }
@media (prefers-reduced-motion: no-preference) { .wallpaper { animation: drift 48s ease-in-out infinite alternate; } }
@keyframes drift { to { background-position: 100% 100%; } }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: 2.05rem; font-weight: 700; line-height: 1.1; letter-spacing: -.028em; }
h2 { font-size: 1.06rem; font-weight: 650; letter-spacing: -.012em; }
h3 { font-size: .95rem; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 1.5px var(--accent) !important; }
.mono { font-family: var(--f-mono); font-size: .84em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.eyebrow { font: 600 .72rem/1.2 var(--f-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* ---------- glass material ---------- */
.side, .card, .tile, .due-box, .actionbar, .stepper, .col, .banner, .dlg, #toast, .lockcard {
  background: var(--sheen), var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 1px 0 0 var(--glass-glow), inset 0 -1px 0 var(--glass-glow), inset 0 0 28px -10px var(--glass-glow), var(--shadow);
}

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.side { display: flex; flex-direction: column; gap: 22px; padding: 18px 12px; position: sticky; top: 12px; margin: 12px 0 12px 12px; height: calc(100vh - 24px); overflow-y: auto; border-radius: 26px; }
.brand { display: flex; gap: 11px; align-items: center; padding: 2px 8px; }
.mark { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(140deg, #64d2ff, #007aff 55%, #5e5ce6); color: #fff; display: grid; place-items: center; font: 700 .7rem var(--f-display); letter-spacing: .03em; flex: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 14px -4px rgba(0, 122, 255, .55); }
.app-name { font: 700 1rem/1.15 var(--f-display); letter-spacing: -.015em; }
.firm { font-size: .78rem; color: var(--muted); line-height: 1.3; }
/* the firm's logo sits on a white tile so it reads in light and dark mode */
.logo-chip { background: #fff; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(15, 23, 42, .08), 0 0 0 1px rgba(15, 23, 42, .05); }
.logo-chip img { display: block; max-width: 100%; max-height: 54px; object-fit: contain; }
.side .logo-chip { margin: -8px 8px 0; }
.lockcard .logo-chip { justify-self: center; max-width: 280px; padding: 12px 16px; }
.lockcard .logo-chip img { max-height: 72px; }
.mark.logo-mark { background: none; overflow: hidden; }
.mark.logo-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lockcard .mark.logo-mark { width: 76px; height: 76px; border-radius: 20px; }
.help-find { display: grid; gap: 10px; margin-top: 6px; }
.setup-list { list-style: none; margin: 12px 0 0; padding: 0; }
.setup-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.setup-t { font-weight: 600; font-size: .92rem; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--glass-strong); display: grid; place-items: center; font: 700 .78rem var(--f-body); color: #fff; padding: 0; }
.tick[data-act] { cursor: pointer; border-color: var(--accent); }
.tick.on { background: var(--ok); border-color: transparent; }
.tick:disabled { opacity: 1; }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: inherit; background: var(--ok); }
.routine { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
.routine h3 { font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.routine ul { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; font-size: .88rem; }
.guide { border-top: 1px solid var(--line); }
.guide > summary { list-style: none; cursor: pointer; padding: 13px 20px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.guide > summary::-webkit-details-marker { display: none; }
.guide > summary::after { content: "+"; color: var(--muted); font-weight: 500; font-size: 1.1rem; line-height: 1; }
.guide[open] > summary::after { content: "−"; }
.guide > summary:hover { background: var(--fill); }
.gbody { padding: 0 20px 16px; display: grid; gap: 10px; font-size: .9rem; }
.gbody ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.gbody .tip { color: var(--muted); font-size: .84rem; }
.gloss { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 8px 18px; margin: 0; font-size: .88rem; }
.gloss dt { font-weight: 600; }
.gloss dd { margin: 0; color: var(--muted); }
.logo-set { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.logo-set .logo-chip img { max-height: 44px; max-width: 220px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 500; transition: background .15s; }
.nav a:hover { background: var(--fill); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 6px 16px -6px rgba(0, 122, 255, .6); }
.nav .count { font: 600 .72rem var(--f-body); font-variant-numeric: tabular-nums; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 99px; background: var(--fill); color: var(--muted); }
.nav .count.hot { background: var(--bar-high); color: #fff; }
.nav a[aria-current="page"] .count { background: rgba(255, 255, 255, .25); color: #fff; }
.side-foot { margin-top: auto; padding: 12px 10px 2px; border-top: 1px solid var(--line); display: grid; gap: 2px; font-size: .8rem; color: var(--muted); }
.side-foot strong { color: var(--ink); font-weight: 600; }
.side-foot .theme-seg { justify-self: start; margin-bottom: 10px; }

.main { min-width: 0; padding-block: 30px 72px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; max-width: 1380px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
.page-head .lede { color: var(--muted); max-width: 64ch; margin-top: 6px; font-size: .95rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 11px 12px 11px 18px; border-radius: 18px; background: var(--sheen), var(--manila-bg); border-color: var(--manila-line); font-size: .88rem; }
.banner strong { color: var(--manila); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--glass-edge); background: var(--glass-strong); color: var(--ink); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: .86rem; cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2; box-shadow: inset 0 1px 0 var(--glass-hi), 0 1px 2px rgba(15, 23, 42, .06); transition: transform .12s, filter .15s, background .15s; }
.btn:hover { color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 6px 16px -6px rgba(0, 122, 255, .7); }
.btn.primary:hover { filter: brightness(1.06); color: var(--on-accent); }
.btn.danger { color: var(--crit); }
.btn.danger.solid { background: linear-gradient(180deg, #ff6259, #ff3b30); color: #fff; border-color: transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 6px 16px -6px rgba(255, 59, 48, .6); }
.btn.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--accent); padding-inline: 8px; }
.btn.quiet:hover { background: var(--accent-soft); }
.btn.sm { padding: 5px 12px; font-size: .78rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(.4); transform: none; }
.field { display: grid; gap: 5px; font-size: .78rem; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea, .inp { border: 1px solid var(--line); background: var(--glass-strong); border-radius: var(--r-sm); padding: 8px 11px; font-weight: 400; font-size: .9rem; color: var(--ink); min-width: 0; width: 100%; box-shadow: inset 0 1px 2px rgba(15, 23, 42, .04); transition: box-shadow .15s, border-color .15s; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 70px; }
.inp.sm { padding: 5px 9px; font-size: .82rem; width: auto; border-radius: 10px; }
.inp.search { border-radius: 999px; padding: 8px 16px; background: var(--fill); border-color: transparent; box-shadow: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.span2 { grid-column: span 2; }
.check { display: inline-flex; gap: 9px; align-items: flex-start; font-size: .88rem; cursor: pointer; }
.check input { margin-top: 3px; }
input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; }

/* ---------- chips & pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .74rem; font-weight: 600; white-space: nowrap; line-height: 1.55; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.crit { color: var(--crit); background: var(--crit-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.ok { color: var(--ok); background: var(--ok-bg); }
.info { color: var(--info); background: var(--info-bg); }
.neutral { color: var(--muted); background: var(--fill); }
.manila-chip { color: var(--manila); background: var(--manila-bg); }
.tag { display: inline-block; font-size: .7rem; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--fill); color: var(--muted); white-space: nowrap; }

/* ---------- cards & tables ---------- */
.card { border-radius: var(--r); min-width: 0; overflow: hidden; }
.card > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 18px 20px 12px; }
.card > header p { color: var(--muted); font-size: .82rem; margin-top: 1px; }
.card .body { padding: 0 20px 20px; }
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .86rem; }
.t th { text-align: left; font: 600 .74rem/1.2 var(--f-body); color: var(--muted); padding: 9px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--glass-soft); white-space: nowrap; }
.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t th:first-child, .t td:first-child { padding-left: 20px; }
.t th:last-child, .t td:last-child { padding-right: 20px; }
.t tbody tr:last-child td { border-bottom: 0; }
.t tr.click { cursor: pointer; }
.t tbody tr { transition: background .12s; }
.t tbody tr:hover td { background: var(--glass-soft); }
.t .name { font-weight: 600; color: var(--ink); text-decoration: none; }
.t .name:hover { color: var(--accent); }
.t .sub { display: block; color: var(--muted); font-size: .75rem; font-family: var(--f-mono); }
.t td.right, .t th.right { text-align: right; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }

.meter { display: inline-flex; align-items: center; gap: 8px; }
.meter .track { width: 64px; height: 6px; background: var(--fill-strong); border-radius: 99px; overflow: hidden; }
.meter .fill { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.meter .fill.ok { background: var(--bar-low); }
.meter .fill.warn { background: var(--bar-medium); }

/* ---------- overview ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.tile { --tone: var(--accent); border-radius: 20px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; position: relative; overflow: hidden; color: var(--ink); transition: transform .15s, box-shadow .15s; }
.tile::before { content: ""; position: absolute; width: 150px; height: 150px; right: -50px; top: -60px; border-radius: 50%; background: var(--tone); opacity: .22; filter: blur(34px); pointer-events: none; }
.tile:hover { transform: translateY(-2px); }

const SEV = [['Urgent', 'crit'], ['High', 'warn'], ['Due', 'info'], ['Watch', 'neutral']];
let _tasks = null;
function tasks() {
  if (_tasks) return _tasks;
  const s = S.settings, out = [];
  for (const c of active()) {
    const days = daysToReview(c), r = c.refresh;
    const add = (sev, kind, text, act, label, type) => out.push({ c, sev, kind, text, act, label, type });
    if (!r && c.status === 'onboarding') add(1, 'onboard', 'New client: onboarding not started', 'start', 'Start onboarding');
    else if (!r) {
      if (days < 0) add(c.risk === 'high' ? 0 : 1, 'overdue', `Periodic review overdue by ${plural(-days, 'day')}`, 'start', 'Start refresh');
      else if (days <= 30) add(2, 'due', `Review due in ${plural(days, 'day')}, not started`, 'start', 'Start refresh');
    } else if (r.stage === 'awaiting') {
      const waited = diffDays(parse(r.requested), TODAY);
      const [c1, c2, c3] = s.chase;
      if (r.escalated) add(1, 'escalated', `Escalated to MLRO ${fmt(r.escalated)}. Client still has not responded`, 'open', 'Open file');
      else if (waited >= c3) add(0, 'escalate', `No response after ${waited} days. Escalate to MLRO`, 'escalate', 'Escalate');
      else if (waited >= c2 && r.chases < 2) add(1, 'chase', `Requested ${waited} days ago. Send final reminder`, 'chase', 'Log reminder');
      else if (waited >= c1 && r.chases < 1) add(2, 'chase', `Requested ${waited} days ago. Send first reminder`, 'chase', 'Log reminder');
    } else if (r.stage === 'verify') add(2, 'verify', 'Documents received. Verify and certify', 'open', 'Verify');
    else if (r.stage === 'screening') add(2, 'screening', 'Run sanctions, PEP and adverse media screening', 'screen', 'Record screening');
    else if (r.stage === 'signoff') { if (c.status === 'onboarding') add(2, 'accept', 'New client ready to accept or decline', 'accept', 'Accept or decline'); else add(2, 'signoff', 'Ready for MLRO sign-off', 'signoff', 'Sign off'); }

    for (const t of defs(c)) {
      const d = c.docs[t.k];
      if (!d || !d.exp || d.s === 'requested') continue;
      const e = expDays(d.exp);
      if (e < 0) add(1, 'expired', `${t.short} expired ${fmt(d.exp)}`, 'open', 'Open file');
      else if (e <= s.expiryWarn) add(3, 'expiring', `${t.short} expires ${fmt(d.exp)} (${plural(e, 'day')})`, 'open', 'Open file');
    }
    for (const p of c.parties) {
      if (!p.idExp || p.req) continue;
      const e = expDays(p.idExp);
      if (e < 0) add(1, 'expired', `ID for ${p.name} (${p.role}) expired ${fmt(p.idExp)}`, 'open', 'Open file');
      else if (e <= s.expiryWarn) add(3, 'expiring', `ID for ${p.name} (${p.role}) expires ${fmt(p.idExp)}`, 'open', 'Open file');
    }
    for (const m of c.matters) {
      if (m.status !== 'open') continue;
      if (m.fit === 'no') add(1, 'fit', `Matter ${m.ref} doesn't fit the client's profile. Consider an internal report`, 'sarnew', 'Log report');
      else if (m.fit === 'unclear') add(2, 'fit', `Matter ${m.ref}: check it fits what you know about the client`, 'open', 'Open file');
      if (m.sofStatus === 'outstanding' || m.sofStatus === 'requested') add(2, 'sof', `Matter ${m.ref}: source of funds ${SOF[m.sofStatus][0].toLowerCase()}`, 'open', 'Open file');
    }
    if (c.pep && c.pep.status === 'current' && !c.pep.approvedBy) add(1, 'pep', 'PEP: record the public function and senior management approval', 'decide', 'Record approval', 'pepupd');
    const tail = pepTailEnd(c);
    if (c.pep && c.pep.status === 'former' && tail && !isPep(c) && c.risk === 'high' && c.last < iso(tail) && !c.decisions.some(x => x.d >= iso(tail) && ['lower', 'review'].includes(x.type))) add(2, 'peptail', `Former PEP: enhanced measures ended ${fmtD(tail)}. Decide whether to lower the rating`, 'decide', 'Review rating', 'lower');
    if (c.status === 'restricted' && !r) add(1, 'restricted', 'Services restricted with no review in progress. Start a review or decide on the restriction', 'decide', 'Decide', 'lift');
    if (!r && c.status !== 'onboarding' && screenStale(c)) add(2, 'rescreen', `Screening last run ${c.screening ? fmt(c.screening.date) : 'never'}. Re-screen`, 'screen', 'Record screening');
    if (c.file.out) {
      const o = diffDays(parse(c.file.out.since), TODAY);
      if (o >= s.fileOutDays) add(3, 'file', `Paper file out with ${c.file.out.to} for ${o} days`, 'checkin', 'Mark returned');
    }
  }
  return (_tasks = out.sort((a, b) => a.sev - b.sev || a.c.name.localeCompare(b.c.name)));
}

function dueChart(A) {
  const b = Array.from({ length: 13 }, (_, i) => ({ high: 0, medium: 0, low: 0, i }));
  for (const c of A) {
    const nr = nextReview(c);
    if (nr < TODAY) { b[0][c.risk]++; continue; }
    const off = (nr.getFullYear() - TODAY.getFullYear()) * 12 + nr.getMonth() - TODAY.getMonth();
    if (off < 12) b[off + 1][c.risk]++;
  }
  const tot = b.map(x => x.high + x.medium + x.low);
  const max = Math.max(1, ...tot);
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const W = 660, H = 230, L = 30, R = 8, T = 18, B = 40;
  const cw = (W - L - R) / 13, bw = cw * .58, y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  let bars = '';
  b.forEach((x, i) => {
    const cx = L + cw * i + cw / 2;
    let acc = 0;
    for (const r of RISKS) {
      if (!x[r]) continue;
      const y0 = y(acc), y1 = y(acc + x[r]);
      bars += `<rect class="r-${r}" x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" rx="3"><title>${x[r]} ${r} risk</title></rect>`;
      acc += x[r];
    }
    if (tot[i]) bars += `<text class="val" x="${cx}" y="${y(tot[i]) - 5}" text-anchor="middle">${tot[i]}</text>`;
    let label, cls = 'ax';
    if (i === 0) { label = 'Overdue'; cls = 'ax-strong'; }
    else { const m = (TODAY.getMonth() + i - 1) % 12; label = MONTHS[m]; if (m === 0) bars += `<text class="ax" x="${cx}" y="${H - B + 30}" text-anchor="middle">${TODAY.getFullYear() + Math.floor((TODAY.getMonth() + i - 1) / 12)}</text>`; }
    bars += `<text class="${cls}" x="${cx}" y="${H - B + 16}" text-anchor="middle">${label}</text>`;
  });
  const sepX = L + cw;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Number of reviews overdue and due in each of the next 12 months">${g}<line class="sep" x1="${sepX}" x2="${sepX}" y1="${T - 6}" y2="${H - B}"/>${bars}</svg>`;
}

  </section>`;
}
function filteredClients() {
  const q = F.q.trim().toLowerCase(), s = S.settings;
  const T = F.bucket === 'expiry' || F.bucket === 'chase' ? tasks() : [];
  return S.clients.filter(c => {
    if (F.bucket !== 'exited' && isClosed(c)) return false;
    if (q && ![c.name, c.id, c.file.ref, c.country, c.contact].join(' ').toLowerCase().includes(q)) return false;
    if (F.risk && c.risk !== F.risk) return false;
    if (F.type && c.type !== F.type) return false;
    const d = daysToReview(c);
    switch (F.bucket) {
      case 'overdue': return d < 0;
      case 'due': return d >= 0 && d <= s.lead;
      case 'inprog': return !!c.refresh;
      case 'current': return d > s.lead && !c.refresh;
      case 'restricted': return c.status === 'restricted';
      case 'exited': return isClosed(c);
      case 'onboarding': return c.status === 'onboarding';
      case 'pep': return !!c.pep;
      case 'expiry': return T.some(t => t.c === c && (t.kind === 'expired' || t.kind === 'expiring'));
      case 'chase': return T.some(t => t.c === c && (t.kind === 'chase' || t.kind === 'escalate'));
      default: return true;
    }
  }).sort((a, b) => daysToReview(a) - daysToReview(b));
}
function renderClientRows() {
  const tb = $('#client-rows'); if (!tb) return;
  const all = filteredClients(), rows = all.slice(0, F.limit);

function viewPipeline() {
  const A = active(), s = S.settings;
  const cols = [{ k: 'due', n: 'Due, not started', d: `Overdue or due within ${s.lead} days.` }, ...STAGES];
  const card = c => {
    const r = c.refresh;
    let meta = '';
    if (!r && c.status === 'onboarding') meta = 'New client, onboarding not started';
    else if (!r) { const d = daysToReview(c); meta = d < 0 ? `<span class="pill crit">Overdue ${-d}d</span>` : `Due ${fmtD(nextReview(c))}`; }
    else if (r.stage === 'awaiting') { const w = diffDays(parse(r.requested), TODAY); meta = `Requested ${w}d ago · ${plural(r.chases, 'reminder')}${r.escalated ? ' · <span class="pill crit plain">Escalated</span>' : ''}`; }
    else if (r.stage === 'verify') { const p = docProgress(c); meta = `${p.ok}/${p.n} verified`; }
    else if (r.stage === 'screening') meta = c.screening && c.screening.date >= r.started ? 'Screening recorded' : 'Screening not yet run';

    return `<div class="kcard" data-act="open" data-id="${c.id}" tabindex="0" role="link"><div class="top"><span class="nm">${esc(c.name)}</span>${riskPill(c.risk)}</div><span class="meta mono">${c.id} · ${TYPES[c.type]}</span>${c.status === 'onboarding' ? '<span class="pill info plain" style="justify-self:start">New client</span>' : ''}<span class="meta">${meta}</span></div>`;
  };
  const inCol = k => A.filter(c => k === 'due' ? (!c.refresh && (c.status === 'onboarding' || daysToReview(c) <= s.lead)) : (c.refresh && c.refresh.stage === k)).sort((a, b) => daysToReview(a) - daysToReview(b));
  return `
  ${sampleBanner()}
  <div class="page-head"><div><h1>Refresh pipeline</h1><p class="lede">Each periodic review moves left to right. Open a card to take the next step; a stage only completes when its checks are done.</p></div></div>

}

function viewOutreach() {
  const s = S.settings;
  const waiting = active().filter(c => c.refresh && c.refresh.stage === 'awaiting').sort((a, b) => a.refresh.requested.localeCompare(b.refresh.requested));
  const all = [];
  S.clients.forEach(c => c.outreach.forEach(o => all.push({ c, o })));
  all.sort((a, b) => b.o.d.localeCompare(a.o.d));
  const nextStep = c => {
    const r = c.refresh, w = diffDays(parse(r.requested), TODAY), [c1, c2, c3] = s.chase;
    if (r.escalated) return '<span class="pill crit plain">Escalated to MLRO</span>';
    if (w >= c3) return '<span class="pill crit plain">Escalate now</span>';
    if (w >= c2 && r.chases < 2) return '<span class="pill warn plain">Final reminder due</span>';
    if (w >= c1 && r.chases < 1) return '<span class="pill warn plain">First reminder due</span>';
    const nxt = r.chases < 1 ? c1 : r.chases < 2 ? c2 : c3;
    return `<span class="muted small">Next chase ${fmtD(addDays(parse(r.requested), nxt))}</span>`;
  };
  return `
  ${sampleBanner()}
  <div class="page-head"><div><h1>Outreach</h1><p class="lede">Clients you have asked for documents. Reminders go at ${s.chase[0]} and ${s.chase[1]} days, and the file is escalated to the MLRO at ${s.chase[2]} days without a response.</p></div><div class="row"><button class="btn primary" data-act="workpack">Work pack for ${esc(asst())}</button></div></div>

    ${waiting.slice(0, 300).map(c => { const r = c.refresh; const w = diffDays(parse(r.requested), TODAY); const out = outstanding(c);
      return `<tr><td><a class="name" href="#client-${c.id}">${esc(c.name)}</a><span class="sub">${c.id}</span></td><td class="num">${fmt(r.requested)}</td><td class="num mono">${w}d</td><td class="num mono">${r.chases}</td><td>${out.length}</td>
      <td class="small"><span class="mono">${esc(c.email)}</span><br><span class="mono">${esc(c.phone)}</span></td><td>${nextStep(c)}</td>
      <td class="right"><div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="letter" data-id="${c.id}" data-kind="${r.chases ? 'final' : 'reminder'}">Draft letter</button>${r.escalated ? '' : w >= s.chase[2] ? `<button class="btn sm primary" data-act="escalate" data-id="${c.id}">Escalate</button>` : `<button class="btn sm primary" data-act="chase" data-id="${c.id}">Log reminder</button>`}</div></td></tr>`; }).join('')}
    </tbody></table>` : '<p class="empty">No clients are waiting on a document request.</p>'}</div>
  </section>
  <section class="card">
    <header><div><h2>Contact log</h2><p>Every request and reminder, newest first</p></div></header>
    <div class="scroll">${all.length ? `<table class="t"><thead><tr><th>Date</th><th>Client</th><th>Type</th><th>Method</th><th>Note</th><th>By</th></tr></thead><tbody>
    ${all.slice(0, 60).map(({ c, o }) => `<tr><td class="num mono">${o.d}</td><td><a class="name" href="#client-${c.id}">${esc(c.name)}</a></td><td>${esc(o.kind)}</td><td>${esc(o.m)}</td><td>${esc(o.note)}</td><td class="muted">${esc(o.by)}</td></tr>`).join('')}

}

function viewClient(c) {
  const s = S.settings, r = c.refresh, d = daysToReview(c), nr = nextReview(c);
  const dueCls = d < 0 ? 'crit' : d <= 30 ? 'warn' : d <= s.lead ? 'info' : 'ok';
  const dueTxt = d < 0 ? `Overdue by ${plural(-d, 'day')}` : d === 0 ? 'Due today' : `In ${plural(d, 'day')}`;
  const si = r ? STAGES.findIndex(x => x.k === r.stage) : -1;
  const onb = c.status === 'onboarding';
  const steps = [{ n: onb ? 'New client' : 'Due' }, ...STAGES.map(x => (onb && x.k === 'signoff' ? { n: 'Accept or decline' } : x))];
  const stepper = `<div class="stepper" aria-label="Refresh progress">${steps.map((x, i) => {
    const cls = !r ? (i === 0 && (onb || d <= s.lead) ? 'now' : '') : i - 1 < si ? 'done' : i - 1 === si ? 'now' : '';
    return `<div class="step ${cls}"><span class="idx">${cls === 'done' ? 'Done' : 'Step ' + (i + 1)}</span><b>${x.n}</b></div>`;
  }).join('')}</div>`;

  // stage action bar
  let bar = '';
  const g = gate(c);
  if (!r && onb) {
    bar = `<span class="why">New client. Start onboarding to request identification documents and draft the letter.</span><button class="btn primary" data-act="start" data-id="${c.id}">Start onboarding</button>`;
  } else if (!r) {
    bar = `<span class="why">${d <= s.lead ? 'This review is due. Start the refresh to choose what to request and draft the letter.' : `No refresh due until ${fmtD(nr)}. You can start one early after a trigger event (new owner, adverse media, unusual activity).`}</span><button class="btn ${d <= s.lead ? 'primary' : ''}" data-act="start" data-id="${c.id}">Start refresh</button>`;
  } else if (r.stage === 'awaiting') {
    const out = outstanding(c);
    bar = `<span class="why">Requested ${fmt(r.requested)} by ${esc(r.method.toLowerCase())}. ${plural(out.length, 'item')} outstanding, ${plural(r.chases, 'reminder')} sent. Mark documents as received below as they arrive.</span>
      <div class="row"><button class="btn" data-act="letter" data-id="${c.id}" data-kind="${r.chases ? 'final' : 'reminder'}">Draft letter</button>${r.escalated ? '' : `<button class="btn" data-act="chase" data-id="${c.id}">Log reminder</button><button class="btn" data-act="escalate" data-id="${c.id}">Escalate</button>`}<button class="btn primary" data-act="advance" data-id="${c.id}">Documents received</button></div>`;
  } else if (r.stage === 'verify') {
    bar = `<span class="why">${g ? `Still to verify: ${esc(g.slice(0, 4).join('; '))}${g.length > 4 ? ` and ${g.length - 4} more` : ''}.` : 'All required documents and connected parties are verified.'}</span><button class="btn primary" data-act="advance" data-id="${c.id}" ${g ? 'disabled' : ''}>Verification complete</button>`;
  } else if (r.stage === 'screening') {
    bar = `<span class="why">${g ? 'Run sanctions, PEP and adverse media screening on the client and every connected party, then confirm the risk assessment.' : `Screening recorded ${fmt(c.screening.date)}: ${esc(c.screening.result)}.`}</span><div class="row"><button class="btn ${g ? 'primary' : ''}" data-act="screen" data-id="${c.id}">Record screening</button><button class="btn ${g ? '' : 'primary'}" data-act="advance" data-id="${c.id}" ${g ? 'disabled' : ''}>Send to sign-off</button></div>`;
  } else if (onb) {
    bar = `<span class="why">Due diligence is complete. Accept the client, which sets the first review date, or decline.</span><button class="btn primary" data-act="accept" data-id="${c.id}">Accept or decline</button>`;
  } else {
    bar = `<span class="why">Everything is in place. The approver confirms the risk rating, and the next review date is set from it.</span><button class="btn primary" data-act="signoff" data-id="${c.id}">Sign off review</button>`;
  }

  const sp = scanProgress(c), dp = docProgress(c);
  const o = c.file.out;
  const sug = suggested(c);
  return `
  <div class="crumb"><a href="#clients">Clients</a> <span class="muted">/ ${c.id}</span></div>
  <div class="client-head">
    <div>
      <div class="eyebrow">${TYPES[c.type]} · ${esc(c.country)}</div>
      <h1>${esc(c.name)}</h1>
      <div class="ids"><span class="mono">${c.id}</span>${riskPill(c.risk)}<span class="tag">${cap(c.risk)} risk</span>${c.pep ? `<span class="pill ${isPep(c) ? 'crit' : 'neutral'} plain">${esc(pepLabel(c))}</span>` : ''}${statusChip(c)}<span class="tag">${esc(service(c))}</span>${c.status === 'declined' ? '' : `<button class="btn sm" data-act="decide" data-id="${c.id}">Change risk status</button>`}</div>
    </div>
    ${onb ? `<div class="due-box"><span class="eyebrow">Onboarding</span><span class="d">${r ? esc(stageName(r.stage)) : 'Not started'}</span><span class="pill info" style="justify-self:start">New client</span><span class="small muted">${r ? 'Started ' + fmt(r.started) : 'Not yet started'}</span></div>`
      : isClosed(c) ? `<div class="due-box"><span class="eyebrow">${cap(c.status)}</span><span class="d">${endDate(c) ? fmt(endDate(c)) : 'End date not set'}</span><span class="small muted">${retention(c).until ? 'Keep records until ' + fmtD(retention(c).until) : 'Set the end date on the Paper files page'}</span></div>`
      : `<div class="due-box"><span class="eyebrow">Next periodic review</span><span class="d num">${fmtD(nr)}</span><span class="pill ${dueCls}" style="justify-self:start">${dueTxt}</span><span class="small muted">Every ${s.cycles[c.risk]} months · last ${fmt(c.last)}</span></div>`}
  </div>
  ${isClosed(c) ? '' : stepper}
  ${isClosed(c) ? '' : `<div class="actionbar">${bar}</div>`}
  <div class="cols">
    <div class="stack">
      <section class="card">
        <header><div><h2>Documents</h2><p>${dp.ok} of ${dp.n} required documents verified · ${sp.s} of ${sp.n} on file scanned</p></div><div class="row"><button class="btn sm" data-act="checklist" data-id="${c.id}">File checklist</button></div></header>
        <div class="scroll">${docsTable(c)}</div>
      </section>
      <section class="card">
        <header><div><h2>Connected parties</h2><p>${partyHint(c)}</p></div></header>
        <div class="scroll">${partiesTable(c)}</div>
      </section>
      ${decisionsCard(c)}
      ${mattersCard(c)}
      <section class="card">
        <header><div><h2>Outreach</h2><p>Requests and reminders sent to this client</p></div><button class="btn sm" data-act="letter" data-id="${c.id}" data-kind="${r && r.chases ? 'final' : r ? 'reminder' : 'request'}">Draft letter</button></header>
        <div class="body">${c.outreach.length ? `<ul class="timeline">${c.outreach.map(x => `<li><time>${x.d}</time><span><b>${esc(x.kind)}</b> · ${esc(x.m)}<br><span class="muted">${esc(x.note)}${x.by ? ' · ' + esc(x.by) : ''}</span></span></li>`).join('')}</ul>` : '<p class="muted small">No contact recorded.</p>'}</div>
      </section>
      <section class="card">
        <header><div><h2>Audit trail</h2><p>Every change made to this file</p></div></header>
        <div class="body"><ul class="timeline">${c.history.slice(0, 40).map(h => `<li><time>${h.d}</time><span>${esc(h.t)} <span class="muted">· ${esc(h.by)}</span></span></li>`).join('')}</ul></div>
      </section>
    </div>
    <div class="stack">
      <section class="manila" data-tab="PAPER FILE">
        <div class="row" style="justify-content:space-between"><span class="ref">${esc(c.file.ref)}</span>${o ? '<span class="pill warn plain">Checked out</span>' : '<span class="pill ok plain">In cabinet</span>'}</div>
        <dl class="kv"><dt>Location</dt><dd>${esc(c.file.loc)}</dd>${o ? `<dt>With</dt><dd>${esc(o.to)}</dd><dt>Since</dt><dd>${fmt(o.since)} (${diffDays(parse(o.since), TODAY)} days)</dd><dt>Purpose</dt><dd>${esc(o.purpose || '—')}</dd>` : ''}<dt>Scanned</dt><dd>${meter(sp.s, sp.n, 'warn')}</dd></dl>
        <div class="row">${o ? `<button class="btn sm" data-act="checkin" data-id="${c.id}">Mark returned</button>` : `<button class="btn sm" data-act="checkout" data-id="${c.id}">Check out</button>`}<button class="btn sm" data-act="checklist" data-id="${c.id}">Print cover sheet</button></div>
      </section>
      <section class="card">
        <header><h2>Client details</h2><button class="btn sm" data-act="edit" data-id="${c.id}">Edit</button></header>
        <div class="body"><dl class="kv">
          <dt>Contact</dt><dd>${esc(c.contact)}</dd><dt>Email</dt><dd class="mono">${esc(c.email) || '—'}</dd><dt>Phone</dt><dd class="mono">${esc(c.phone) || '—'}</dd>
          <dt>Address</dt><dd style="white-space:pre-line">${esc(c.address) || '—'}</dd><dt>Partner</dt><dd>${esc(c.rm) || '—'}</dd><dt>Onboarded</dt><dd>${fmt(c.onboarded)}</dd>
          ${c.note ? `<dt>Note</dt><dd>${esc(c.note)}</dd>` : ''}
        </dl></div>
      </section>
      <section class="card">
        <header><div><h2>Risk assessment</h2><p>Changes are logged to the audit trail</p></div></header>
        <div class="body ra">
          ${RISK_FACTORS.map(f => f.k === 'pep' ? `<div class="ra-pep"><span>${f.n}</span><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${c.pep ? esc(pepLabel(c)) : 'No'}</b><button class="btn sm quiet" data-act="decide" data-id="${c.id}" data-type="${c.pep && c.pep.status === 'current' ? 'pepoff' : 'pep'}">${c.pep && c.pep.status === 'current' ? 'Change' : 'Mark as PEP'}</button></div></div>` : `<label for="ra-${f.k}">${f.n}<select id="ra-${f.k}" data-ra="${f.k}" data-id="${c.id}">${f.o.map((x, i) => `<option value="${i}" ${(c.ra[f.k] || 0) === i ? 'selected' : ''}>${x[0]} (${x[1]})</option>`).join('')}</select></label>`).join('')}
          <div class="score"><b class="num">${raScore(c)}</b><span>Suggested rating ${riskPill(sug)}</span></div>
          <p class="note">8 or more is high, 4 to 7 medium, 3 or less low. A PEP is always high.${sug !== c.risk ? '' : ' The suggested rating matches the current rating.'}</p>
          ${sug !== c.risk ? `<div class="callout warn">Current rating is ${cap(c.risk)}. ${c.note ? 'Check the override note before changing it.' : ''}<div class="row" style="margin-top:8px"><button class="btn sm" data-act="decide" data-id="${c.id}" data-type="${RANK[sug] > RANK[c.risk] ? 'raise' : 'lower'}" data-risk="${sug}">Change to ${cap(sug)}</button></div></div>` : ''}
        </div>
      </section>
      <section class="card">
        <header><h2>Screening</h2><button class="btn sm" data-act="screen" data-id="${c.id}">Record screening</button></header>
        <div class="body">${c.screening ? `<dl class="kv"><dt>Last run</dt><dd>${fmt(c.screening.date)} ${screenStale(c) ? '<span class="pill crit plain">Due</span>' : ''}</dd><dt>Result</dt><dd>${esc(c.screening.result)}</dd><dt>Checked</dt><dd>${esc(c.screening.lists)}</dd><dt>By</dt><dd>${esc(c.screening.by)}</dd></dl>` : '<p class="muted small">Not screened yet.</p>'}
        <p class="note" style="margin-top:8px">${cap(c.risk)} risk clients are re-screened every ${s.screen[c.risk]} months.</p></div>
      </section>
      ${isClosed(c) || onb ? '' : `<button class="btn quiet" data-act="cancelrefresh" data-id="${c.id}" ${r ? '' : 'hidden'}>Cancel this refresh</button>`}
    </div>
  </div>`;
}

function docsTable(c) {
  const rows = defs(c);
  return `<table class="t docs"><thead><tr><th>Document</th><th>Status</th><th>Received</th><th>Expires</th><th>On paper</th><th>Scan</th></tr></thead><tbody>
  ${rows.map(t => {
    const d = doc(c, t.k), st = docState(d), e = expDays(d.exp);
    const tags = [t.refresh ? 'Each review' : 'Once', t.when === 'high' ? 'High risk' : '', t.when === 'optional' ? 'Optional' : ''].filter(Boolean);
    const sel = `<select class="st ${DOC_STATUS[d.s].cls}" id="doc-${t.k}-s" data-doc="${t.k}" data-f="s" data-id="${c.id}" aria-label="Status">${['missing', 'requested', 'received', 'verified'].map(k => `<option value="${k}" ${d.s === k ? 'selected' : ''}>${DOC_STATUS[k].n}</option>`).join('')}</select>`;
    return `<tr><td><span class="doc-name">${esc(t.n)}</span><span class="doc-tags">${tags.map(x => `<span class="tag">${x}</span>`).join('')}${st === 'expired' ? '<span class="pill crit plain">Expired</span>' : e != null && e <= S.settings.expiryWarn ? `<span class="pill warn plain">Expires in ${e}d</span>` : ''}</span></td>
      <td>${sel}</td>
      <td><input class="inp sm" type="date" id="doc-${t.k}-rec" data-doc="${t.k}" data-f="rec" data-id="${c.id}" value="${d.rec || ''}" aria-label="Date received"></td>
      <td><input class="inp sm" type="date" id="doc-${t.k}-exp" data-doc="${t.k}" data-f="exp" data-id="${c.id}" value="${d.exp || ''}" aria-label="Expiry date"></td>
      <td><input type="checkbox" id="doc-${t.k}-paper" data-doc="${t.k}" data-f="paper" data-id="${c.id}" ${d.paper ? 'checked' : ''} aria-label="Original or certified copy on the paper file"></td>
      <td><span class="scanbox"><input type="checkbox" id="doc-${t.k}-scan" data-doc="${t.k}" data-f="scan" data-id="${c.id}" ${d.scan ? 'checked' : ''} aria-label="Scanned">${d.att ? `<button class="btn sm quiet" data-act="viewatt" data-id="${c.id}" data-k="${t.k}">View</button>` : `<button class="btn sm quiet" data-act="attach" data-id="${c.id}" data-k="${t.k}">Attach</button>`}</span></td></tr>`;
  }).join('')}</tbody></table>`;
}
function partyHint(c) {
  return { individual: 'Joint clients and anyone acting for the client', company: 'Directors, beneficial owners, shareholders and signatories', trust: 'Settlor, trustees, protector and beneficiaries', partnership: 'Partners, beneficial owners and signatories' }[c.type] + '. Each needs certified ID and proof of address.';
}
function partiesTable(c) {
  const rows = c.parties.map(p => {
    const e = expDays(p.idExp);
    const flag = e == null ? '' : e < 0 ? '<span class="pill crit plain">ID expired</span>' : e <= S.settings.expiryWarn ? `<span class="pill warn plain">ID expires in ${e}d</span>` : '';
    return `<tr><td><b>${esc(p.name)}</b> ${p.req ? '<span class="pill info plain">Requested</span>' : ''} ${flag}</td><td>${esc(p.role)}</td><td class="num mono">${p.pct !== '' && p.pct != null ? esc(p.pct) + '%' : '—'}</td>
      <td><input class="inp sm" type="date" id="party-${p.id}-idExp" data-party="${p.id}" data-f="idExp" data-id="${c.id}" value="${p.idExp || ''}" aria-label="ID expiry"></td>
      <td><input type="checkbox" id="party-${p.id}-idOk" data-party="${p.id}" data-f="idOk" data-id="${c.id}" ${p.idOk ? 'checked' : ''} aria-label="Certified ID verified"></td>
      <td><input type="checkbox" id="party-${p.id}-poaOk" data-party="${p.id}" data-f="poaOk" data-id="${c.id}" ${p.poaOk ? 'checked' : ''} aria-label="Proof of address verified"></td>
      <td class="right"><button class="btn sm quiet" data-act="delparty" data-id="${c.id}" data-p="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button></td></tr>`;
  }).join('');
  return `<table class="t"><thead><tr><th>Name</th><th>Role</th><th>Owns</th><th>ID expires</th><th>ID verified</th><th>Address verified</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="muted small">No connected parties recorded.</td></tr>'}
  <tr><td><input class="inp sm" id="np-name" placeholder="Full name" style="width:100%"></td><td><select class="inp sm" id="np-role">${ROLES[c.type].map(r => `<option>${r}</option>`).join('')}</select></td><td><input class="inp sm" id="np-pct" type="number" min="0" max="100" placeholder="%" style="width:64px"></td><td><input class="inp sm" id="np-exp" type="date" aria-label="ID expiry"></td><td colspan="3" class="right"><button class="btn sm" data-act="addparty" data-id="${c.id}">Add party</button></td></tr></tbody></table>`;
}

function outstanding(c) {
  const items = reqDefs(c).filter(t => ['missing', 'requested', 'expired'].includes(docState(doc(c, t.k)))).map(t => t.n);
  c.parties.forEach(p => { if (p.req || (p.idExp && !partyOK(p))) items.push(`Certified ID and proof of address for ${p.name} (${p.role})`); });
  return items;
}
function gate(c) {
  const r = c.refresh; if (!r) return null;
  if (r.stage === 'verify') {
    const miss = reqDefs(c).filter(t => !docOK(doc(c, t.k))).map(t => t.short);
    c.parties.filter(p => !partyOK(p)).forEach(p => miss.push(`${p.name} ID/address`));
    return miss.length ? miss : null;
  }
  if (r.stage === 'screening') return c.screening && c.screening.date >= r.started ? null : ['Screening not recorded for this review'];
  return null;
}

      ${(S.syslog || []).length ? `<ul class="timeline">${S.syslog.slice(0, 8).map(h => `<li><time>${h.d}</time><span>${esc(h.t)} <span class="muted">· ${esc(h.by)}</span></span></li>`).join('')}</ul>` : ''}`
    : `<p class="callout warn">Records are not password-protected. Anyone who can use this computer's browser can open them.</p><div class="row"><button class="btn primary" data-act="setup">Set a password</button></div>`}

  </div></section>
  <section class="card"><header><div><h2>Records, training and backups</h2><p>Retention, refresher training and backup reminders</p></div></header><div class="body grid3">
    <label class="field" for="s-ret">Keep records after a relationship ends, years${num('s-ret', 'retentionYears', s.retentionYears, 1, 30)}</label>
    <label class="field" for="s-trn">AML/CFT refresher training every, months${num('s-trn', 'trainingMonths', s.trainingMonths, 1, 60)}</label>

  <section class="card"><header><div><h2>Chasing clients</h2><p>Days after the first request</p></div></header><div class="body grid3">

  </div></section>
  ${backupCard()}
  <section class="card"><header><div><h2>Your data</h2><p>Where records are kept and how to back them up</p></div></header><div class="body" style="display:grid;gap:14px">
    <p class="callout info">Records and attached scans are stored in this browser on this computer only${vault ? ', encrypted with your password' : ''}. Nothing is sent anywhere. Clearing browser data deletes them, so save a backup regularly and keep it with your other compliance records. Set up backups above.${FRAMED ? ' Backups, CSV exports and printing are switched off in this online preview. Open the local copy of the app (kyc-desk/index.html) to use them.' : ''}</p>

/* =========================================================
   Modal + toast
   ========================================================= */
function modal(title, body, buttons, opts = {}) {
  const root = $('#modal');
  root.innerHTML = `<div class="scrim" ${opts.noCancel ? '' : 'data-close'}></div><div class="dlg ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><header><h2 id="dlg-t">${esc(title)}</h2>${opts.noCancel ? '' : '<button class="x" data-close aria-label="Close">×</button>'}</header><div class="dlg-b">${body}<p class="err" id="dlg-err" hidden></p></div><footer></footer></div>`;
  const foot = $('footer', root), dlg = $('.dlg', root);
  [...(opts.noCancel ? [] : [{ label: opts.cancel || 'Cancel', cls: '', fn: () => true }]), ...buttons].forEach(b => {
    if (b.hidden) return;
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.textContent = b.label;
    el.addEventListener('click', async () => { const res = await b.fn(dlg); if (res !== false) closeModal(); });
    foot.append(el);
  });
  root.hidden = false;
  const first = $('input:not([type=checkbox]), select, textarea', dlg);
  (first || $('footer .btn:last-child', root)).focus();
  return dlg;
}
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
function fail(dlg, msg) { const e = $('#dlg-err', dlg); e.textContent = msg; e.hidden = false; return false; }
let toastT;
// a note that stays up while a long job reports progress; each call keeps it showing
function progressNote(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 8000); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }
const methodSel = (id, v) => `<select id="${id}">${METHODS.map(m => `<option ${m === v ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
function later(fn) { setTimeout(fn, 0); }
function commit(msg) { save(); render(); if (msg) toast(msg); }

/* ---------- start refresh ---------- */
function modalStart(c) {
  const onbK = c.status === 'onboarding';
  const s = S.settings, horizon = s.cycles[c.risk] * 30;
  const items = defs(c).map(t => {
    const d = doc(c, t.k), st = docState(d), e = expDays(d.exp);
    let why = '', pre = false;
    if (st === 'expired') { why = 'Expired'; pre = true; }
    else if (st === 'missing' && t.when !== 'optional') { why = 'Not on file'; pre = true; }
    else if (e != null && e <= horizon) { why = `Expires ${fmt(d.exp)}, before the next cycle ends`; pre = true; }
    else if (t.refresh) { why = 'Updated at every review'; pre = true; }
    else why = t.when === 'optional' ? 'Optional' : `On file since ${fmt(d.rec)}`;
    return { v: 'd:' + t.k, n: t.n, why, pre };
  });
  c.parties.forEach(p => {
    const e = expDays(p.idExp);
    const pre = !p.idOk || !p.poaOk || (e != null && e <= horizon);
    items.push({ v: 'p:' + p.id, n: `Certified ID and proof of address: ${p.name} (${p.role})`, why: e == null ? (pre ? 'Not verified' : 'No expiry recorded') : e < 0 ? 'ID expired' : `ID expires ${fmt(p.idExp)}`, pre });
  });

    <p>Choose what to ask ${esc(c.name)} for. Items that change at every review, or that are missing or expiring, are already ticked.</p>
    <div class="reqlist">${items.map((x, i) => `<label class="check" for="rq${i}"><input type="checkbox" id="rq${i}" name="req" value="${x.v}" ${x.pre ? 'checked' : ''}><span>${esc(x.n)}<span class="why">${esc(x.why)}</span></span></label>`).join('')}</div>
    <div class="grid2"><label class="field" for="st-m">How the request is sent${methodSel('st-m', c.email ? 'Email' : 'Letter by post')}</label><label class="field" for="st-d">Date sent<input type="date" id="st-d" value="${iso(TODAY)}"></label></div>`;
  modal(`${onbK ? 'Start onboarding' : 'Start refresh'}: ${c.name}`, body, [{ label: onbK ? 'Start onboarding and draft letter' : 'Start refresh and draft letter', cls: 'primary', fn: dlg => {
    const keys = $$('input[name=req]:checked', dlg).map(i => i.value);
    if (!keys.length) return fail(dlg, 'Tick at least one item to request.');
    const date = $('#st-d', dlg).value || iso(TODAY), method = $('#st-m', dlg).value;
    c.refresh = { stage: 'awaiting', started: date, requested: date, lastContact: date, chases: 0, method, escalated: '', kind: onbK ? 'onboarding' : 'refresh' };
    keys.forEach(k => {
      const [kind, id] = k.split(':');
      if (kind === 'd') { const d = doc(c, id); d.s = 'requested'; d.req = date; }

    });
    c.outreach.unshift({ d: date, m: method, kind: 'Document request', note: `${keys.length} items requested`, by: me() });
    log(c, `${onbK ? 'Onboarding started' : 'Periodic review started'}. ${keys.length} items requested (${method.toLowerCase()}).`);
    commit(onbK ? 'Onboarding started' : 'Refresh started');
    later(() => modalLetter(c, 'request'));
  } }], { wide: true });
}

/* ---------- stage moves ---------- */
function advance(c) {
  const r = c.refresh; if (!r) return;
  if (r.stage === 'awaiting') {
    const out = outstanding(c);
    const go2 = () => { r.stage = 'verify'; log(c, 'Documents received from client. Moved to verification.'); commit('Moved to verification'); };
    if (!out.length) return go2();
    modal('Documents received?', `<p>${plural(out.length, 'item')} still marked as outstanding:</p><div class="callout warn"><ul>${out.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><p class="note">Moving on is fine if the documents are in hand but not yet logged. Update each document's status during verification.</p>`,
      [{ label: 'Move to verification', cls: 'primary', fn: () => { go2(); } }]);
    return;
  }
  if (gate(c)) return;
  if (r.stage === 'verify') { r.stage = 'screening'; log(c, 'Verification complete. Moved to screening and risk review.'); commit('Moved to screening'); }
  else if (r.stage === 'screening') { r.stage = 'signoff'; log(c, 'Screening and risk review complete. Sent for MLRO sign-off.'); commit('Sent for sign-off'); }
}

/* ---------- risk status decisions ---------- */
const DECISIONS = {

  lift: { n: 'Lift restriction', done: 'Restriction lifted', g: 'Relationship' },
  exit: { n: 'Exit the relationship', done: 'Relationship exited', g: 'Relationship' },

const PEP_REL = ['PEP', 'Family member', 'Close associate'];
const PEP_CAT = ['Foreign', 'Domestic', 'International organisation'];
const PEP_SRC = ['Screening match', 'Client declaration', 'Public source or media', 'Other'];
function availableDecisions(c) {
  if (isClosed(c)) return c.status === 'exited' ? ['reinstate'] : [];
  if (c.status === 'onboarding') { const o = c.pep && c.pep.status === 'current' ? ['pepupd', 'pepoff'] : ['pep']; if (c.risk !== 'high') o.push('raise'); if (c.risk !== 'low') o.push('lower'); return o; }

  if (c.risk !== 'high') a.push('raise');

}
const opts = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
function decisionFields(c, type, toRisk) {

function recordDecision(c, dlg) {

  const dec = { id: 'd' + Date.now().toString(36), d, type, reason, by, recordedBy: me(), from: '', to: '', effects: [] };
  const fx = dec.effects, oldRisk = c.risk;
  if (isPepType) {
    dec.from = type === 'pepupd' ? 'PEP' : c.pep ? 'Former PEP' : 'Not a PEP'; dec.to = 'PEP';
    c.pep = newPep({ relation: $('#dp-rel', dlg).value, category: $('#dp-cat', dlg).value, pepName: $('#dp-pn', dlg).value.trim(), position: $('#dp-pos', dlg).value.trim(), country: $('#dp-cty', dlg).value.trim(), since: $('#dp-since', dlg).value, source: $('#dp-src', dlg).value, approvedBy: by, approvedOn: d });
    dec.pep = clone(c.pep);
    if (c.risk !== 'high') c.risk = 'high';
  } else if (type === 'pepoff') {
    c.pep = Object.assign(newPep(), c.pep, { status: 'former', ceased: $('#dp-ceased', dlg).value });
    dec.from = 'PEP'; dec.to = 'Former PEP'; dec.pep = clone(c.pep);
    fx.push(isPep(c) ? `Enhanced measures and High rating continue until ${fmtD(pepTailEnd(c))}` : 'The enhanced-measures period has already ended. Decide whether to lower the rating');
  } else if (type === 'raise' || type === 'lower') {
    const nr = $('#dc-risk', dlg).value;
    dec.from = cap(c.risk); dec.to = cap(nr); c.risk = nr;
  } else if (type === 'restrict') { dec.from = 'Active'; dec.to = 'Restricted'; c.status = 'restricted'; fx.push('Services suspended until the restriction is lifted'); }
  else if (type === 'lift') { dec.from = 'Restricted'; dec.to = 'Active'; c.status = 'active'; fx.push('Services resume'); }
  else if (type === 'exit') {
    dec.from = cap(c.status === 'restricted' ? 'restricted' : 'active'); dec.to = 'Exited'; c.status = 'exited'; c.ended = d;
    if (c.refresh) { c.refresh = null; c.parties.forEach(p => { p.req = false; }); fx.push('Refresh in progress cancelled'); }
    fx.push('Client removed from the active register and worklist');
  } else if (type === 'reinstate') { dec.from = 'Exited'; dec.to = 'Active'; c.status = 'active'; c.ended = ''; c.hold = null; }
  if (c.risk !== oldRisk) {
    if (isPepType) fx.push(`Risk rating raised from ${cap(oldRisk)} to High`);
    fx.push(`Next review ${fmtD(nextReview(c))} (every ${s.cycles[c.risk]} months)`, `Screening every ${s.screen[c.risk]} months`);
    const edd = DOC_LIB[c.type].filter(t => t.when === 'high');
    if (c.risk === 'high' && edd.length) fx.push(`Enhanced due diligence documents now required: ${edd.map(t => t.short).join(', ')}`);
  }
  c.decisions.unshift(dec);
  log(c, `${DECISIONS[type].done}${dec.from ? ` (${dec.from} → ${dec.to})` : ''}. Approved by ${by}. Reason: ${reason}${fx.length ? ' ' + fx.join('. ') + '.' : ''}`, d);
  const startRf = !c.refresh && !$('#dc-rf-w', dlg).hidden && $('#dc-rf', dlg).checked;
  commit('Decision recorded');
  later(() => modalDecisionNote(c, dec, startRf));
}

const logoImg = (h = 48, css = 'margin-bottom:8px') => (S && S.settings.logo ? `<img src="${S.settings.logo}" alt="${esc(S.settings.firm || 'Firm logo')}" style="display:block;max-height:${h}px;max-width:260px;${css}">` : '');

// a copy outside the encrypted records, so the sign-in screen can show it; a logo is not confidential
function cacheLogo(v, sq) {
  try {
    if ((localStorage.getItem(LOGO_KEY) || '') !== v) v ? localStorage.setItem(LOGO_KEY, v) : localStorage.removeItem(LOGO_KEY);
    sq ? localStorage.setItem(LOGO_KEY + '.square', '1') : localStorage.removeItem(LOGO_KEY + '.square');
  } catch (e) { /* storage blocked: sign-in shows the plain mark */ }
}
function lockLogo(square) { try { return square ? !!localStorage.getItem(LOGO_KEY + '.square') : localStorage.getItem(LOGO_KEY) || ''; } catch (e) { return square ? false : ''; } }
const squareLogo = st => st.logoW > 0 && st.logoH > 0 && st.logoW / st.logoH > 0.8 && st.logoW / st.logoH < 1.25;
// redraw the chosen image at a sensible size: PNG keeps transparency, JPEG if that comes out too large
async function logoFromFile(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const w = img.naturalWidth || 600, h = img.naturalHeight || 200, k = 800 / Math.max(w, h);
    const cv = document.createElement('canvas'), z = /svg/.test(file.type) ? k : Math.min(1, k);
    cv.width = Math.max(1, Math.round(w * z)); cv.height = Math.max(1, Math.round(h * z));
    const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
    let data = cv.toDataURL('image/png');
    if (data.length > 700 * 1024) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); data = cv.toDataURL('image/jpeg', 0.9); }
    return { logo: data, logoW: cv.width, logoH: cv.height };
  } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
}

/* ---------- assistant work pack ---------- */
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const asst = () => S.settings.assistant || 'the assistant';
function assistantTask(c) {
  const r = c.refresh;
  if (!r) return 'Pull the file and return it to compliance. A periodic review is due.';
  if (r.stage !== 'awaiting') return 'File any documents received, then put the file in the Ready for review tray.';
  const t = tasks().find(x => x.c === c && (x.kind === 'chase' || x.kind === 'escalate'));
  if (t && t.kind === 'escalate') return 'Hold the file. Compliance is escalating it. Do not contact the client.';
  if (t) return `Send the ${r.chases ? 'final notice' : 'reminder'} prepared by compliance, then phone the client. Log each contact.`;
  if (diffDays(parse(r.requested), TODAY) <= 7 && !r.chases) return 'Send the document request letter prepared by compliance. Log the date sent.';
  return 'Collect the outstanding documents. Date-stamp each one on arrival and log every contact.';
}

    <p>Work on paper only. Keep each file in your In progress tray while you have it, and put it in the Ready for review tray when its task is done. Write every call, letter and visit on the file's contact sheet.</p>
    <table><thead><tr><th>#</th><th>File ref</th><th>Client</th><th>Cabinet location</th><th>Items outstanding</th><th>Reply due</th></tr></thead><tbody>${rows}</tbody></table>

function modalWorkPack() {
  const s = S.settings, name = s.assistant;
  const cands = active().filter(c => c.refresh || daysToReview(c) <= s.lead || (c.file.out && name && c.file.out.to === name))
    .sort((a, b) => daysToReview(a) - daysToReview(b));
  if (!cands.length) { toast('No files need work this week.'); return; }
  const pre = c => (name && c.file.out && c.file.out.to === name) || (c.refresh && c.refresh.stage === 'awaiting');
  const body = `${name ? '' : '<p class="callout warn">Add your assistant\'s name in Settings so files can be checked out to them.</p>'}
    <p>Choose the files ${esc(asst())} will work on. Files waiting on clients, and files already checked out to ${esc(asst())}, are ticked.</p>
    <div class="reqlist">${cands.map((c, i) => `<label class="check" for="wp${i}"><input type="checkbox" id="wp${i}" name="wp" value="${c.id}" ${pre(c) ? 'checked' : ''}><span>${esc(c.name)} <span class="mono">${esc(c.file.ref)}</span><span class="why">${c.refresh ? stageName(c.refresh.stage) : 'Review due, not started'}${c.file.out ? ` · file out with ${esc(c.file.out.to)}` : ''}</span></span></label>`).join('')}</div>
    ${name ? `<label class="check" for="wp-co"><input type="checkbox" id="wp-co" checked> Check the selected files out to ${esc(name)} in the app</label>` : ''}`;
  modal('Work pack for the week', body, [{ label: 'Prepare work pack', cls: 'primary', fn: dlg => {
    const ids = $$('input[name=wp]:checked', dlg).map(i => i.value);
    if (!ids.length) return fail(dlg, 'Tick at least one file.');
    const list = ids.map(get);
    if (name && $('#wp-co', dlg) && $('#wp-co', dlg).checked) list.forEach(c => {
      if (c.file.out && c.file.out.to === name) return;
      c.file.out = { to: name, since: iso(TODAY), purpose: 'Weekly work pack' };
      log(c, `Paper file ${c.file.ref} checked out to ${name}.`);
    });
    commit();
    later(() => modal(`Work pack: ${list.length} files`, `<p class="note">Print this for ${esc(asst())}. Each file has a hand-back slip.</p><div class="scroll">${workPackSheet(list)}</div>`,
      [{ label: 'Print', cls: 'primary', hidden: FRAMED, fn: () => { printHTML(workPackSheet(list)); return false; } }], { wide: true, cancel: 'Close' }));
  } }], { wide: true });
}

/* ---------- office procedure ---------- */
function procedureSheet() {
  const s = S.settings, a = esc(s.assistant || 'Compliance assistant'), co = esc(me());
  const row = (t, x, y) => `<tr><td>${t}</td><td style="text-align:center">${x ? '✓' : ''}</td><td style="text-align:center">${y ? '✓' : ''}</td></tr>`;
  return `<div class="sheet">
    <div>${firmHead(s.firm || 'KYC Refresh Desk')}<h3>KYC file procedure</h3><div>Periodic reviews and client document collection · issued ${fmtD(TODAY)}</div></div>
    <p>Every client has one paper file and one digital record. The paper file is kept in the locked cabinet. The digital record is kept in the KYC Refresh Desk app on the MLRO's computer, and nowhere else. Only the MLRO uses the app.</p>
    <h4>Who does what</h4>
    <table><thead><tr><th>Task</th><th style="width:22%">${a}</th><th style="width:22%">MLRO (${co})</th></tr></thead><tbody>
      ${row('Decide which files need work each week and print the work pack', 0, 1)}
      ${row('Prepare request letters, reminders and final notices', 0, 1)}
      ${row('Take files from the cabinet and leave an out card in the slot', 1, 0)}
      ${row('Record file check-out and return in the app', 0, 1)}
      ${row('Post, deliver or hand out letters; phone clients', 1, 0)}
      ${row('Write every call, letter and visit on the file\'s contact sheet', 1, 0)}
      ${row('Date-stamp documents on arrival and put them in the file', 1, 0)}
      ${row('Make the first checks on documents received (below) and flag problems', 1, 0)}
      ${row('Verify documents and connected parties, and record them in the app', 0, 1)}
      ${row('Scan documents and attach the scans in the app', 0, 1)}
      ${row('Screening, risk assessment and risk status decisions', 0, 1)}
      ${row('Arrange MLRO sign-off, reprint the cover sheet and refile', 0, 1)}
      ${row('Weekly backup to the encrypted USB drive kept in the safe', 0, 1)}
    </tbody></table>
    <h4>Where a file can be</h4>
    <ol><li>In the locked cabinet, at the location printed on its cover sheet.</li><li>In ${a}'s <b>In progress</b> tray, while working on it.</li><li>In the MLRO's <b>Ready for review</b> tray, waiting to be updated in the app.</li></ol>
    <p>Files never leave the office. When a file leaves the cabinet, an out card with the name and date goes in its place.</p>
    <h4>Weekly routine</h4>
    <ul><li><b>Monday:</b> the MLRO checks the app's worklist, prints the work pack and letters, and checks the files out to ${a}.</li>
      <li><b>During the week:</b> ${a} sends letters, phones clients, logs contact and files documents as they arrive.</li>
      <li><b>When a file's task is done, and at the latest on Friday:</b> the file goes in the Ready for review tray with its hand-back slip. The MLRO updates the app, verifies, scans, reprints the cover sheet, refiles, saves the backup and exports the records to Excel.</li></ul>
    <h4>First checks when documents arrive</h4>
    <ul><li>Date-stamp it and tick it on the cover sheet.</li>
      <li>Copies of ID and address documents are certified as true copies, with the certifier's signature, name, position, contact details and date.</li>
      <li>Proof of address is dated within the last three months. ID is not expired.</li>
      <li>Names and dates of birth match across documents. All pages are present and legible.</li>
      <li>Anything that fails a check: write the problem on the hand-back slip. Do not return documents to the client or ask for replacements without speaking to the MLRO.</li></ul>
    <h4>Rules</h4>
    <ul><li>Never take files or copies home, and never put client documents on a personal phone, personal email or messaging app.</li>
      <li>Do not use the scanner's scan-to-email or scan-to-cloud functions for client documents. Scanning is done by the MLRO.</li>
      <li>If a client emails documents, forward the email to the MLRO and then delete it from your mailbox.</li>
      <li>If anything makes you suspicious, tell the MLRO the same day, in person or in a sealed note. Don't write it on the client's file or discuss it with anyone else.</li>
      <li>Do not tell a client, or anyone else, that a file has been escalated, restricted or reported. Tipping off is a criminal offence.</li></ul>
    <h4>Tell the MLRO the same day if</h4>
    <ul><li>A client refuses to provide documents, or asks why they are needed in an unusual way.</li>
      <li>A document looks altered, or details don't match what is on file.</li>
      <li>Someone other than the client offers to provide documents or information, or offers payment in cash.</li>
      <li>A client mentions a new owner, director, trustee, a public office, or a change of country.</li></ul>
    <div class="sig"><div>${a} (signature)</div><div>Date</div><div>MLRO (signature)</div><div>Date</div></div>
  </div>`;
}

let repWeek = iso(mondayOf(TODAY));
const weekOf = ws => [ws, iso(addDays(parse(ws), 6))];
const inWeek = (d, w) => !!d && d >= w[0] && d <= w[1];
const ACTS = [
  ['started', /^Periodic review started/],
  ['escalated', /^Escalated to MLRO/],
  ['received', /→ (To verify|Received, to verify)\.$/],
  ['verified', /→ Verified\.$/],

function weekActivity(w) {
  const a = { n: {}, reviews: [], decisions: [], escalations: [], requests: 0, reminders: 0 };
  ACTS.forEach(([k]) => { a.n[k] = 0; });
  for (const c of S.clients) {
    for (const h of c.history) if (inWeek(h.d, w)) for (const [k, re] of ACTS) if (re.test(h.t)) { a.n[k]++; if (k === 'escalated') a.escalations.push({ c, d: h.d, t: h.t }); }
    for (const r of c.reviews) if (inWeek(r.d, w)) a.reviews.push(Object.assign({ c }, r));
    for (const x of c.decisions) if (inWeek(x.d, w)) a.decisions.push(Object.assign({ c }, x));
    for (const o of c.outreach) if (inWeek(o.d, w)) { if (o.kind === 'Document request') a.requests++; else a.reminders++; }
  }
  a.reviews.sort((x, y) => x.d.localeCompare(y.d)); a.decisions.sort((x, y) => x.d.localeCompare(y.d));
  return a;
}

}

/* ---------- onboarding: accept or decline a new client ---------- */
function modalAccept(c) {
  const s = S.settings, sug = suggested(c), pre = RANK[sug] > RANK[c.risk] ? sug : c.risk;
  const body = `<p>Customer due diligence for ${esc(c.name)} is complete. Decide whether to take the client on. The risk rating you confirm sets the first periodic review date.</p>
    <div class="grid2">
      <label class="field" for="ac-o">Decision<select id="ac-o"><option value="accept">Accept the client</option><option value="decline">Decline the client</option></select></label>
      <label class="field" for="ac-d">Date<input type="date" id="ac-d" value="${iso(TODAY)}"></label>
      <label class="field" for="ac-a">Approved by<input id="ac-a" value="${esc(s.mlro || me())}"></label>
      <label class="field" for="ac-r">Risk rating<select id="ac-r">${RISKS.map(r => `<option value="${r}" ${r === pre ? 'selected' : ''}>${cap(r)} (first review after ${s.cycles[r]} months)</option>`).join('')}</select></label>
      <div class="field"><span>Risk assessment suggests</span>${riskPill(sug)} <span class="small muted">Score ${raScore(c)}</span></div>
      <label class="field span2" for="ac-n">Notes<textarea id="ac-n" placeholder="Summary of the due diligence and any conditions. Required if declining."></textarea></label>
      ${isPep(c) ? '<label class="check span2" for="ac-pep"><input type="checkbox" id="ac-pep"> Senior management has approved establishing the relationship with this PEP</label>' : ''}
    </div>
    <div id="ac-dec" class="callout warn" hidden>Don't tell the client the reason if it involves suspicion. If you are declining because something is suspicious, log an internal report.
      <label class="check" for="ac-sar" style="margin-top:8px"><input type="checkbox" id="ac-sar"> Log an internal suspicious activity report next</label></div>`;
  const dlg = modal(`Accept or decline: ${c.name}`, body, [{ label: 'Record decision', cls: 'primary', fn: dlg => {
    const out = $('#ac-o', dlg).value, d = $('#ac-d', dlg).value || iso(TODAY), by = $('#ac-a', dlg).value.trim(), risk = $('#ac-r', dlg).value, note = $('#ac-n', dlg).value.trim();
    if (!by) return fail(dlg, 'Enter who approved this decision.');
    const id = 'd' + Date.now().toString(36);
    c.parties.forEach(p => { p.req = false; });
    if (out === 'accept') {
      if (isPep(c) && risk !== 'high') return fail(dlg, 'A PEP must be rated High.');
      if (isPep(c) && !$('#ac-pep', dlg).checked) return fail(dlg, 'Confirm senior management approval to take on this PEP.');
      c.status = 'active'; c.risk = risk; c.last = d; c.onboarded = d; c.refresh = null;
      if (isPep(c)) { c.pep.approvedBy = by; c.pep.approvedOn = d; }
      c.reviews.unshift({ d, by, risk, note, kind: 'onboarding' });
      c.decisions.unshift({ id, d, type: 'accept', from: 'Prospective client', to: 'Active', reason: note || 'Customer due diligence completed.', by, recordedBy: me(), effects: [`Risk rating ${cap(risk)}`, `First periodic review ${fmtD(nextReview(c))}`] });
      log(c, `Client accepted by ${by}. Customer due diligence complete. Risk rating ${cap(risk)}. First periodic review ${fmtD(nextReview(c))}.${note ? ' Notes: ' + note : ''}`, d);
      commit('Client accepted');
    } else {
      if (!note) return fail(dlg, 'Record the reason for declining.');
      const sar = $('#ac-sar', dlg).checked;
      c.status = 'declined'; c.ended = d; c.refresh = null;
      c.decisions.unshift({ id, d, type: 'decline', from: 'Prospective client', to: 'Declined', reason: sar ? 'Declined by the MLRO. Reason held in a separate confidential record.' : note, by, recordedBy: me(), effects: ['Client not taken on', `Records kept until ${fmtD(addMonths(parse(d), 12 * s.retentionYears))}`] });
      log(c, `Client declined by ${by}.${sar ? '' : ' Reason: ' + note}`, d);
      commit('Client declined');
      if (sar) later(() => modalSarNew(c, note));
    }
  } }]);
  $('#ac-o', dlg).addEventListener('change', e => { $('#ac-dec', dlg).hidden = e.target.value !== 'decline'; });
}

/* ---------- suspicious activity register (MLRO only) ---------- */
function sarStatus(x) {
  if (x.closed) return ['Closed', 'neutral'];
  if (!x.decision) return ['Awaiting decision', 'crit'];
  if (x.decision.outcome === 'report') return x.fia && x.fia.d ? ['Reported to FIA', 'info'] : ['Report not yet submitted', 'crit'];
  return ['Not reported', 'ok'];
}
const sarActionNeeded = x => !x.closed && (!x.decision || (x.decision.outcome === 'report' && !(x.fia && x.fia.d)));
const sarSubject = x => { const c = x.clientId && get(x.clientId); return c ? c.name : x.subject || 'Not recorded'; };
function nextSarId(d) { const y = d.slice(0, 4); return `IR-${y}-${String(S.sars.filter(x => x.id.startsWith(`IR-${y}-`)).length + 1).padStart(3, '0')}`; }

    <label class="field" for="sr-s">Subject, if not a client<input id="sr-s" placeholder="Name of the person or entity"></label>
