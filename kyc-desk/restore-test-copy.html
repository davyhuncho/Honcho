/* ---------- matters and source of funds ---------- */
const MATTER_TYPES = ['Property purchase', 'Property sale', 'Company formation or administration', 'Trust or estate', 'Litigation', 'Other'];
const SOF = { outstanding: ['Outstanding', 'warn'], requested: ['Requested', 'info'], verified: ['Verified', 'ok'], na: ['Not required', 'neutral'] };
const FIT = { yes: ['Fits profile', 'ok'], unclear: ['Unclear', 'warn'], no: ["Doesn't fit", 'crit'] };
const money = (v, cur) => (v ? `${cur || 'USD'} ${Number(v).toLocaleString('en-US')}` : '—');
function mattersCard(c) {
  const ms = c.matters.slice().sort((a, b) => (a.status === 'closed') - (b.status === 'closed') || b.opened.localeCompare(a.opened));
  return `<section class="card">
    <header><div><h2>Matters</h2><p>Each transaction with its value and source of funds, checked against what you know about the client</p></div><button class="btn sm" data-act="matter" data-id="${c.id}">Add matter</button></header>
    <div class="scroll">${ms.length ? `<table class="t"><thead><tr><th>Opened</th><th>Matter</th><th>Value</th><th>Source of funds</th><th>Profile</th><th></th></tr></thead><tbody>
      ${ms.map(m => `<tr><td class="mono num" style="white-space:nowrap">${m.opened}</td><td><b>${esc(m.type)}</b>${m.status === 'closed' ? ' <span class="tag">Closed</span>' : ''}<span class="sub">${esc(m.ref)}</span><span class="small muted">${esc(m.desc)}</span></td><td class="num" style="white-space:nowrap">${money(m.value, m.cur)}</td><td><span class="pill ${SOF[m.sofStatus][1]} plain">${SOF[m.sofStatus][0]}</span></td><td><span class="pill ${FIT[m.fit][1]} plain">${FIT[m.fit][0]}</span></td><td class="right"><button class="btn sm" data-act="matter" data-id="${c.id}" data-m="${m.id}">Edit</button></td></tr>`).join('')}
    </tbody></table>` : '<p class="empty">No matters recorded.</p>'}</div></section>`;
}
function modalMatter(c, m) {
  const isNew = !m;
  const v = m || { ref: `${c.file.ref}/M${c.matters.length + 1}`, type: MATTER_TYPES[0], desc: '', value: '', cur: 'USD', opened: iso(TODAY), sof: '', sofStatus: 'outstanding', fit: 'yes', status: 'open', note: '' };
  const sel = (id, map, val) => `<select id="${id}">${Object.entries(map).map(([k, x]) => `<option value="${k}" ${k === val ? 'selected' : ''}>${x[0]}</option>`).join('')}</select>`;
  const body = `<div class="grid2">
    <label class="field" for="mt-r">Matter reference<input id="mt-r" value="${esc(v.ref)}"></label>
    <label class="field" for="mt-t">Type<select id="mt-t">${opts(MATTER_TYPES, v.type)}</select></label>
    <label class="field span2" for="mt-d">Description<input id="mt-d" value="${esc(v.desc)}" placeholder="e.g. Purchase of Unit 4, Leeward Highway"></label>
    <label class="field" for="mt-v">Value<input id="mt-v" type="number" min="0" step="1" value="${esc(v.value)}"></label>
    <label class="field" for="mt-c">Currency<input id="mt-c" value="${esc(v.cur)}" maxlength="3"></label>
    <label class="field" for="mt-o">Opened<input id="mt-o" type="date" value="${v.opened}"></label>
    <label class="field" for="mt-s">Status<select id="mt-s"><option value="open" ${v.status === 'open' ? 'selected' : ''}>Open</option><option value="closed" ${v.status === 'closed' ? 'selected' : ''}>Closed</option></select></label>
    <label class="field span2" for="mt-f">Where the money comes from<textarea id="mt-f" placeholder="e.g. Sale of property in Toronto, proceeds held at Bank X; mortgage from Bank Y">${esc(v.sof)}</textarea></label>
    <label class="field" for="mt-fs">Evidence of source of funds${sel('mt-fs', SOF, v.sofStatus)}</label>
    <label class="field" for="mt-ft">Consistent with what we know about the client?${sel('mt-ft', FIT, v.fit)}</label>
    <label class="field span2" for="mt-n">Notes<input id="mt-n" value="${esc(v.note)}"></label></div>
    <div id="mt-w" class="callout crit" ${v.fit === 'no' ? '' : 'hidden'}>A transaction that doesn't fit the client's profile may give grounds for suspicion. Don't proceed until you're satisfied.
      <label class="check" for="mt-sar" style="margin-top:8px"><input type="checkbox" id="mt-sar"> Log an internal suspicious activity report next</label></div>`;
  const dlg = modal(isNew ? `Add matter: ${c.name}` : `Matter ${m.ref}`, body, [{ label: isNew ? 'Add matter' : 'Save changes', cls: 'primary', fn: dlg => {
    const val = id => $(id, dlg).value.trim();
    if (!val('#mt-r')) return fail(dlg, 'Enter a matter reference.');
    const x = m || { id: 'm' + Date.now().toString(36) };
    const before = m ? clone(m) : null;
    Object.assign(x, { ref: val('#mt-r'), type: val('#mt-t'), desc: val('#mt-d'), value: val('#mt-v'), cur: (val('#mt-c') || 'USD').toUpperCase(), opened: val('#mt-o') || iso(TODAY), sof: val('#mt-f'), sofStatus: val('#mt-fs'), fit: val('#mt-ft'), status: val('#mt-s'), note: val('#mt-n') });
    if (x.status === 'closed' && !x.closed) x.closed = iso(TODAY);
    if (x.status === 'open') x.closed = '';
    if (isNew) { c.matters.push(x); log(c, `Matter opened: ${x.ref} (${x.type}, ${money(x.value, x.cur)}). Source of funds ${SOF[x.sofStatus][0].toLowerCase()}.`); }
    else {
      const ch = [];
      if (before.sofStatus !== x.sofStatus) ch.push(`source of funds ${SOF[before.sofStatus][0]} → ${SOF[x.sofStatus][0]}`);
      if (before.fit !== x.fit) ch.push(`profile ${FIT[before.fit][0]} → ${FIT[x.fit][0]}`);
      if (before.value !== x.value) ch.push(`value ${money(before.value, before.cur)} → ${money(x.value, x.cur)}`);
      if (before.status !== x.status) ch.push(x.status === 'closed' ? 'closed' : 'reopened');
      log(c, `Matter ${x.ref} updated${ch.length ? ': ' + ch.join('; ') : ''}.`);
    }
    const sar = $('#mt-sar', dlg).checked && x.fit === 'no';
    commit(isNew ? 'Matter added' : 'Matter saved');
    if (sar) later(() => modalSarNew(c, `Matter ${x.ref} (${x.type}${x.desc ? ': ' + x.desc : ''}), ${money(x.value, x.cur)}. Source of funds given: ${x.sof || 'not stated'}. This doesn't fit what we know about the client because: `));
  } }], { wide: true });
  $('#mt-ft', dlg).addEventListener('change', e => { $('#mt-w', dlg).hidden = e.target.value !== 'no'; });
}

function staffStatus(p) {
  const recs = S.training.records.filter(r => r.staffId === p.id).sort((a, b) => b.d.localeCompare(a.d));
  const last = recs[0];
  if (!last) return { last: null, next: null, recs, st: ['Never trained', 'crit'] };
  const next = addMonths(parse(last.d), S.settings.trainingMonths), days = diffDays(TODAY, next);
  return { last, next, recs, st: days < 0 ? ['Overdue', 'crit'] : days <= 60 ? ['Due soon', 'warn'] : ['Up to date', 'ok'] };
}

const trainingDue = () => activeStaff().filter(p => staffStatus(p).st[1] === 'crit').length;

/* ---------- record retention and destruction ---------- */
function endDate(c) { return c.ended || ((c.decisions.find(x => x.type === 'exit' || x.type === 'decline') || {}).d) || ''; }
function retention(c) {
  const e = endDate(c), until = e ? addMonths(parse(e), 12 * S.settings.retentionYears) : null;
  const sarHold = S.sars.some(x => x.clientId === c.id && !x.closed), hold = !!c.hold || sarHold;
  return { e, until, hold, sarHold, eligible: !!until && until <= TODAY && !hold };
}
function retentionCard() {
  const closed = S.clients.filter(isClosed).map(c => ({ c, r: retention(c) })).sort((a, b) => (b.r.eligible - a.r.eligible) || ((a.r.until || 0) - (b.r.until || 0)));
  const chip = r => (r.hold ? '<span class="pill warn plain">On hold</span>' : !r.e ? '<span class="pill neutral plain">End date missing</span>' : r.eligible ? '<span class="pill crit plain">Can be destroyed</span>' : '<span class="pill ok plain">Keep</span>');
  return `<section class="card"><header><div><h2>Retention and destruction</h2><p>Records of exited and declined clients are kept for ${S.settings.retentionYears} years from the end of the relationship, then destroyed</p></div></header>
    <div class="scroll">${closed.length ? `<table class="t"><thead><tr><th>Client</th><th>Ended</th><th>Keep until</th><th>Status</th><th></th></tr></thead><tbody>
    ${closed.map(({ c, r }) => `<tr><td><a class="name" href="#client-${c.id}">${esc(c.name)}</a><span class="sub">${c.id} · ${esc(c.file.ref)} · ${cap(c.status)}</span></td><td class="num">${r.e ? fmt(r.e) : '—'}</td><td class="num">${r.until ? fmtD(r.until) : '—'}</td><td>${chip(r)}${c.destroyedPaper ? `<span class="sub">Paper destroyed ${fmt(c.destroyedPaper)}</span>` : ''}</td>
      <td class="right"><div class="row" style="justify-content:flex-end">${r.e ? '' : `<button class="btn sm" data-act="ended" data-id="${c.id}">Set end date</button>`}${r.sarHold ? '' : `<button class="btn sm quiet" data-act="hold" data-id="${c.id}">${c.hold ? 'Release hold' : 'Put on hold'}</button>`}${r.eligible ? `<button class="btn sm primary" data-act="destroy" data-id="${c.id}">Record destruction</button>` : ''}</div></td></tr>`).join('')}
    </tbody></table>` : '<p class="empty">No exited or declined clients.</p>'}</div>
    ${S.destroyed.length ? `<header style="padding-top:6px"><div><h3>Destruction log</h3><p>Kept permanently as evidence that records were destroyed on time</p></div></header><div class="scroll"><table class="t"><thead><tr><th>Destroyed</th><th>Client</th><th>File ref</th><th>Ended</th><th>Method</th><th>Witness</th><th>What</th></tr></thead><tbody>
      ${S.destroyed.map(x => `<tr><td class="num">${fmt(x.destroyed)}</td><td>${esc(x.name)}<span class="sub">${x.id}</span></td><td class="mono">${esc(x.fileRef)}</td><td class="num">${fmt(x.ended)}</td><td>${esc(x.method)}${x.cert ? `<span class="sub">${esc(x.cert)}</span>` : ''}</td><td>${esc(x.witness)}</td><td>${x.digital ? 'Paper and digital' : 'Paper only'}</td></tr>`).join('')}
    </tbody></table></div>` : ''}</section>`;
}
function viewFiles() { return viewFilesBase() + retentionCard(); }
function modalEnded(c) {
  modal(`End date: ${c.name}`, `<p>When the relationship ended. The retention period runs from this date.</p><label class="field" for="en-d">End date<input type="date" id="en-d"></label>`,
    [{ label: 'Save', cls: 'primary', fn: dlg => { const d = $('#en-d', dlg).value; if (!d) return fail(dlg, 'Choose the date.'); c.ended = d; log(c, `Relationship end date recorded as ${fmt(d)}.`); commit('End date saved'); } }]);
}
function modalHold(c) {
  if (c.hold) { const r = c.hold.reason; c.hold = null; log(c, `Retention hold released (was: ${r}).`); commit('Hold released'); return; }
  modal(`Put ${c.name} on hold`, '<p>A hold stops the records being destroyed, for example during an investigation, litigation or a regulator\'s request.</p><label class="field" for="hd-r">Reason<input id="hd-r"></label>',
    [{ label: 'Put on hold', cls: 'primary', fn: dlg => { const r = $('#hd-r', dlg).value.trim(); if (!r) return fail(dlg, 'Give the reason.'); c.hold = { reason: r, d: iso(TODAY) }; log(c, `Retention hold placed: ${r}.`); commit('Hold placed'); } }]);
}
function modalDestroy(c) {
  const r = retention(c);
  const body = `<p>${esc(c.name)} (${c.id}) ended on ${fmt(r.e)}. The ${S.settings.retentionYears}-year retention period ended on ${fmtD(r.until)}.</p>
    <div class="grid2"><label class="field" for="ds-d">Date destroyed<input type="date" id="ds-d" value="${iso(TODAY)}"></label>
    <label class="field" for="ds-m">Method<select id="ds-m">${opts(['Cross-cut shredding in the office', 'Secure shredding contractor', 'Other'])}</select></label>
    <label class="field" for="ds-c">Contractor certificate or reference<input id="ds-c"></label>
    <label class="field" for="ds-w">Witnessed by<input id="ds-w"></label></div>
    <label class="check" for="ds-p"><input type="checkbox" id="ds-p"> The paper file has been destroyed</label>
    <label class="check" for="ds-x"><input type="checkbox" id="ds-x" checked> Delete the digital record and its scans from this app and from connected backup folders. A line stays in the destruction log.</label>
    <p class="note">Older backup files still contain the record until they are rotated out, within 12 months.</p>
    <label class="field" for="ds-k">Type the client ID (${c.id}) to confirm<input id="ds-k" autocomplete="off"></label>`;
  modal('Record destruction', body, [{ label: 'Record destruction', cls: 'danger solid', fn: async dlg => {
    if (!$('#ds-p', dlg).checked) return fail(dlg, 'Destroy the paper file first, then tick the box.');
    if ($('#ds-k', dlg).value.trim().toUpperCase() !== c.id) return fail(dlg, `Type ${c.id} to confirm.`);
    const d = $('#ds-d', dlg).value || iso(TODAY), digital = $('#ds-x', dlg).checked;
    S.destroyed.unshift({ id: c.id, name: c.name, type: c.type, fileRef: c.file.ref, ended: r.e, destroyed: d, method: $('#ds-m', dlg).value, cert: $('#ds-c', dlg).value.trim(), witness: $('#ds-w', dlg).value.trim(), by: me(), digital });
    if (digital) {
      const atts = Object.values(c.docs).map(x => x.att).filter(Boolean);
      for (const a of atts) await ATT.del(a).catch(() => {});
      removeFromDests(atts).catch(() => {});
      S.clients = S.clients.filter(x => x !== c);
    } else { c.destroyedPaper = d; log(c, `Paper file ${c.file.ref} destroyed (${$('#ds-m', dlg).value.toLowerCase()}).`, d); }
    log0(`Client file ${c.id} destroyed after the retention period (${digital ? 'paper and digital' : 'paper only'}).`);
    commit('Destruction recorded');
  } }], { wide: true });
}

/* ---------- backups to folders: a USB drive and a OneDrive or SharePoint synced folder ----------
   The app writes encrypted backups into ordinary folders. OneDrive uploads a synced folder by itself
   whenever the PC is online; the app never connects to anything. */
const FS = typeof window.showDirectoryPicker === 'function' && !FRAMED;
const BK_DIR = 'KYC Refresh Desk backups';
const DESTS = [
  { key: 'usb', n: 'USB drive', hint: 'A folder on the encrypted USB drive kept in the safe' },
  { key: 'cloud', n: 'Cloud folder', hint: 'A folder that OneDrive or SharePoint syncs. Encrypted backups only.' },

let persisted = null, backingUp = false;
const destName = k => (S.settings.destNames || {})[k] || '';
// chosen folders are read from storage once per session, then kept in memory
const destCache = {};
async function getDest(k) {
  if (k in destCache) return destCache[k];
  try { destCache[k] = (await KV.get('dest-' + k)) || null; } catch (e) { destCache[k] = null; }
  return destCache[k];
}
async function destAccess(h, ask) {
  try {
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') return true;
    return ask && (await h.requestPermission({ mode: 'readwrite' })) === 'granted';
  } catch (e) { return false; }
}
async function chooseDest(key) {
  if (key === 'cloud' && !vault) { toast('Set a password first. Only encrypted backups go to a cloud folder.'); return; }
  let h; try { h = await window.showDirectoryPicker({ id: 'kyc-' + key, mode: 'readwrite' }); } catch (e) { return; }
  await KV.put('dest-' + key, h); destCache[key] = h;
  (S.settings.destNames || (S.settings.destNames = {}))[key] = h.name;
  log0(`${DESTS.find(d => d.key === key).n} backup folder set to "${h.name}".`);
  commit('Backup folder saved');
}
async function removeDest(key) {
  await KV.del('dest-' + key).catch(() => {}); destCache[key] = null;
  if (S.settings.destNames) delete S.settings.destNames[key];
  commit('Backup folder removed');
}
async function destStatus(key) {
  const h = await getDest(key); if (!h) return ['Not set', 'neutral'];
  let perm; try { perm = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { return ['Not connected', 'crit']; }
  if (perm !== 'granted') return ['Allowed at next backup', 'info'];
  try { await h.getDirectoryHandle(BK_DIR, { create: true }); return ['Ready', 'ok']; } catch (e) { return ['Not connected', 'crit']; }
}
async function paintDestStatus() {
  for (const d of DESTS) { const el = $('#ds-' + d.key); if (!el) continue; const [t, c] = await destStatus(d.key); el.className = `pill plain ${c}`; el.textContent = t; }
}
// the browser writes to a temporary file and swaps it in on close, so an unplugged drive can't leave half a file
async function writeText(dir, name, text) { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(text); await w.close(); }
// keep the newest 10 records files, plus the newest of each of the last 12 months
async function pruneRecords(root) {
  const names = [];
  for await (const [n, h] of root.entries()) if (h.kind === 'file' && /^records-\d{4}-\d{2}-\d{2}/.test(n)) names.push(n);
  names.sort().reverse();
  const keep = new Set(names.slice(0, 10)), months = new Set();
  for (const n of names) { const m = n.slice(8, 15); if (months.size < 12 && !months.has(m)) { months.add(m); keep.add(n); } }
  for (const n of names) if (!keep.has(n)) await root.removeEntry(n).catch(() => {});
}
async function scanFileText(k, r, exported) {
  const item = r.enc ? r : { name: r.name, type: r.type, size: r.size, added: r.added, data: await blobToData(r.blob) };
  return JSON.stringify({ app: 'kyc-refresh-desk', kind: 'scans', v: 1, enc: !!r.enc, exported, files: { [k]: item } });
}
const RESTORE_TXT = [
  'KYC Refresh Desk: how to restore', '',
  '1. Copy "KYC Refresh Desk.html" from this folder to the computer and open it in Microsoft Edge or Google Chrome.',
  '2. Go to Settings and choose "Restore from a backup folder". Select the folder that holds this file.',
  '3. Pick the records file to restore. The newest is selected.',
  '4. Sign in with the username and password in use when that backup was made, or with the recovery key from the safe.', '',
  'When a password is set, the records and scans in this folder are encrypted. Without the password or recovery key they cannot be read.', '',
].join('\r\n');
async function runBackup(ask = true, quiet = false) {
  if (backingUp) return [];
  const list = [];
  for (const d of DESTS) { const h = await getDest(d.key); if (h) list.push({ d, h }); }
  if (!FS || !list.length) { if (!quiet) await exportBackup(false); return []; }
  backingUp = true;
  try {
    // ask for folder access first, while the click that started the backup still counts
    for (const x of list) x.ok = (x.d.key !== 'cloud' || !!vault) && await destAccess(x.h, ask);
    const now = new Date(), exported = now.toISOString(), stamp = `${iso(now)}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    const results = [], prev = S.lastBackup;
    const ready = list.filter(x => x.ok);
    if (ready.length) {
      S.lastBackup = iso(TODAY); save(); await writeChain;
      const records = JSON.stringify(vault
        ? { app: 'kyc-refresh-desk', v: 3, enc: true, exported, vault: vaultForFile(), files: {}, scans: 'separate' }
        : { app: 'kyc-refresh-desk', v: 3, exported, state: S, files: {}, scans: 'separate' });
      let keys = []; try { keys = await ATT.keys(); } catch (e) { /* no scans */ }
      for (const x of ready) {
        try {
          const root = await x.h.getDirectoryHandle(BK_DIR, { create: true });
          await writeText(root, `records-${stamp}.json`, records);
          const sd = await root.getDirectoryHandle('scans', { create: true });
          const have = new Set(); for await (const [n] of sd.entries()) have.add(n);
          let n = 0;
          const todo = keys.filter(k => !have.has(k + '.json'));
          for (const k of todo) { const r = await ATT.get(k); if (!r) continue; await writeText(sd, k + '.json', await scanFileText(k, r, exported)); n++; if (todo.length > 200 && n % 100 === 0) progressNote(`${x.d.n}: backing up scans, ${n.toLocaleString('en-GB')} of ${todo.length.toLocaleString('en-GB')}…`); }
          await writeText(root, 'KYC Refresh Desk.html', SELF);
          await writeText(root, 'How to restore.txt', RESTORE_TXT);
          await pruneRecords(root);
          results.push({ ok: true, t: `${x.d.n}: saved${n ? `, ${plural(n, 'new scan')}` : ''}` });
        } catch (e) {
          results.push({ ok: false, t: `${x.d.n}: failed (${e.name === 'NotFoundError' ? 'drive not connected' : e.name === 'QuotaExceededError' ? 'drive full' : 'could not write'})` });
        }
      }
    }
    list.filter(x => !x.ok).forEach(x => results.push({ ok: false, t: `${x.d.n}: ${x.d.key === 'cloud' && !vault ? 'skipped, no password set' : 'not connected, or access not allowed'}` }));
    const ok = results.some(r => r.ok);
    if (!ok) S.lastBackup = prev;
    (S.backupLog || (S.backupLog = [])).unshift({ d: iso(TODAY), at: exported, results: results.map(r => r.t), ok });
    S.backupLog.length = Math.min(S.backupLog.length, 800);
    save();
    if (!quiet) { toast(results.map(r => r.t).join(' · ')); render(); }
    return results;
  } finally { backingUp = false; }
}

/* =========================================================
   Scans (IndexedDB, this browser only)
   ========================================================= */
const ATT = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (this.db) return res(this.db);
      let r; try { r = indexedDB.open('kyc-refresh-desk-files', 2); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const db = r.result; ['files', 'state'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn, name = 'files') {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction(name, mode); const out = fn(t.objectStore(name)); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
  },
  put(id, rec) { return this.tx('readwrite', s => s.put(rec, id)); },
  get(id) { return this.tx('readonly', s => s.get(id)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  clear() { return this.tx('readwrite', s => s.clear()); },
  keys() { return this.tx('readonly', s => s.getAllKeys()); },
  async all() {
    const keys = await this.tx('readonly', s => s.getAllKeys());
    const out = [];
    for (const k of keys || []) out.push([k, await this.get(k)]);
    return out;
  },
};

/* =========================================================
   Password protection (Web Crypto, on this device only)
   Records and scans are encrypted with a random data key. That key is stored
   twice: once locked with the password and once with the printed recovery key.
   ========================================================= */
const VKEY = 'kyc-refresh-desk.vault.v1', TRIES_KEY = 'kyc-refresh-desk.tries';
const PW_ITER = 600000, RK_ITER = 150000, MIN_PW = 10;
let vault = null, DK = null, writeChain = Promise.resolve();
const te = new TextEncoder(), td = new TextDecoder();
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
function b64(buf) { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function writeVault() { writeChain = writeChain.then(() => store('vault', vault)).catch(() => { storageOK = false; }); return writeChain; }
// On this computer the encrypted records are stored as binary; backup files carry them as base64 text.
const bin = x => (typeof x === 'string' ? unb64(x) : new Uint8Array(x));
async function sealBin(key, bytes) { const iv = rnd(12); return { iv, ct: await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes) }; }
const vaultForFile = () => (vault && vault.data && typeof vault.data.ct !== 'string' ? Object.assign({}, vault, { data: Object.assign({}, vault.data, { iv: b64(vault.data.iv), ct: b64(vault.data.ct) }) }) : vault);
// The records are compressed before encryption: an audit trail repeats itself, so 12 MB becomes about 1 MB,
// which keeps saving and backups quick. Records saved without compression (z unset) still open.
const pipe = (bytes, t) => new Response(new Blob([bytes]).stream().pipeThrough(t)).arrayBuffer();
async function sealRecords(json) {
  if (typeof CompressionStream === 'function') { try { return Object.assign(await sealBin(DK, await pipe(json, new CompressionStream('gzip'))), { z: 'gzip' }); } catch (e) { /* store uncompressed */ } }
  return sealBin(DK, te.encode(json));
}
async function openRecords(box) {
  const raw = await unseal(DK, box);
  return td.decode(box.z === 'gzip' ? await pipe(raw, new DecompressionStream('gzip')) : raw);
}
function dropPlain() { writeChain = writeChain.then(() => (idbOK ? KV.del('plain') : null)).catch(() => {}); try { localStorage.removeItem(KEY); } catch (e) { /* blocked */ } }
async function kek(secret, salt, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(key, bytes) { const iv = rnd(12); return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes)) }; }
async function unseal(key, box) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(box.iv) }, key, bin(box.ct))); }
const importDK = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
const RK_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normRK = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function newRK() { return [...rnd(24)].map(x => RK_ALPHA[x % 32]).join('').match(/.{4}/g).join('-'); }
// raw data key from the password ('p') or the recovery key ('r'); throws if wrong
async function unwrapWith(secret, which) {
  if (which === 'r') return unseal(await kek(normRK(secret), unb64(vault.rsalt), vault.riter), vault.wrapR);
  return unseal(await kek(secret, unb64(vault.salt), vault.iter), vault.wrapP);
}
async function wrapPassword(raw, pw) { const salt = rnd(16); vault.salt = b64(salt); vault.iter = PW_ITER; vault.wrapP = await seal(await kek(pw, salt, PW_ITER), raw); }
async function wrapRecovery(raw) { const rk = newRK(), rsalt = rnd(16); vault.rsalt = b64(rsalt); vault.riter = RK_ITER; vault.wrapR = await seal(await kek(normRK(rk), rsalt, RK_ITER), raw); return rk; }

// scans: encrypted at rest whenever a password is set
async function sealFile(rec) {
  const meta = te.encode(JSON.stringify({ name: rec.name, type: rec.type, size: rec.size, added: rec.added }));
  const bytes = new Uint8Array(await rec.blob.arrayBuffer());
  return { enc: 1, m: await seal(DK, meta), b: await seal(DK, bytes) };
}
async function putFile(id, rec) { return ATT.put(id, vault ? await sealFile(rec) : rec); }
async function getFile(id) {
  const r = await ATT.get(id);
  if (!r || !r.enc) return r || null;
  if (!DK) return null;
  const meta = JSON.parse(td.decode(await unseal(DK, r.m)));
  return Object.assign(meta, { blob: new Blob([await unseal(DK, r.b)], { type: meta.type }) });
}

async function enableVault(name, user, pw) {
  const raw = rnd(32);
  const plain = await ATT.all().catch(() => []);
  vault = { v: 1, user, data: null };
  await wrapPassword(raw, pw);
  const rk = await wrapRecovery(raw);
  DK = await importDK(raw);
  for (const [id, r] of plain) if (r && !r.enc) await putFile(id, r);
  S.settings.user = name;
  log0(`Password protection turned on. Records and scans are now encrypted on this computer.`);
  save(); await writeChain;
  dropPlain(); await writeChain;
  return rk;
}
function log0(t) { (S.syslog || (S.syslog = [])).unshift({ d: iso(TODAY), t, by: me() }); }

function tries() { try { return JSON.parse(localStorage.getItem(TRIES_KEY)) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; } }
function setTries(t) { try { localStorage.setItem(TRIES_KEY, JSON.stringify(t)); } catch (e) { /* ignore */ } }
async function openVault(raw) {
  DK = await importDK(raw);
  const st = vault.data ? JSON.parse(await openRecords(vault.data)) : null;
  S = migrate(st || seed());
  S.settings = Object.assign(clone(DEFAULT_SETTINGS), S.settings || {});
  setTries({ n: 0, until: 0 });
  lastActive = Date.now();
  start();
}

function showLock(mode = 'login') {

    ${login ? `<label class="field" for="lk-u">Username<input id="lk-u" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
      <label class="field" for="lk-p">Password<input id="lk-p" type="password" autocomplete="current-password"></label>`
    : `<label class="field" for="lk-r">Recovery key<input id="lk-r" class="mono" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></label>

    <p class="err" id="lk-e" hidden></p>
    <button class="btn primary" type="submit" id="lk-go">${login ? 'Unlock' : 'Reset password and unlock'}</button>
    <button class="btn quiet" type="button" id="lk-sw">${login ? 'Forgot your password? Use the recovery key' : 'Back to sign in'}</button>
  </form></div>`;
  const err = m => { const e = $('#lk-e'); e.textContent = m; e.hidden = !m; };
  $('#lk-sw').addEventListener('click', () => showLock(login ? 'recover' : 'login'));
  $(login ? '#lk-u' : '#lk-r').focus();
  $('#lockform').addEventListener('submit', async e => {
    e.preventDefault();
    const t = tries();
    if (t.until > Date.now()) return err(`Too many attempts. Try again in ${Math.ceil((t.until - Date.now()) / 1000)} seconds.`);
    const btn = $('#lk-go'); btn.disabled = true; btn.textContent = 'Checking…'; err('');
    try {
      let raw;
      if (login) {
        const u = $('#lk-u').value.trim(), p = $('#lk-p').value;
        if (u.toLowerCase() !== String(vault.user).toLowerCase()) throw new Error('bad');
        raw = await unwrapWith(p, 'p');

        const p1 = $('#lk-n1').value, p2 = $('#lk-n2').value;
        if (p1.length < MIN_PW) { btn.disabled = false; btn.textContent = 'Reset password and unlock'; return err(`Choose a password of at least ${MIN_PW} characters.`); }
        if (p1 !== p2) { btn.disabled = false; btn.textContent = 'Reset password and unlock'; return err('The two new passwords do not match.'); }
        raw = await unwrapWith($('#lk-r').value, 'r');
        await wrapPassword(raw, p1); writeVault();
      }
      await openVault(raw);
      if (!login) { log0('Password reset with the recovery key.'); save(); toast('Password reset'); }
    } catch (x) {
      const n = t.n + 1;
      setTries({ n, until: n >= 5 ? Date.now() + Math.min(900, 30 * 2 ** (n - 5)) * 1000 : 0 });
      btn.disabled = false; btn.textContent = login ? 'Unlock' : 'Reset password and unlock';
      err(login ? 'Username or password is incorrect.' : 'That recovery key is not correct.');
    }
  });
}
let locking = false;
async function lockNow(manual) {
  if (!vault || !DK || locking) return;
  locking = true;
  // back up on the way out; an automatic lock only uses folders already allowed this session
  if (FS && S) { try { await runBackup(!!manual, true); } catch (e) { /* lock regardless */ } }
  save();
  await writeChain;
  DK = null; S = null; locking = false; showLock();
}

['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true, capture: true }));

setInterval(() => { if (vault && DK && S && !busy && Date.now() - lastActive > S.settings.lockMins * 60000) lockNow(); }, 15000);

let pendingAttach = null;
// Phone photos and flatbed scans can be several MB each. Shrinking photos to 2200 px on the
// long side keeps them legible (about 200 dpi on an A4 page) at a fraction of the size.
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp|bmp)$/.test(file.type) || file.size < 700 * 1024) return file;
  try {
    const url = URL.createObjectURL(file), img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const k = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) { return file; }
}
$('#filepick').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !pendingAttach) return;
  const { c, k } = pendingAttach; pendingAttach = null;
  const id = `${c.id}-${k}-${Date.now()}`;
  try {
    const g = await shrinkImage(f);
    await putFile(id, { name: g.name, type: g.type, size: g.size, added: iso(TODAY), blob: g });
    const d = doc(c, k);
    if (d.att) ATT.del(d.att).catch(() => {});
    d.att = id; d.scan = true;
    log(c, `Scan attached to ${defOf(c, k).short}: ${f.name}.`);
    commit('Scan attached');
  } catch (err) { toast('Could not save the scan. This browser may be blocking storage.'); }
});
async function viewAttachment(c, k) {
  const d = doc(c, k);
  let rec; try { rec = await getFile(d.att); } catch (e) { rec = null; }
  if (!rec) { modal('Scan not found', '<p>The scan is not stored in this browser. It may have been attached on another computer, or the browser data was cleared. Restore a backup or attach it again.</p>', [], { cancel: 'Close' }); return; }

  const isImg = (rec.type || '').startsWith('image/');

    : FRAMED ? '<p class="note">PDF previews open in the local copy of the app.</p>' : `<iframe src="${url}" title="Scan" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:6px"></iframe>`;
  modal(defOf(c, k).n, `<p class="small muted mono">${esc(rec.name)} · ${(rec.size / 1024).toFixed(0)} KB · added ${fmt(rec.added)}</p>${prev}`,
    [{ label: 'Remove scan', cls: 'danger', fn: async () => { await ATT.del(d.att).catch(() => {}); d.att = null; log(c, `Scan removed from ${defOf(c, k).short}.`); commit('Scan removed'); } },
     { label: 'Download', hidden: FRAMED, fn: () => { download(rec.name, rec.blob); return false; } }], { wide: true, cancel: 'Close' });
}

/* =========================================================
   Import / export

function download(name, data, type) {

}

async function exportBackup(allScans) {
  const exported = new Date().toISOString(), day = iso(TODAY);
  S.lastBackup = day; save(); await writeChain;
  download(`kyc-refresh-desk-records-${day}.json`, JSON.stringify(vault
    ? { app: 'kyc-refresh-desk', v: 3, enc: true, exported, vault: vaultForFile(), files: {}, scans: 'separate' }
    : { app: 'kyc-refresh-desk', v: 3, exported, state: S, files: {}, scans: 'separate' }), 'application/json');
  const done = S.scansBackedUp || (S.scansBackedUp = {});
  let keys = []; try { keys = await ATT.keys(); } catch (e) { /* no scans */ }
  const todo = keys.filter(k => allScans || !done[k]);
  let part = {}, size = 0, parts = 0, n = 0;
  const flush = () => {
    if (!size) return;
    parts++;
    download(`kyc-refresh-desk-scans-${day}-${parts}.json`, JSON.stringify({ app: 'kyc-refresh-desk', kind: 'scans', v: 1, enc: !!vault, exported, files: part }), 'application/json');
    part = {}; size = 0;
  };
  for (const k of todo) {
    const r = await ATT.get(k); if (!r) continue;
    const item = r.enc ? r : { name: r.name, type: r.type, size: r.size, added: r.added, data: await blobToData(r.blob) };
    part[k] = item; size += r.enc ? r.b.ct.length : item.data.length; n++;
    if (size > 150e6) flush();
  }
  flush();
  todo.forEach(k => { done[k] = day; });
  const msg = `Backup saved: records${n ? ` and ${plural(n, 'scan')} in ${plural(parts, 'file')}` : ', no new scans'}`;
  if (vault) log0(msg + '.');
  (S.backupLog || (S.backupLog = [])).unshift({ d: day, at: exported, results: [msg.replace('Backup saved: ', 'Downloads: ')], ok: true });

}

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }

}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden && $('#modal [data-close]')) closeModal();
  if (e.key === 'Enter' && e.target.matches('.kcard')) e.target.click();
});
let notesT, qT;
document.addEventListener('input', e => {
  if (e.target.id === 'help-q') { helpQ = e.target.value; filterHelp(); }
  if (e.target.id === 'q') { F.q = e.target.value; F.limit = 200; clearTimeout(qT); qT = setTimeout(renderClientRows, 150); }
  if (e.target.id === 'ann-notes') {
    (S.annual[repYear] || (S.annual[repYear] = {})).notes = e.target.value;
    clearTimeout(notesT); notesT = setTimeout(() => { save(); const sh = $('#ann-sheet'); if (sh) sh.innerHTML = annualSheet(repYear); }, 400);
  }
  if (e.target.id === 'rep-notes') {
    (S.reports[repWeek] || (S.reports[repWeek] = {})).notes = e.target.value;
    clearTimeout(notesT); notesT = setTimeout(() => { save(); const sh = $('#rep-sheet'); if (sh) sh.innerHTML = reportSheet(repWeek); }, 400);
  }
});
document.addEventListener('change', e => {
  const el = e.target, ds = el.dataset;
  if (ds.filter) { F[ds.filter] = el.value; F.limit = 200; renderClientRows(); return; }
  if (el.id === 'ann-sar') { S.settings.annualSar = el.checked; save(); $('#ann-sheet').innerHTML = annualSheet(repYear); return; }
  if (el.id === 'rep-names') { S.settings.reportNames = el.checked; save(); $('#rep-sheet').innerHTML = reportSheet(repWeek); return; }
  if (ds.set) {
    const path = ds.set.split('.');
    let v = el.type === 'number' ? Math.max(Number(el.min) || 0, Number(el.value) || 0) : el.value.trim();
    let o = S.settings; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = v;
    save(); renderNav(); toast('Setting saved');
    return;
  }
  if (ds.doc) {
    const c = get(ds.id), t = defOf(c, ds.doc), d = doc(c, ds.doc), f = ds.f;
    const v = el.type === 'checkbox' ? el.checked : el.value;
    const old = d[f];
    d[f] = v;
    if (f === 's') {
      if ((v === 'received' || v === 'verified') && (!d.rec || (c.refresh && d.rec < c.refresh.started))) d.rec = iso(TODAY);
      if (v === 'received' && d.paper === false) d.paper = true;
      log(c, `${t.short}: ${DOC_STATUS[old].n} → ${DOC_STATUS[v].n}.`);
    } else if (f === 'exp') log(c, `${t.short}: expiry date set to ${v ? fmt(v) : 'none'}.`);
    else if (f === 'paper') log(c, `${t.short}: ${v ? 'original or certified copy placed on paper file' : 'removed from paper file'}.`);
    else if (f === 'scan') log(c, `${t.short}: marked as ${v ? 'scanned' : 'not scanned'}.`);
    save(); rerender();
    return;
  }
  if (ds.party) {
    const c = get(ds.id), p = c.parties.find(x => x.id === ds.party), f = ds.f;
    p[f] = el.type === 'checkbox' ? el.checked : el.value;
    if (f === 'idOk' || f === 'poaOk') log(c, `${p.name}: ${f === 'idOk' ? 'certified ID' : 'proof of address'} ${p[f] ? 'verified' : 'marked as not verified'}.`);
    if (f === 'idExp') log(c, `${p.name}: ID expiry set to ${p.idExp ? fmt(p.idExp) : 'none'}.`);
    if (p.req && partyOK(p)) p.req = false;
    save(); rerender();
    return;
  }
  if (ds.ra) {
    const c = get(ds.id), fct = RISK_FACTORS.find(x => x.k === ds.ra);
    c.ra[ds.ra] = Number(el.value);
    log(c, `Risk assessment: ${fct.n.toLowerCase()} set to "${fct.o[c.ra[ds.ra]][0]}". Score now ${raScore(c)}.`);
    save(); rerender();
  }
});
window.addEventListener('hashchange', route);

function start() {
  shell(); save(); route();
  if (!FRAMED) askPersist().then(() => { if (view === 'settings') render(); });
  if (!vault && !FRAMED) {
    let asked = null;
    try { asked = sessionStorage.getItem('kyc-setup-asked'); sessionStorage.setItem('kyc-setup-asked', '1'); } catch (e) { /* ignore */ }
    if (!asked) later(modalSetup);
  }
}
async function boot() {
  let v = null, plain = null, lv = null, lp = null;
  try { v = await KV.get('vault'); plain = await KV.get('plain'); } catch (e) { idbOK = false; }
  try { lv = localStorage.getItem(VKEY); lp = localStorage.getItem(KEY); } catch (e) { /* blocked */ }
  if (!v && !plain && (lv || lp)) {
    // records saved by an earlier version are in localStorage: move them to IndexedDB once
    if (lv) v = lv; else plain = lp;
    if (idbOK) { try { await KV.put(lv ? 'vault' : 'plain', lv || lp); localStorage.removeItem(VKEY); localStorage.removeItem(KEY); } catch (e) { idbOK = false; } }
  }
  vault = v ? (typeof v === 'string' ? JSON.parse(v) : v) : null;
  if (vault) { showLock(); return; }
  S = migrate(plain ? JSON.parse(plain) : seed());
  S.settings = Object.assign(clone(DEFAULT_SETTINGS), S.settings || {});
  start();
}
boot();
})();
</script></body></html>
