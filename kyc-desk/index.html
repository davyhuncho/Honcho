<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KYC Refresh Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed ledger sidebar beside a working area. Tables carry the records; manila cards stand in for the physical file. */
:root {
  --bg: #edf1f2;
  --surface: #ffffff;
  --sunk: #f5f7f8;
  --ink: #13242b;
  --muted: #586a72;
  --line: #d5dde0;
  --accent: #0d6672;
  --accent-soft: #e1eff0;
  --on-accent: #ffffff;
  --manila: #9c7428;
  --manila-bg: #f7eedb;
  --manila-line: #e2cd9c;
  --crit: #b42318; --crit-bg: #fdeceb;
  --warn: #965804; --warn-bg: #fcf0d9;
  --ok: #1b7445; --ok-bg: #e3f3e9;
  --info: #2a57a0; --info-bg: #e7eef9;
  --shadow: 0 1px 2px rgba(19, 36, 43, .06), 0 8px 24px rgba(19, 36, 43, .08);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1619; --surface: #152125; --sunk: #111b1e; --ink: #e3ebed; --muted: #92a4ab; --line: #263639;
    --accent: #52b5c1; --accent-soft: #163338; --on-accent: #05262a;
    --manila: #dcbd7c; --manila-bg: #262113; --manila-line: #4a3f22;
    --crit: #f48a80; --crit-bg: #3a1c1a; --warn: #f0b45a; --warn-bg: #33270f; --ok: #6fcf98; --ok-bg: #12301f; --info: #8fb3f0; --info-bg: #17243a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1619; --surface: #152125; --sunk: #111b1e; --ink: #e3ebed; --muted: #92a4ab; --line: #263639;
  --accent: #52b5c1; --accent-soft: #163338; --on-accent: #05262a;
  --manila: #dcbd7c; --manila-bg: #262113; --manila-line: #4a3f22;
  --crit: #f48a80; --crit-bg: #3a1c1a; --warn: #f0b45a; --warn-bg: #33270f; --ok: #6fcf98; --ok-bg: #12301f; --info: #8fb3f0; --info-bg: #17243a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.15; }
h2 { font-size: 1.05rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.eyebrow { font: 600 .7rem/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.mark { width: 38px; height: 38px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 800 .72rem var(--f-display); letter-spacing: .04em; flex: none; }
.app-name { font: 800 1rem/1.15 var(--f-display); }
.firm { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--sunk); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav .count { font: 500 .72rem var(--f-mono); padding: 1px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.nav .count.hot { background: var(--crit-bg); color: var(--crit); }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; font-size: .8rem; color: var(--muted); }
.side-foot strong { color: var(--ink); font-weight: 600; }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; max-width: 1360px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.page-head .lede { color: var(--muted); max-width: 64ch; margin-top: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: var(--r); background: var(--manila-bg); border: 1px dashed var(--manila-line); color: var(--ink); font-size: .88rem; }
.banner strong { color: var(--manila); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 6px; font-weight: 600; font-size: .85rem; cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); color: var(--on-accent); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.danger.solid { background: var(--crit); color: var(--surface); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px; }
.btn.sm { padding: 4px 9px; font-size: .78rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.field { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea, .inp { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; font-weight: 400; font-size: .9rem; color: var(--ink); min-width: 0; width: 100%; }
.field textarea { resize: vertical; min-height: 70px; }
.inp.sm { padding: 4px 6px; font-size: .82rem; width: auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
.span2 { grid-column: span 2; }
.check { display: inline-flex; gap: 8px; align-items: flex-start; font-size: .88rem; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

/* ---------- chips & pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: .74rem; font-weight: 600; white-space: nowrap; line-height: 1.5; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.crit { color: var(--crit); background: var(--crit-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.ok { color: var(--ok); background: var(--ok-bg); }
.info { color: var(--info); background: var(--info-bg); }
.neutral { color: var(--muted); background: var(--sunk); border: 1px solid var(--line); }
.manila-chip { color: var(--manila); background: var(--manila-bg); border: 1px solid var(--manila-line); }
.tag { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }

/* ---------- cards & tables ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 14px 16px 10px; }
.card > header p { color: var(--muted); font-size: .82rem; }
.card .body { padding: 0 16px 16px; }
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .86rem; }
.t th { text-align: left; font: 600 .7rem/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
.t td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tbody tr:last-child td { border-bottom: 0; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--sunk); }
.t .name { font-weight: 600; color: var(--ink); text-decoration: none; }
.t .name:hover { color: var(--accent); text-decoration: underline; }
.t .sub { display: block; color: var(--muted); font-size: .76rem; font-family: var(--f-mono); }
.t td.right, .t th.right { text-align: right; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.meter { display: inline-flex; align-items: center; gap: 8px; }
.meter .track { width: 64px; height: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.meter .fill { display: block; height: 100%; background: var(--accent); }
.meter .fill.ok { background: var(--ok); }
.meter .fill.warn { background: var(--warn); }

/* ---------- overview ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; position: relative; overflow: hidden; }
.tile:hover { border-color: var(--accent); }
.tile .k { font: 800 2rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile .l { font-size: .8rem; font-weight: 600; }
.tile .s { font-size: .74rem; color: var(--muted); }
.tile.is-crit { border-top: 3px solid var(--crit); }
.tile.is-crit .k { color: var(--crit); }
.tile.is-warn { border-top: 3px solid var(--warn); }
.tile.is-warn .k { color: var(--warn); }
.tile.is-info { border-top: 3px solid var(--info); }
.tile.is-ok { border-top: 3px solid var(--ok); }
.tile.is-manila { border-top: 3px solid var(--manila); }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { fill: var(--muted); font: 500 10.5px var(--f-mono); }
.chart .ax-strong { fill: var(--crit); font: 600 10.5px var(--f-mono); }
.chart .val { fill: var(--ink); font: 600 11px var(--f-mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .sep { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.r-high { fill: var(--crit); } .r-medium { fill: var(--warn); } .r-low { fill: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .high { background: var(--crit); } .legend .medium { background: var(--warn); } .legend .low { background: var(--ok); }
.mix { display: grid; gap: 12px; }
.mix-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: .84rem; }
.mix-row > :last-child { text-align: right; }
.mix-row .bar { height: 10px; border-radius: 99px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; }
.mix-row .bar span { display: block; height: 100%; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.facts div { display: grid; gap: 2px; }
.facts b { font: 700 1.2rem var(--f-display); font-variant-numeric: tabular-nums; }

.sev { display: inline-block; min-width: 62px; text-align: center; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: .8rem; font-weight: 600; color: var(--muted); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* ---------- pipeline ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col > header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px 4px 6px; }
.col > header .n { font: 600 .78rem var(--f-mono); color: var(--muted); }
.col > p { font-size: .76rem; color: var(--muted); padding: 0 4px 4px; margin-top: -6px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 11px; display: grid; gap: 6px; cursor: pointer; }
.kcard:hover { border-color: var(--accent); }
.kcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.kcard .nm { font-weight: 600; font-size: .88rem; line-height: 1.3; }
.kcard .meta { font-size: .76rem; color: var(--muted); }

/* ---------- client file ---------- */
.crumb { font-size: .82rem; }
.crumb a { text-decoration: none; }
.client-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: start; }
.client-head .ids { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; }
.due-box { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 16px; min-width: 200px; display: grid; gap: 2px; }
.due-box .d { font: 700 1.15rem var(--f-display); }
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.step { padding: 10px 12px; border-right: 1px solid var(--line); display: grid; gap: 2px; font-size: .8rem; min-width: 0; }
.step:last-child { border-right: 0; }
.step b { font-weight: 600; }
.step .idx { font: 600 .7rem var(--f-mono); color: var(--muted); }
.step.done { background: var(--ok-bg); }
.step.done .idx { color: var(--ok); }
.step.now { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.step.now b { color: var(--accent); }
.actionbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.actionbar .why { font-size: .82rem; color: var(--muted); max-width: 70ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
dl.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: .86rem; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.manila { background: var(--manila-bg); border: 1px solid var(--manila-line); border-radius: 4px 10px var(--r) var(--r); position: relative; padding: 16px; display: grid; gap: 10px; margin-top: 14px; }
.manila::before { content: attr(data-tab); position: absolute; top: -14px; left: 14px; height: 14px; padding: 0 12px; background: var(--manila-bg); border: 1px solid var(--manila-line); border-bottom: 0; border-radius: 6px 6px 0 0; font: 600 .66rem/14px var(--f-mono); color: var(--manila); letter-spacing: .04em; }
.manila .ref { font: 600 1.05rem var(--f-mono); color: var(--ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: .84rem; }
.timeline li:last-child { border-bottom: 0; }
.timeline time { font: 500 .76rem var(--f-mono); color: var(--muted); padding-top: 1px; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 0 0; border-top: 1px solid var(--line); margin-top: 6px; }
.score b { font: 800 1.6rem var(--f-display); }
.ra { display: grid; gap: 9px; }
.ra label { display: grid; gap: 3px; font-size: .76rem; color: var(--muted); font-weight: 600; }
.ra select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 7px; font-size: .84rem; width: 100%; }
.doc-name { font-weight: 600; display: block; }
.doc-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.t select.st { border: 1px solid var(--line); border-radius: 99px; padding: 3px 8px; font-size: .78rem; font-weight: 600; cursor: pointer; }
.t select.st.ok { border-color: transparent; }
.t select.st.warn { border-color: transparent; }
.t select.st.info { border-color: transparent; }
.t select.st.crit { border-color: transparent; }
.t input[type="date"].inp { width: 128px; }
.t.docs td, .t.docs th { padding-inline: 9px; }
.scanbox { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.scrim { position: absolute; inset: 0; background: rgba(8, 18, 22, .5); }
.dlg { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); width: min(680px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
.dlg.wide { width: min(860px, 100%); }
.dlg > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.dlg > header h2 { font-size: 1.1rem; }
.dlg .x { border: 0; background: transparent; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.dlg-b { padding: 16px 18px; overflow-y: auto; display: grid; gap: 14px; }
.dlg > footer { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.dlg .err { color: var(--crit); font-size: .84rem; font-weight: 600; }
.reqlist { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 6px; max-height: 300px; overflow-y: auto; }
.reqlist .check { padding: 6px; border-radius: 4px; }
.reqlist .check:hover { background: var(--sunk); }
.reqlist .why { color: var(--muted); font-size: .76rem; display: block; }
textarea.letter { width: 100%; min-height: 360px; font: 13px/1.55 var(--f-mono); border: 1px solid var(--line); border-radius: 6px; padding: 12px; background: var(--sunk); color: var(--ink); resize: vertical; }
.note { font-size: .8rem; color: var(--muted); }
.callout { padding: 10px 12px; border-radius: 6px; font-size: .84rem; }
.callout ul { margin: 6px 0 0; padding-left: 18px; }

/* printable sheet (also previewed in a dialog) */
.sheet { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 6px; padding: 22px; font-size: 12px; display: grid; gap: 12px; }
.sheet h3 { font: 800 16px var(--f-display); color: #111; }
.sheet table { width: 100%; border-collapse: collapse; }
.sheet th, .sheet td { border: 1px solid #999; padding: 5px 6px; text-align: left; vertical-align: top; color: #111; }
.sheet th { background: #eee; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
.sheet .box { display: inline-block; width: 12px; height: 12px; border: 1px solid #333; vertical-align: -2px; }
.sheet .meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 14px; }
.sheet .sig { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; padding-top: 18px; }
.sheet .sig div { border-top: 1px solid #333; padding-top: 4px; font-size: 11px; }

#toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: .86rem; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
#print-area { display: none; }
#filepick, #importpick { display: none; }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1360px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 920px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 20; flex-direction: row; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: visible; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .brand .firm, .side-foot { display: none; }
  .nav { flex-direction: row; }
  .nav a { white-space: nowrap; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .client-head { grid-template-columns: minmax(0, 1fr); }
  .stepper { grid-template-columns: repeat(5, minmax(120px, 1fr)); overflow-x: auto; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .span2 { grid-column: auto; }
  h1 { font-size: 1.45rem; }
  .brand .app-name { display: none; }
  .sheet .meta { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .dlg { animation: rise .16s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media print {
  body > *:not(#print-area) { display: none !important; }
  body { background: #fff; }
  #print-area { display: block !important; color: #111; }
  #print-area .sheet { border: 0; padding: 0; }
  #print-area pre { font: 11.5pt/1.5 Georgia, "Times New Roman", serif; white-space: pre-wrap; margin: 0; }
}
</style>
</head>

    // documents on file from the last review
    defs(c).forEach((t, j) => {
      if (t.when === 'optional' && i % 2) return;
      const hash = ((i * 37 + j * 53) % 100) / 100;
      c.docs[t.k] = {
        s: 'verified', rec: iso(addDays(lastD, -(6 + j))), exp: '', paper: true,
        scan: hash < sp.scan, att: null, note: '',
      };
      if (t.expires) c.docs[t.k].exp = sp.idExp != null ? D(sp.idExp) : iso(addMonths(TODAY, 18 + (i * 7) % 60));
    });
    (sp.parties || []).forEach((p, j) => {
      c.parties.push({ id: `p${j + 1}`, name: p[0], role: p[1], pct: p[2], idExp: p[3] == null ? '' : D(p[3]), idOk: true, poaOk: true, req: false });
    });
    c.screening = { date: sp.screenAgo != null ? D(-sp.screenAgo) : iso(addDays(lastD, -2)), result: isPep(c) ? SCREEN_RESULTS[2] : SCREEN_RESULTS[0], lists: 'UN, OFAC, UK and EU sanctions lists; PEP database; adverse media search', by: 'Compliance Officer' };
    c.history.push({ d: onb, t: 'Client onboarded. Initial CDD completed.', by: c.rm });
    c.history.unshift({ d: last, t: `Periodic review completed. Risk rating confirmed as ${cap(sp.risk)}.`, by: 'MLRO' });
    c.reviews.push({ d: last, by: 'MLRO', risk: sp.risk });

    if (sp.stage) {
      const started = D(-sp.reqAgo);
      c.refresh = { stage: sp.stage, started, requested: started, lastContact: D(-Math.max(1, sp.reqAgo - sp.chases * 16)), chases: sp.chases, method: METHODS[i % 2], escalated: sp.escalated ? D(-sp.escalated) : '' };
      const reqd = reqDefs(c).filter(t => t.refresh || (t.expires && c.docs[t.k] && c.docs[t.k].exp && parse(c.docs[t.k].exp) < TODAY));
      reqd.forEach((t, j) => {
        const d = doc(c, t.k);
        d.req = started;
        if (sp.stage === 'awaiting') { d.s = 'requested'; d.scan = false; }
        else if (sp.stage === 'verify') { d.s = j % 3 === 0 ? 'verified' : 'received'; d.rec = D(-(3 + j)); d.scan = j % 2 === 0; }
        else { d.s = 'verified'; d.rec = D(-(12 + j)); }
      });
      if (sp.stage === 'verify') c.parties.forEach(p => { if (p.idExp && parse(p.idExp) < TODAY) { p.idOk = false; p.req = true; } });
      if (sp.stage === 'signoff') c.screening = { date: D(-3), result: SCREEN_RESULTS[0], lists: 'UN, OFAC, UK and EU sanctions lists; PEP database; adverse media search', by: 'Compliance Officer' };
      c.outreach.push({ d: started, m: c.refresh.method, kind: 'Document request', note: `${reqd.length} items requested`, by: 'Compliance Officer' });
      for (let k = 1; k <= sp.chases; k++) c.outreach.unshift({ d: D(-Math.max(1, sp.reqAgo - k * 16)), m: k === 2 ? 'Letter by post' : 'Email', kind: k === 2 ? 'Final reminder' : 'Reminder', note: k === 2 ? 'Final notice: services may be restricted' : 'Chased outstanding documents', by: 'Compliance Officer' });
      c.history.unshift({ d: started, t: `Periodic review started. ${reqd.length} items requested.`, by: 'Compliance Officer' });
      if (sp.stage !== 'awaiting') c.history.unshift({ d: D(-Math.max(0, sp.reqAgo - 20)), t: 'Documents received from client.', by: 'Compliance Officer' });
      if (sp.escalated) c.history.unshift({ d: D(-sp.escalated), t: 'Escalated to MLRO: no response to final reminder. Services restricted pending review.', by: 'Compliance Officer' });
    }
    if (sp.fileOut) c.file.out = { to: 'J. Rigby (Corporate)', since: D(-sp.fileOut), purpose: 'Annual return filing' };
    st.clients.push(c);
  });
  st.seq = st.seq + specs.length * 3 + 1;
  return st;
}

/* =========================================================
   Worklist
   ========================================================= */
const SEV = [['Urgent', 'crit'], ['High', 'warn'], ['Due', 'info'], ['Watch', 'neutral']];
function tasks() {
  const s = S.settings, out = [];
  for (const c of active()) {
    const days = daysToReview(c), r = c.refresh;
    const add = (sev, kind, text, act, label) => out.push({ c, sev, kind, text, act, label });
    if (!r) {
      if (days < 0) add(c.risk === 'high' ? 0 : 1, 'overdue', `Periodic review overdue by ${plural(-days, 'day')}`, 'start', 'Start refresh');
      else if (days <= 30) add(2, 'due', `Review due in ${plural(days, 'day')}, not started`, 'start', 'Start refresh');
    } else if (r.stage === 'awaiting') {
      const waited = diffDays(parse(r.requested), TODAY);
      const [c1, c2, c3] = s.chase;
      if (r.escalated) add(1, 'escalated', `Escalated to MLRO ${fmt(r.escalated)}. Client still has not responded`, 'open', 'Open file');
      else if (waited >= c3) add(0, 'escalate', `No response after ${waited} days. Escalate to MLRO`, 'escalate', 'Escalate');
      else if (waited >= c2 && r.chases < 2) add(1, 'chase', `Requested ${waited} days ago. Send final reminder`, 'chase', 'Log reminder');
      else if (waited >= c1 && r.chases < 1) add(2, 'chase', `Requested ${waited} days ago. Send first reminder`, 'chase', 'Log reminder');
    } else if (r.stage === 'verify') add(2, 'verify', 'Documents received. Verify and certify', 'open', 'Verify');
    else if (r.stage === 'screening') add(2, 'screening', 'Run sanctions, PEP and adverse media screening', 'screen', 'Record screening');
    else if (r.stage === 'signoff') add(2, 'signoff', 'Ready for MLRO sign-off', 'signoff', 'Sign off');

    for (const t of defs(c)) {
      const d = c.docs[t.k];
      if (!d || !d.exp || d.s === 'requested') continue;
      const e = expDays(d.exp);
      if (e < 0) add(1, 'expired', `${t.short} expired ${fmt(d.exp)}`, 'open', 'Open file');
      else if (e <= s.expiryWarn) add(3, 'expiring', `${t.short} expires ${fmt(d.exp)} (${plural(e, 'day')})`, 'open', 'Open file');
    }
    for (const p of c.parties) {
      if (!p.idExp || p.req) continue;
      const e = expDays(p.idExp);
      if (e < 0) add(1, 'expired', `ID for ${p.name} (${p.role}) expired ${fmt(p.idExp)}`, 'open', 'Open file');
      else if (e <= s.expiryWarn) add(3, 'expiring', `ID for ${p.name} (${p.role}) expires ${fmt(p.idExp)}`, 'open', 'Open file');
    }
    if (!r && screenStale(c)) add(2, 'rescreen', `Screening last run ${c.screening ? fmt(c.screening.date) : 'never'}. Re-screen`, 'screen', 'Record screening');
    if (c.file.out) {
      const o = diffDays(parse(c.file.out.since), TODAY);
      if (o >= s.fileOutDays) add(3, 'file', `Paper file out with ${c.file.out.to} for ${o} days`, 'checkin', 'Mark returned');
    }
  }
  return out.sort((a, b) => a.sev - b.sev || a.c.name.localeCompare(b.c.name));
}

/* =========================================================
   Small renderers
   ========================================================= */
const riskPill = r => `<span class="pill ${RISK_CLS[r]}">${cap(r)}</span>`;
function dueChip(c) {
  const d = daysToReview(c);
  if (d < 0) return `<span class="pill crit">Overdue ${-d}d</span>`;
  if (d === 0) return `<span class="pill crit">Due today</span>`;
  if (d <= 30) return `<span class="pill warn">In ${d}d</span>`;
  if (d <= S.settings.lead) return `<span class="pill info">In ${d}d</span>`;
  return `<span class="pill neutral plain">In ${d}d</span>`;
}
function stageChip(c) {
  if (c.refresh) return `<span class="pill info plain">${esc(stageName(c.refresh.stage))}</span>`;
  return daysToReview(c) <= S.settings.lead ? '<span class="pill warn plain">Not started</span>' : '<span class="muted small">—</span>';
}
function statusChip(c) {
  if (c.status === 'restricted') return '<span class="pill crit plain">Services restricted</span>';
  if (c.status === 'exited') return '<span class="pill neutral plain">Exited</span>';
  return '';
}
function meter(a, n, cls) {
  const pct = n ? Math.round(a / n * 100) : 0;
  return `<span class="meter"><span class="track"><span class="fill ${cls || (pct === 100 ? 'ok' : '')}" style="width:${pct}%"></span></span><span class="mono num">${a}/${n}</span></span>`;
}
const sevTag = s => `<span class="sev ${SEV[s][1]}">${SEV[s][0]}</span>`;

function sampleBanner() {

/* =========================================================
   Overview
   ========================================================= */
let showAllTasks = false;
function viewOverview() {
  const A = active(), s = S.settings, T = tasks();
  const ds = A.map(daysToReview);
  const overdue = ds.filter(d => d < 0).length;
  const due = ds.filter(d => d >= 0 && d <= s.lead).length;
  const due30 = ds.filter(d => d >= 0 && d <= 30).length;
  const inprog = A.filter(c => c.refresh).length;
  const chase = T.filter(t => t.kind === 'chase' || t.kind === 'escalate').length;
  const waiting = A.filter(c => c.refresh && c.refresh.stage === 'awaiting').length;
  const expired = T.filter(t => t.kind === 'expired').length, expiring = T.filter(t => t.kind === 'expiring').length;
  let sc = 0, sn = 0; A.forEach(c => { const p = scanProgress(c); sc += p.s; sn += p.n; });
  const dig = sn ? Math.round(sc / sn * 100) : 0;
  const tile = (k, l, sub, cls, act) => `<button class="tile ${cls}" data-act="tile" data-f="${act}"><span class="l">${l}</span><span class="k">${k}</span><span class="s">${sub}</span></button>`;

    <p class="lede">What is overdue, what is coming up, and who you are waiting on. Review dates follow each client's risk rating: high every ${s.cycles.high} months, medium every ${s.cycles.medium}, low every ${s.cycles.low}.</p></div>
    <div class="row"><button class="btn" data-act="nav" data-to="pipeline">Open pipeline</button><button class="btn primary" data-act="add">Add client</button></div>
  </div>
  <section class="kpis" aria-label="Key figures">
    ${tile(overdue, 'Overdue reviews', 'Past their review date', overdue ? 'is-crit' : 'is-ok', 'overdue')}
    ${tile(due, `Due in ${s.lead} days`, `${due30} within 30 days`, due ? 'is-warn' : 'is-ok', 'due')}
    ${tile(inprog, 'Refreshes in progress', `${waiting} waiting on clients`, 'is-info', 'inprog')}
    ${tile(chase, 'Chasers due', 'Reminders or escalations', chase ? 'is-crit' : 'is-ok', 'chase')}
    ${tile(expired + expiring, 'ID and document expiries', `${expired} expired, ${expiring} within ${s.expiryWarn} days`, expired ? 'is-crit' : expiring ? 'is-warn' : 'is-ok', 'expiry')}
    ${tile(dig + '%', 'Paper files scanned', `${sc} of ${sn} documents on file`, 'is-manila', 'files')}
  </section>
  <div class="split">
    <section class="card chart">
      <header><div><h2>Reviews falling due</h2><p>Active clients by month of next review, stacked by risk</p></div>

      <div class="body mix">
        ${RISKS.map(r => { const n = A.filter(c => c.risk === r).length; const p = A.length ? n / A.length * 100 : 0; return `<div class="mix-row"><span>${cap(r)}</span><span class="bar"><span class="r-${r}" style="width:${p}%;background:var(--${RISK_CLS[r]})"></span></span><span class="mono num right">${n} · ${Math.round(p)}%</span></div>`; }).join('')}

      </div>

  <section class="card">

    <div class="scroll">${T.length ? `<table class="t"><thead><tr><th>Priority</th><th>Client</th><th>Risk</th><th>Action needed</th><th class="right"></th></tr></thead><tbody>

    </tbody></table>` : '<p class="empty">Nothing needs action today.</p>'}</div>
  </section>`;
}

function dueChart(A) {
  const b = Array.from({ length: 13 }, (_, i) => ({ high: 0, medium: 0, low: 0, i }));
  for (const c of A) {
    const nr = nextReview(c);
    if (nr < TODAY) { b[0][c.risk]++; continue; }
    const off = (nr.getFullYear() - TODAY.getFullYear()) * 12 + nr.getMonth() - TODAY.getMonth();
    if (off < 12) b[off + 1][c.risk]++;
  }
  const tot = b.map(x => x.high + x.medium + x.low);
  const max = Math.max(1, ...tot);
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const W = 660, H = 230, L = 30, R = 8, T = 18, B = 40;
  const cw = (W - L - R) / 13, bw = cw * .58, y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  let bars = '';
  b.forEach((x, i) => {
    const cx = L + cw * i + cw / 2;
    let acc = 0;
    for (const r of RISKS) {
      if (!x[r]) continue;
      const y0 = y(acc), y1 = y(acc + x[r]);
      bars += `<rect class="r-${r}" x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" rx="1.5"><title>${x[r]} ${r} risk</title></rect>`;
      acc += x[r];
    }
    if (tot[i]) bars += `<text class="val" x="${cx}" y="${y(tot[i]) - 5}" text-anchor="middle">${tot[i]}</text>`;
    let label, cls = 'ax';
    if (i === 0) { label = 'Overdue'; cls = 'ax-strong'; }
    else { const m = (TODAY.getMonth() + i - 1) % 12; label = MONTHS[m]; if (m === 0) bars += `<text class="ax" x="${cx}" y="${H - B + 30}" text-anchor="middle">${TODAY.getFullYear() + Math.floor((TODAY.getMonth() + i - 1) / 12)}</text>`; }
    bars += `<text class="${cls}" x="${cx}" y="${H - B + 16}" text-anchor="middle">${label}</text>`;
  });
  const sepX = L + cw;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Number of reviews overdue and due in each of the next 12 months">${g}<line class="sep" x1="${sepX}" x2="${sepX}" y1="${T - 6}" y2="${H - B}"/>${bars}</svg>`;
}

   Clients

const BUCKETS = { '': 'All', overdue: 'Overdue', due: 'Due soon', inprog: 'In progress', expiry: 'Expiries', current: 'Current', restricted: 'Restricted', exited: 'Exited' };
function viewClients() {
  const sel = (id, k, opts) => `<select class="inp sm" id="${id}" data-filter="${k}" aria-label="${k}">${opts.map(([v, n]) => `<option value="${v}" ${F[k] === v ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  return `
  ${sampleBanner()}
  <div class="page-head">
    <div><h1>Clients</h1><p class="lede">Every client on the register, with their review date, documents and paper file. Select a row to open the client file.</p></div>
    <div class="row">${FRAMED ? '' : '<button class="btn" data-act="exportcsv">Export register (CSV)</button>'}<button class="btn" data-act="importcsv">Import from CSV</button><button class="btn primary" data-act="add">Add client</button></div>
  </div>
  <section class="card">
    <div class="toolbar">
      <input class="inp search" id="q" type="search" placeholder="Search name, ID, file ref or country" value="${esc(F.q)}" aria-label="Search clients">
      ${sel('f-risk', 'risk', [['', 'All risk'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low']])}
      ${sel('f-type', 'type', [['', 'All types'], ...Object.entries(TYPES)])}
      <div class="seg" role="group" aria-label="Review status">${Object.entries(BUCKETS).map(([k, v]) => `<button data-act="bucket" data-b="${k}" aria-pressed="${F.bucket === k}">${v}</button>`).join('')}</div>
    </div>
    <div class="scroll"><table class="t"><thead><tr><th>Client</th><th>Type</th><th>Risk</th><th>Last review</th><th>Next review</th><th>Refresh</th><th>Documents</th><th>Paper file</th><th>Scanned</th></tr></thead><tbody id="client-rows"></tbody></table></div>
  </section>`;
}
function filteredClients() {
  const q = F.q.trim().toLowerCase(), s = S.settings;
  const T = F.bucket === 'expiry' || F.bucket === 'chase' ? tasks() : [];
  return S.clients.filter(c => {
    if (F.bucket !== 'exited' && c.status === 'exited') return false;
    if (q && ![c.name, c.id, c.file.ref, c.country, c.contact].join(' ').toLowerCase().includes(q)) return false;
    if (F.risk && c.risk !== F.risk) return false;
    if (F.type && c.type !== F.type) return false;
    const d = daysToReview(c);
    switch (F.bucket) {
      case 'overdue': return d < 0;
      case 'due': return d >= 0 && d <= s.lead;
      case 'inprog': return !!c.refresh;
      case 'current': return d > s.lead && !c.refresh;
      case 'restricted': return c.status === 'restricted';
      case 'exited': return c.status === 'exited';
      case 'expiry': return T.some(t => t.c === c && (t.kind === 'expired' || t.kind === 'expiring'));
      case 'chase': return T.some(t => t.c === c && (t.kind === 'chase' || t.kind === 'escalate'));
      default: return true;
    }
  }).sort((a, b) => daysToReview(a) - daysToReview(b));
}
function renderClientRows() {

  const rows = filteredClients();
  tb.innerHTML = rows.length ? rows.map(c => {

    return `<tr class="click" data-act="open" data-id="${c.id}">
      <td><a class="name" href="#client-${c.id}">${esc(c.name)}</a><span class="sub">${c.id}${isPep(c) ? ' · PEP' : ''}</span> ${statusChip(c)}</td>
      <td>${TYPES[c.type]}</td><td>${riskPill(c.risk)}</td>
      <td class="num">${fmt(c.last)}</td>
      <td class="num">${fmtD(nextReview(c))}<br>${dueChip(c)}</td>
      <td>${stageChip(c)}</td>
      <td>${meter(dp.ok, dp.n)}</td>
      <td><span class="mono">${esc(c.file.ref)}</span><span class="sub">${c.file.out ? 'Out: ' + esc(c.file.out.to) : esc(c.file.loc)}</span></td>
      <td>${meter(sp.s, sp.n, 'warn')}</td></tr>`;
  }).join('') : `<tr><td colspan="9" class="empty">No clients match these filters.</td></tr>`;
}

/* =========================================================
   Pipeline
   ========================================================= */
function viewPipeline() {
  const A = active(), s = S.settings;
  const cols = [{ k: 'due', n: 'Due, not started', d: `Overdue or due within ${s.lead} days.` }, ...STAGES];
  const card = c => {
    const r = c.refresh;
    let meta = '';
    if (!r) { const d = daysToReview(c); meta = d < 0 ? `<span class="pill crit">Overdue ${-d}d</span>` : `Due ${fmtD(nextReview(c))}`; }
    else if (r.stage === 'awaiting') { const w = diffDays(parse(r.requested), TODAY); meta = `Requested ${w}d ago · ${plural(r.chases, 'reminder')}${r.escalated ? ' · <span class="pill crit plain">Escalated</span>' : ''}`; }
    else if (r.stage === 'verify') { const p = docProgress(c); meta = `${p.ok}/${p.n} verified`; }
    else if (r.stage === 'screening') meta = c.screening && c.screening.date >= r.started ? 'Screening recorded' : 'Screening not yet run';
    else meta = `Review due ${fmtD(nextReview(c))}`;
    return `<div class="kcard" data-act="open" data-id="${c.id}" tabindex="0" role="link"><div class="top"><span class="nm">${esc(c.name)}</span>${riskPill(c.risk)}</div><span class="meta mono">${c.id} · ${TYPES[c.type]}</span><span class="meta">${meta}</span></div>`;
  };
  const inCol = k => A.filter(c => k === 'due' ? (!c.refresh && daysToReview(c) <= s.lead) : (c.refresh && c.refresh.stage === k)).sort((a, b) => daysToReview(a) - daysToReview(b));
  return `
  ${sampleBanner()}
  <div class="page-head"><div><h1>Refresh pipeline</h1><p class="lede">Each periodic review moves left to right. Open a card to take the next step; a stage only completes when its checks are done.</p></div></div>
  <div class="board">${cols.map(col => { const items = inCol(col.k); return `<section class="col"><header><h3>${col.n}</h3><span class="n">${items.length}</span></header><p>${col.d}</p>${items.map(card).join('') || '<p class="muted small" style="padding:8px 4px">None</p>'}</section>`; }).join('')}</div>`;
}

/* =========================================================
   Outreach
   ========================================================= */
function viewOutreach() {
  const s = S.settings;
  const waiting = active().filter(c => c.refresh && c.refresh.stage === 'awaiting').sort((a, b) => a.refresh.requested.localeCompare(b.refresh.requested));
  const all = [];
  S.clients.forEach(c => c.outreach.forEach(o => all.push({ c, o })));
  all.sort((a, b) => b.o.d.localeCompare(a.o.d));
  const nextStep = c => {
    const r = c.refresh, w = diffDays(parse(r.requested), TODAY), [c1, c2, c3] = s.chase;
    if (r.escalated) return '<span class="pill crit plain">Escalated to MLRO</span>';
    if (w >= c3) return '<span class="pill crit plain">Escalate now</span>';
    if (w >= c2 && r.chases < 2) return '<span class="pill warn plain">Final reminder due</span>';
    if (w >= c1 && r.chases < 1) return '<span class="pill warn plain">First reminder due</span>';
    const nxt = r.chases < 1 ? c1 : r.chases < 2 ? c2 : c3;
    return `<span class="muted small">Next chase ${fmtD(addDays(parse(r.requested), nxt))}</span>`;
  };
  return `
  ${sampleBanner()}
  <div class="page-head"><div><h1>Outreach</h1><p class="lede">Clients you have asked for documents. Reminders go at ${s.chase[0]} and ${s.chase[1]} days, and the file is escalated to the MLRO at ${s.chase[2]} days without a response.</p></div></div>
  <section class="card">
    <header><div><h2>Waiting on clients</h2><p>${plural(waiting.length, 'client')}</p></div></header>
    <div class="scroll">${waiting.length ? `<table class="t"><thead><tr><th>Client</th><th>Requested</th><th>Waiting</th><th>Reminders</th><th>Outstanding</th><th>Contact</th><th>Next step</th><th></th></tr></thead><tbody>
    ${waiting.map(c => { const r = c.refresh; const w = diffDays(parse(r.requested), TODAY); const out = outstanding(c);
      return `<tr><td><a class="name" href="#client-${c.id}">${esc(c.name)}</a><span class="sub">${c.id}</span></td><td class="num">${fmt(r.requested)}</td><td class="num mono">${w}d</td><td class="num mono">${r.chases}</td><td>${out.length}</td>
      <td class="small"><span class="mono">${esc(c.email)}</span><br><span class="mono">${esc(c.phone)}</span></td><td>${nextStep(c)}</td>
      <td class="right"><div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="letter" data-id="${c.id}" data-kind="${r.chases ? 'final' : 'reminder'}">Draft letter</button>${r.escalated ? '' : w >= s.chase[2] ? `<button class="btn sm primary" data-act="escalate" data-id="${c.id}">Escalate</button>` : `<button class="btn sm primary" data-act="chase" data-id="${c.id}">Log reminder</button>`}</div></td></tr>`; }).join('')}
    </tbody></table>` : '<p class="empty">No clients are waiting on a document request.</p>'}</div>
  </section>
  <section class="card">
    <header><div><h2>Contact log</h2><p>Every request and reminder, newest first</p></div></header>
    <div class="scroll">${all.length ? `<table class="t"><thead><tr><th>Date</th><th>Client</th><th>Type</th><th>Method</th><th>Note</th><th>By</th></tr></thead><tbody>
    ${all.slice(0, 60).map(({ c, o }) => `<tr><td class="num mono">${o.d}</td><td><a class="name" href="#client-${c.id}">${esc(c.name)}</a></td><td>${esc(o.kind)}</td><td>${esc(o.m)}</td><td>${esc(o.note)}</td><td class="muted">${esc(o.by)}</td></tr>`).join('')}
    </tbody></table>` : '<p class="empty">No contact recorded yet.</p>'}</div>
  </section>`;
}

/* =========================================================
   Paper files
   ========================================================= */
function viewFiles() {
  const A = active();
  let sc = 0, sn = 0; A.forEach(c => { const p = scanProgress(c); sc += p.s; sn += p.n; });
  const out = A.filter(c => c.file.out);
  const backlog = A.map(c => ({ c, p: scanProgress(c) })).filter(x => x.p.n - x.p.s > 0).sort((a, b) => (b.p.n - b.p.s) - (a.p.n - a.p.s));
  return `
  ${sampleBanner()}
  <div class="page-head"><div><h1>Paper files</h1><p class="lede">The physical file stays the record of truth. This register tracks where each file is, who has it, and how much of it has been scanned into the digital copy.</p></div></div>
  <section class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="tile is-manila" style="cursor:default"><span class="l">Documents scanned</span><span class="k">${sn ? Math.round(sc / sn * 100) : 0}%</span><span class="s">${sc} of ${sn} documents held on paper</span></div>
    <div class="tile ${out.length ? 'is-warn' : 'is-ok'}" style="cursor:default"><span class="l">Files checked out</span><span class="k">${out.length}</span><span class="s">${out.filter(c => diffDays(parse(c.file.out.since), TODAY) >= S.settings.fileOutDays).length} out longer than ${S.settings.fileOutDays} days</span></div>
    <div class="tile is-info" style="cursor:default"><span class="l">Scanning backlog</span><span class="k">${sn - sc}</span><span class="s">Across ${plural(backlog.length, 'file')}</span></div>
  </section>
  <section class="card">
    <header><div><h2>File register</h2><p>Sorted by cabinet</p></div></header>
    <div class="scroll"><table class="t"><thead><tr><th>File ref</th><th>Client</th><th>Location</th><th>Status</th><th>Scanned</th><th></th></tr></thead><tbody>
    ${[...A].sort((a, b) => a.file.loc.localeCompare(b.file.loc) || a.file.ref.localeCompare(b.file.ref)).map(c => { const p = scanProgress(c); const o = c.file.out;
      return `<tr><td class="mono">${esc(c.file.ref)}</td><td><a class="name" href="#client-${c.id}">${esc(c.name)}</a><span class="sub">${c.id}</span></td><td>${esc(c.file.loc)}</td>
      <td>${o ? `<span class="pill warn plain">Out: ${esc(o.to)}</span><span class="sub">since ${fmt(o.since)} · ${esc(o.purpose || '')}</span>` : '<span class="pill ok plain">In cabinet</span>'}</td>
      <td>${meter(p.s, p.n, 'warn')}</td>
      <td class="right"><div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="checklist" data-id="${c.id}">File checklist</button>${o ? `<button class="btn sm" data-act="checkin" data-id="${c.id}">Mark returned</button>` : `<button class="btn sm" data-act="checkout" data-id="${c.id}">Check out</button>`}</div></td></tr>`; }).join('')}
    </tbody></table></div>
  </section>`;
}

/* =========================================================
   Client file
   ========================================================= */
function viewClient(c) {
  const s = S.settings, r = c.refresh, d = daysToReview(c), nr = nextReview(c);
  const dueCls = d < 0 ? 'crit' : d <= 30 ? 'warn' : d <= s.lead ? 'info' : 'ok';
  const dueTxt = d < 0 ? `Overdue by ${plural(-d, 'day')}` : d === 0 ? 'Due today' : `In ${plural(d, 'day')}`;
  const si = r ? STAGES.findIndex(x => x.k === r.stage) : -1;
  const steps = [{ n: 'Due', d: 'Review date reached' }, ...STAGES];
  const stepper = `<div class="stepper" aria-label="Refresh progress">${steps.map((x, i) => {
    const cls = !r ? (i === 0 && d <= s.lead ? 'now' : '') : i - 1 < si ? 'done' : i - 1 === si ? 'now' : '';
    return `<div class="step ${cls}"><span class="idx">${cls === 'done' ? 'Done' : 'Step ' + (i + 1)}</span><b>${x.n}</b></div>`;
  }).join('')}</div>`;

  // stage action bar
  let bar = '';
  const g = gate(c);
  if (!r) {
    bar = `<span class="why">${d <= s.lead ? 'This review is due. Start the refresh to choose what to request and draft the letter.' : `No refresh due until ${fmtD(nr)}. You can start one early after a trigger event (new owner, adverse media, unusual activity).`}</span><button class="btn ${d <= s.lead ? 'primary' : ''}" data-act="start" data-id="${c.id}">Start refresh</button>`;
  } else if (r.stage === 'awaiting') {
    const out = outstanding(c);
    bar = `<span class="why">Requested ${fmt(r.requested)} by ${esc(r.method.toLowerCase())}. ${plural(out.length, 'item')} outstanding, ${plural(r.chases, 'reminder')} sent. Mark documents as received below as they arrive.</span>
      <div class="row"><button class="btn" data-act="letter" data-id="${c.id}" data-kind="${r.chases ? 'final' : 'reminder'}">Draft letter</button>${r.escalated ? '' : `<button class="btn" data-act="chase" data-id="${c.id}">Log reminder</button><button class="btn" data-act="escalate" data-id="${c.id}">Escalate</button>`}<button class="btn primary" data-act="advance" data-id="${c.id}">Documents received</button></div>`;
  } else if (r.stage === 'verify') {
    bar = `<span class="why">${g ? `Still to verify: ${esc(g.slice(0, 4).join('; '))}${g.length > 4 ? ` and ${g.length - 4} more` : ''}.` : 'All required documents and connected parties are verified.'}</span><button class="btn primary" data-act="advance" data-id="${c.id}" ${g ? 'disabled' : ''}>Verification complete</button>`;
  } else if (r.stage === 'screening') {
    bar = `<span class="why">${g ? 'Run sanctions, PEP and adverse media screening on the client and every connected party, then confirm the risk assessment.' : `Screening recorded ${fmt(c.screening.date)}: ${esc(c.screening.result)}.`}</span><div class="row"><button class="btn ${g ? 'primary' : ''}" data-act="screen" data-id="${c.id}">Record screening</button><button class="btn ${g ? '' : 'primary'}" data-act="advance" data-id="${c.id}" ${g ? 'disabled' : ''}>Send to sign-off</button></div>`;
  } else {
    bar = `<span class="why">Everything is in place. The approver confirms the risk rating, and the next review date is set from it.</span><button class="btn primary" data-act="signoff" data-id="${c.id}">Sign off review</button>`;
  }

  const sp = scanProgress(c), dp = docProgress(c);
  const o = c.file.out;
  const sug = suggested(c);
  return `
  <div class="crumb"><a href="#clients">Clients</a> <span class="muted">/ ${c.id}</span></div>
  <div class="client-head">
    <div>
      <div class="eyebrow">${TYPES[c.type]} · ${esc(c.country)}</div>
      <h1>${esc(c.name)}</h1>
      <div class="ids"><span class="mono">${c.id}</span>${riskPill(c.risk)}<span class="tag">${cap(c.risk)} risk</span>${isPep(c) ? '<span class="pill crit plain">PEP</span>' : ''}${statusChip(c)}<span class="tag">${esc(service(c))}</span></div>
    </div>
    <div class="due-box"><span class="eyebrow">Next periodic review</span><span class="d num">${fmtD(nr)}</span><span class="pill ${dueCls}" style="justify-self:start">${dueTxt}</span><span class="small muted">Every ${s.cycles[c.risk]} months · last ${fmt(c.last)}</span></div>
  </div>
  ${stepper}
  <div class="actionbar">${bar}</div>
  <div class="cols">
    <div class="stack">
      <section class="card">
        <header><div><h2>Documents</h2><p>${dp.ok} of ${dp.n} required documents verified · ${sp.s} of ${sp.n} on file scanned</p></div><div class="row"><button class="btn sm" data-act="checklist" data-id="${c.id}">File checklist</button></div></header>
        <div class="scroll">${docsTable(c)}</div>
      </section>
      <section class="card">
        <header><div><h2>Connected parties</h2><p>${partyHint(c)}</p></div></header>
        <div class="scroll">${partiesTable(c)}</div>
      </section>
      <section class="card">
        <header><div><h2>Outreach</h2><p>Requests and reminders sent to this client</p></div><button class="btn sm" data-act="letter" data-id="${c.id}" data-kind="${r && r.chases ? 'final' : r ? 'reminder' : 'request'}">Draft letter</button></header>
        <div class="body">${c.outreach.length ? `<ul class="timeline">${c.outreach.map(x => `<li><time>${x.d}</time><span><b>${esc(x.kind)}</b> · ${esc(x.m)}<br><span class="muted">${esc(x.note)}${x.by ? ' · ' + esc(x.by) : ''}</span></span></li>`).join('')}</ul>` : '<p class="muted small">No contact recorded.</p>'}</div>
      </section>
      <section class="card">
        <header><div><h2>Audit trail</h2><p>Every change made to this file</p></div></header>
        <div class="body"><ul class="timeline">${c.history.slice(0, 40).map(h => `<li><time>${h.d}</time><span>${esc(h.t)} <span class="muted">· ${esc(h.by)}</span></span></li>`).join('')}</ul></div>
      </section>
    </div>
    <div class="stack">
      <section class="manila" data-tab="PAPER FILE">
        <div class="row" style="justify-content:space-between"><span class="ref">${esc(c.file.ref)}</span>${o ? '<span class="pill warn plain">Checked out</span>' : '<span class="pill ok plain">In cabinet</span>'}</div>
        <dl class="kv"><dt>Location</dt><dd>${esc(c.file.loc)}</dd>${o ? `<dt>With</dt><dd>${esc(o.to)}</dd><dt>Since</dt><dd>${fmt(o.since)} (${diffDays(parse(o.since), TODAY)} days)</dd><dt>Purpose</dt><dd>${esc(o.purpose || '—')}</dd>` : ''}<dt>Scanned</dt><dd>${meter(sp.s, sp.n, 'warn')}</dd></dl>
        <div class="row">${o ? `<button class="btn sm" data-act="checkin" data-id="${c.id}">Mark returned</button>` : `<button class="btn sm" data-act="checkout" data-id="${c.id}">Check out</button>`}<button class="btn sm" data-act="checklist" data-id="${c.id}">Print cover sheet</button></div>
      </section>
      <section class="card">
        <header><h2>Client details</h2><button class="btn sm" data-act="edit" data-id="${c.id}">Edit</button></header>
        <div class="body"><dl class="kv">
          <dt>Contact</dt><dd>${esc(c.contact)}</dd><dt>Email</dt><dd class="mono">${esc(c.email) || '—'}</dd><dt>Phone</dt><dd class="mono">${esc(c.phone) || '—'}</dd>
          <dt>Address</dt><dd style="white-space:pre-line">${esc(c.address) || '—'}</dd><dt>Partner</dt><dd>${esc(c.rm) || '—'}</dd><dt>Onboarded</dt><dd>${fmt(c.onboarded)}</dd>
          ${c.note ? `<dt>Note</dt><dd>${esc(c.note)}</dd>` : ''}
        </dl></div>
      </section>
      <section class="card">
        <header><div><h2>Risk assessment</h2><p>Changes are logged to the audit trail</p></div></header>
        <div class="body ra">
          ${RISK_FACTORS.map(f => `<label for="ra-${f.k}">${f.n}<select id="ra-${f.k}" data-ra="${f.k}" data-id="${c.id}">${f.o.map((x, i) => `<option value="${i}" ${(c.ra[f.k] || 0) === i ? 'selected' : ''}>${x[0]} (${x[1]})</option>`).join('')}</select></label>`).join('')}
          <div class="score"><b class="num">${raScore(c)}</b><span>Suggested rating ${riskPill(sug)}</span></div>
          <p class="note">8 or more is high, 4 to 7 medium, 3 or less low. A PEP is always high.${sug !== c.risk ? '' : ' The suggested rating matches the current rating.'}</p>
          ${sug !== c.risk ? `<div class="callout warn">Current rating is ${cap(c.risk)}. ${c.note ? 'Check the override note before changing it.' : ''}<div class="row" style="margin-top:8px"><button class="btn sm" data-act="applyrisk" data-id="${c.id}">Change to ${cap(sug)}</button></div></div>` : ''}
        </div>
      </section>
      <section class="card">
        <header><h2>Screening</h2><button class="btn sm" data-act="screen" data-id="${c.id}">Record screening</button></header>
        <div class="body">${c.screening ? `<dl class="kv"><dt>Last run</dt><dd>${fmt(c.screening.date)} ${screenStale(c) ? '<span class="pill crit plain">Due</span>' : ''}</dd><dt>Result</dt><dd>${esc(c.screening.result)}</dd><dt>Checked</dt><dd>${esc(c.screening.lists)}</dd><dt>By</dt><dd>${esc(c.screening.by)}</dd></dl>` : '<p class="muted small">Not screened yet.</p>'}
        <p class="note" style="margin-top:8px">${cap(c.risk)} risk clients are re-screened every ${s.screen[c.risk]} months.</p></div>
      </section>
      ${c.status === 'exited' ? '' : `<button class="btn quiet" data-act="cancelrefresh" data-id="${c.id}" ${r ? '' : 'hidden'}>Cancel this refresh</button>`}
    </div>
  </div>`;
}

function docsTable(c) {
  const rows = defs(c);
  return `<table class="t docs"><thead><tr><th>Document</th><th>Status</th><th>Received</th><th>Expires</th><th>On paper</th><th>Scan</th></tr></thead><tbody>
  ${rows.map(t => {
    const d = doc(c, t.k), st = docState(d), e = expDays(d.exp);
    const tags = [t.refresh ? 'Each review' : 'Once', t.when === 'high' ? 'High risk' : '', t.when === 'optional' ? 'Optional' : ''].filter(Boolean);
    const sel = `<select class="st ${DOC_STATUS[d.s].cls}" id="doc-${t.k}-s" data-doc="${t.k}" data-f="s" data-id="${c.id}" aria-label="Status">${['missing', 'requested', 'received', 'verified'].map(k => `<option value="${k}" ${d.s === k ? 'selected' : ''}>${DOC_STATUS[k].n}</option>`).join('')}</select>`;
    return `<tr><td><span class="doc-name">${esc(t.n)}</span><span class="doc-tags">${tags.map(x => `<span class="tag">${x}</span>`).join('')}${st === 'expired' ? '<span class="pill crit plain">Expired</span>' : e != null && e <= S.settings.expiryWarn ? `<span class="pill warn plain">Expires in ${e}d</span>` : ''}</span></td>
      <td>${sel}</td>
      <td><input class="inp sm" type="date" id="doc-${t.k}-rec" data-doc="${t.k}" data-f="rec" data-id="${c.id}" value="${d.rec || ''}" aria-label="Date received"></td>
      <td><input class="inp sm" type="date" id="doc-${t.k}-exp" data-doc="${t.k}" data-f="exp" data-id="${c.id}" value="${d.exp || ''}" aria-label="Expiry date"></td>
      <td><input type="checkbox" id="doc-${t.k}-paper" data-doc="${t.k}" data-f="paper" data-id="${c.id}" ${d.paper ? 'checked' : ''} aria-label="Original or certified copy on the paper file"></td>
      <td><span class="scanbox"><input type="checkbox" id="doc-${t.k}-scan" data-doc="${t.k}" data-f="scan" data-id="${c.id}" ${d.scan ? 'checked' : ''} aria-label="Scanned">${d.att ? `<button class="btn sm quiet" data-act="viewatt" data-id="${c.id}" data-k="${t.k}">View</button>` : `<button class="btn sm quiet" data-act="attach" data-id="${c.id}" data-k="${t.k}">Attach</button>`}</span></td></tr>`;
  }).join('')}</tbody></table>`;
}
function partyHint(c) {
  return { individual: 'Joint clients and anyone acting for the client', company: 'Directors, beneficial owners, shareholders and signatories', trust: 'Settlor, trustees, protector and beneficiaries', partnership: 'Partners, beneficial owners and signatories' }[c.type] + '. Each needs certified ID and proof of address.';
}
function partiesTable(c) {
  const rows = c.parties.map(p => {
    const e = expDays(p.idExp);
    const flag = e == null ? '' : e < 0 ? '<span class="pill crit plain">ID expired</span>' : e <= S.settings.expiryWarn ? `<span class="pill warn plain">ID expires in ${e}d</span>` : '';
    return `<tr><td><b>${esc(p.name)}</b> ${p.req ? '<span class="pill info plain">Requested</span>' : ''} ${flag}</td><td>${esc(p.role)}</td><td class="num mono">${p.pct !== '' && p.pct != null ? esc(p.pct) + '%' : '—'}</td>
      <td><input class="inp sm" type="date" id="party-${p.id}-idExp" data-party="${p.id}" data-f="idExp" data-id="${c.id}" value="${p.idExp || ''}" aria-label="ID expiry"></td>
      <td><input type="checkbox" id="party-${p.id}-idOk" data-party="${p.id}" data-f="idOk" data-id="${c.id}" ${p.idOk ? 'checked' : ''} aria-label="Certified ID verified"></td>
      <td><input type="checkbox" id="party-${p.id}-poaOk" data-party="${p.id}" data-f="poaOk" data-id="${c.id}" ${p.poaOk ? 'checked' : ''} aria-label="Proof of address verified"></td>
      <td class="right"><button class="btn sm quiet" data-act="delparty" data-id="${c.id}" data-p="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button></td></tr>`;
  }).join('');
  return `<table class="t"><thead><tr><th>Name</th><th>Role</th><th>Owns</th><th>ID expires</th><th>ID verified</th><th>Address verified</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="muted small">No connected parties recorded.</td></tr>'}
  <tr><td><input class="inp sm" id="np-name" placeholder="Full name" style="width:100%"></td><td><select class="inp sm" id="np-role">${ROLES[c.type].map(r => `<option>${r}</option>`).join('')}</select></td><td><input class="inp sm" id="np-pct" type="number" min="0" max="100" placeholder="%" style="width:64px"></td><td><input class="inp sm" id="np-exp" type="date" aria-label="ID expiry"></td><td colspan="3" class="right"><button class="btn sm" data-act="addparty" data-id="${c.id}">Add party</button></td></tr></tbody></table>`;
}

function outstanding(c) {
  const items = reqDefs(c).filter(t => ['missing', 'requested', 'expired'].includes(docState(doc(c, t.k)))).map(t => t.n);
  c.parties.forEach(p => { if (p.req || (p.idExp && !partyOK(p))) items.push(`Certified ID and proof of address for ${p.name} (${p.role})`); });
  return items;
}
function gate(c) {
  const r = c.refresh; if (!r) return null;
  if (r.stage === 'verify') {
    const miss = reqDefs(c).filter(t => !docOK(doc(c, t.k))).map(t => t.short);
    c.parties.filter(p => !partyOK(p)).forEach(p => miss.push(`${p.name} ID/address`));
    return miss.length ? miss : null;
  }
  if (r.stage === 'screening') return c.screening && c.screening.date >= r.started ? null : ['Screening not recorded for this review'];
  return null;
}

/* =========================================================

   ========================================================= */
function modal(title, body, buttons, opts = {}) {
  const root = $('#modal');
  root.innerHTML = `<div class="scrim" data-close></div><div class="dlg ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><header><h2 id="dlg-t">${esc(title)}</h2><button class="x" data-close aria-label="Close">×</button></header><div class="dlg-b">${body}<p class="err" id="dlg-err" hidden></p></div><footer></footer></div>`;
  const foot = $('footer', root), dlg = $('.dlg', root);
  [{ label: opts.cancel || 'Cancel', cls: '', fn: () => true }, ...buttons].forEach(b => {
    if (b.hidden) return;
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.textContent = b.label;
    el.addEventListener('click', async () => { const res = await b.fn(dlg); if (res !== false) closeModal(); });
    foot.append(el);
  });
  root.hidden = false;
  const first = $('input:not([type=checkbox]), select, textarea', dlg);
  (first || $('footer .btn:last-child', root)).focus();
  return dlg;
}
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
function fail(dlg, msg) { const e = $('#dlg-err', dlg); e.textContent = msg; e.hidden = false; return false; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }
const methodSel = (id, v) => `<select id="${id}">${METHODS.map(m => `<option ${m === v ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
function later(fn) { setTimeout(fn, 0); }
function commit(msg) { save(); render(); if (msg) toast(msg); }

/* ---------- start refresh ---------- */
function modalStart(c) {
  const s = S.settings, horizon = s.cycles[c.risk] * 30;
  const items = defs(c).map(t => {
    const d = doc(c, t.k), st = docState(d), e = expDays(d.exp);
    let why = '', pre = false;
    if (st === 'expired') { why = 'Expired'; pre = true; }
    else if (st === 'missing' && t.when !== 'optional') { why = 'Not on file'; pre = true; }
    else if (e != null && e <= horizon) { why = `Expires ${fmt(d.exp)}, before the next cycle ends`; pre = true; }
    else if (t.refresh) { why = 'Updated at every review'; pre = true; }
    else why = t.when === 'optional' ? 'Optional' : `On file since ${fmt(d.rec)}`;
    return { v: 'd:' + t.k, n: t.n, why, pre };
  });
  c.parties.forEach(p => {
    const e = expDays(p.idExp);
    const pre = !p.idOk || !p.poaOk || (e != null && e <= horizon);
    items.push({ v: 'p:' + p.id, n: `Certified ID and proof of address: ${p.name} (${p.role})`, why: e == null ? (pre ? 'Not verified' : 'No expiry recorded') : e < 0 ? 'ID expired' : `ID expires ${fmt(p.idExp)}`, pre });
  });
  const body = `
    <p>Choose what to ask ${esc(c.name)} for. Items that change at every review, or that are missing or expiring, are already ticked.</p>
    <div class="reqlist">${items.map((x, i) => `<label class="check" for="rq${i}"><input type="checkbox" id="rq${i}" name="req" value="${x.v}" ${x.pre ? 'checked' : ''}><span>${esc(x.n)}<span class="why">${esc(x.why)}</span></span></label>`).join('')}</div>
    <div class="grid2"><label class="field" for="st-m">How the request is sent${methodSel('st-m', c.email ? 'Email' : 'Letter by post')}</label><label class="field" for="st-d">Date sent<input type="date" id="st-d" value="${iso(TODAY)}"></label></div>`;
  modal(`Start refresh: ${c.name}`, body, [{ label: 'Start refresh and draft letter', cls: 'primary', fn: dlg => {
    const keys = $$('input[name=req]:checked', dlg).map(i => i.value);
    if (!keys.length) return fail(dlg, 'Tick at least one item to request.');
    const date = $('#st-d', dlg).value || iso(TODAY), method = $('#st-m', dlg).value;
    c.refresh = { stage: 'awaiting', started: date, requested: date, lastContact: date, chases: 0, method, escalated: '' };
    keys.forEach(k => {
      const [kind, id] = k.split(':');
      if (kind === 'd') { const d = doc(c, id); d.s = 'requested'; d.req = date; }
      else { const p = c.parties.find(x => x.id === id); if (p) p.req = true; }
    });
    c.outreach.unshift({ d: date, m: method, kind: 'Document request', note: `${keys.length} items requested`, by: me() });
    log(c, `Periodic review started. ${keys.length} items requested (${method.toLowerCase()}).`);
    commit('Refresh started');
    later(() => modalLetter(c, 'request'));
  } }], { wide: true });
}

/* ---------- reminders & escalation ---------- */

  const r = c.refresh; if (!r) return;
  const kind = r.chases >= 1 ? 'Final reminder' : 'Reminder';
  const body = `<p>${esc(c.name)} was asked for documents on ${fmt(r.requested)} (${diffDays(parse(r.requested), TODAY)} days ago). ${plural(outstanding(c).length, 'item')} still outstanding.</p>
    <div class="grid2"><label class="field" for="ch-k">Type<select id="ch-k"><option ${kind === 'Reminder' ? 'selected' : ''}>Reminder</option><option ${kind === 'Final reminder' ? 'selected' : ''}>Final reminder</option></select></label>

    <label class="field span2" for="ch-n">Note<input id="ch-n" placeholder="e.g. Spoke to client, documents promised by Friday"></label></div>`;

function modalEscalate(c) {
  const r = c.refresh; if (!r) return;

/* ---------- stage moves ---------- */
function advance(c) {
  const r = c.refresh; if (!r) return;
  if (r.stage === 'awaiting') {
    const out = outstanding(c);
    const go2 = () => { r.stage = 'verify'; log(c, 'Documents received from client. Moved to verification.'); commit('Moved to verification'); };
    if (!out.length) return go2();
    modal('Documents received?', `<p>${plural(out.length, 'item')} still marked as outstanding:</p><div class="callout warn"><ul>${out.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><p class="note">Moving on is fine if the documents are in hand but not yet logged. Update each document's status during verification.</p>`,
      [{ label: 'Move to verification', cls: 'primary', fn: () => { go2(); } }]);
    return;
  }
  if (gate(c)) return;
  if (r.stage === 'verify') { r.stage = 'screening'; log(c, 'Verification complete. Moved to screening and risk review.'); commit('Moved to screening'); }
  else if (r.stage === 'screening') { r.stage = 'signoff'; log(c, 'Screening and risk review complete. Sent for MLRO sign-off.'); commit('Sent for sign-off'); }
}

/* =========================================================
   Scans (IndexedDB, this browser only)
   ========================================================= */
const ATT = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (this.db) return res(this.db);
      let r; try { r = indexedDB.open('kyc-refresh-desk-files', 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('files', mode); const out = fn(t.objectStore('files')); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
  },
  put(id, rec) { return this.tx('readwrite', s => s.put(rec, id)); },
  get(id) { return this.tx('readonly', s => s.get(id)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  clear() { return this.tx('readwrite', s => s.clear()); },
  async all() {
    const keys = await this.tx('readonly', s => s.getAllKeys());
    const out = [];
    for (const k of keys || []) out.push([k, await this.get(k)]);
    return out;
  },
};

function download(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
}
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataToBlob(u) {
  const [h, b64] = u.split(','); const type = (h.match(/data:([^;]+)/) || [])[1] || '';
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

  download(`kyc-refresh-desk-backup-${iso(TODAY)}.json`, JSON.stringify({ app: 'kyc-refresh-desk', v: 1, exported: new Date().toISOString(), state: S, files }), 'application/json');

function exportCSV() {

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function normDate(s) {
  s = (s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/))) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`; // day first
  return '';
}

  if (!head.includes('name')) { modal('Column missing', `<p>The first row must contain column names, including <b>name</b>. Use this layout:</p><textarea class="letter" style="min-height:120px" readonly>${esc(CSV_TEMPLATE)}</textarea>`, [], { cancel: 'Close' }); return; }

        ra: { jur: 0, pep: /^y|true|1/i.test(col(r, 'pep')) ? 1 : 0, svc: 0, chan: 0, sow: 0, struct: type === 'individual' ? 0 : 1, media: 0 },
        docs: {}, parties: [], outreach: [], history: [{ d: iso(TODAY), t: 'Client imported from CSV register.', by: me() }], reviews: [], refresh: null, screening: null,

  },
  loadsample: () => modal('Load sample clients', '<p>Replace every record in this browser with the fictional sample clients? Your settings are kept.</p>', [{ label: 'Load sample clients', cls: 'danger solid', fn: async () => {
    S = seed(S.settings); try { await ATT.clear(); } catch (e) { /* none */ } commit('Sample clients loaded'); later(() => go('overview'));
  } }]),
  erase: () => modal('Erase all records', '<p>Delete every client, document record, scan and audit entry stored in this browser? Settings are kept.</p><p class="callout crit">This cannot be undone. Save a backup first if you may need these records.</p><label class="field" for="er-c">Type ERASE to confirm<input id="er-c" autocomplete="off"></label>', [{ label: 'Erase everything', cls: 'danger solid', fn: async dlg => {
    if ($('#er-c', dlg).value.trim() !== 'ERASE') return fail(dlg, 'Type ERASE in capitals to confirm.');
    S = emptyState(S.settings); try { await ATT.clear(); } catch (e) { /* none */ } commit('All records erased'); later(() => go('overview'));
  } }]),
};

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  // let real links and form controls inside clickable rows behave normally
  if (el.tagName === 'TR' && e.target.closest('a, button, input, select')) return;
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if (e.key === 'Enter' && e.target.matches('.kcard')) e.target.click();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { F.q = e.target.value; renderClientRows(); }
});
document.addEventListener('change', e => {
  const el = e.target, ds = el.dataset;
  if (ds.filter) { F[ds.filter] = el.value; renderClientRows(); return; }
  if (ds.set) {
    const path = ds.set.split('.');
    let v = el.type === 'number' ? Math.max(Number(el.min) || 0, Number(el.value) || 0) : el.value.trim();
    let o = S.settings; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = v;
    save(); renderNav(); toast('Setting saved');
    return;
  }
  if (ds.doc) {
    const c = get(ds.id), t = defOf(c, ds.doc), d = doc(c, ds.doc), f = ds.f;
    const v = el.type === 'checkbox' ? el.checked : el.value;
    const old = d[f];
    d[f] = v;
    if (f === 's') {
      if ((v === 'received' || v === 'verified') && (!d.rec || (c.refresh && d.rec < c.refresh.started))) d.rec = iso(TODAY);
      if (v === 'received' && d.paper === false) d.paper = true;
      log(c, `${t.short}: ${DOC_STATUS[old].n} → ${DOC_STATUS[v].n}.`);
    } else if (f === 'exp') log(c, `${t.short}: expiry date set to ${v ? fmt(v) : 'none'}.`);
    else if (f === 'paper') log(c, `${t.short}: ${v ? 'original or certified copy placed on paper file' : 'removed from paper file'}.`);
    else if (f === 'scan') log(c, `${t.short}: marked as ${v ? 'scanned' : 'not scanned'}.`);
    save(); rerender();
    return;
  }
  if (ds.party) {
    const c = get(ds.id), p = c.parties.find(x => x.id === ds.party), f = ds.f;
    p[f] = el.type === 'checkbox' ? el.checked : el.value;
    if (f === 'idOk' || f === 'poaOk') log(c, `${p.name}: ${f === 'idOk' ? 'certified ID' : 'proof of address'} ${p[f] ? 'verified' : 'marked as not verified'}.`);
    if (f === 'idExp') log(c, `${p.name}: ID expiry set to ${p.idExp ? fmt(p.idExp) : 'none'}.`);
    if (p.req && partyOK(p)) p.req = false;
    save(); rerender();
    return;
  }
  if (ds.ra) {
    const c = get(ds.id), fct = RISK_FACTORS.find(x => x.k === ds.ra);
    c.ra[ds.ra] = Number(el.value);
    log(c, `Risk assessment: ${fct.n.toLowerCase()} set to "${fct.o[c.ra[ds.ra]][0]}". Score now ${raScore(c)}.`);
    save(); rerender();
  }
});
window.addEventListener('hashchange', route);

shell();
save();
route();
})();
</script>
</body>
</html>
