<style>
/* Layout: a floating frosted sidebar over a soft colour-field wallpaper. Every panel is translucent glass with a specular top edge; records sit in hairline tables. */
:root {
  --bg: #e8edf4;
  --orb-1: rgba(48, 148, 255, .42);
  --orb-2: rgba(80, 210, 196, .36);
  --orb-3: rgba(170, 132, 255, .30);
  --orb-4: rgba(255, 190, 130, .34);
  --glass: rgba(255, 255, 255, .56);
  --glass-strong: rgba(255, 255, 255, .80);
  --glass-soft: rgba(255, 255, 255, .34);
  --glass-edge: rgba(255, 255, 255, .72);
  --glass-hi: rgba(255, 255, 255, .95);
  --sheen: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 38%);
  --scrim: rgba(18, 26, 40, .22);
  --ink: #0b1220;
  --muted: #5b6475;
  --line: rgba(15, 23, 42, .085);
  --fill: rgba(118, 118, 128, .12);
  --fill-strong: rgba(118, 118, 128, .2);
  --accent: #007aff;
  --accent-2: #4ea6ff;
  --accent-soft: rgba(0, 122, 255, .12);
  --on-accent: #ffffff;
  --manila: #9a5300;
  --manila-bg: rgba(255, 228, 186, .72);
  --manila-line: rgba(232, 160, 60, .45);
  --crit: #d70015; --crit-bg: rgba(255, 59, 48, .12);
  --warn: #a84b00; --warn-bg: rgba(255, 149, 0, .15);
  --ok: #1d7a34; --ok-bg: rgba(52, 199, 89, .15);
  --info: #0058d0; --info-bg: rgba(0, 122, 255, .11);
  --bar-high: #ff3b30; --bar-medium: #ff9500; --bar-low: #34c759;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 12px 32px -10px rgba(15, 23, 42, .16);
  --shadow-lg: 0 40px 90px -24px rgba(15, 23, 42, .38), 0 2px 8px rgba(15, 23, 42, .08);
  --blur: blur(30px) saturate(185%);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI Variable Display", "Segoe UI", Roboto, Arial, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI Variable Text", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
  --r: 22px;
  --r-sm: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06090f;
    --orb-1: rgba(10, 132, 255, .34); --orb-2: rgba(40, 200, 180, .20); --orb-3: rgba(130, 90, 255, .28); --orb-4: rgba(255, 130, 70, .15);
    --glass: rgba(30, 34, 46, .52); --glass-strong: rgba(44, 48, 62, .82); --glass-soft: rgba(255, 255, 255, .035);
    --glass-edge: rgba(255, 255, 255, .10); --glass-hi: rgba(255, 255, 255, .16);
    --sheen: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, 0) 40%);
    --scrim: rgba(0, 0, 0, .45);
    --ink: #f2f4f8; --muted: #9ba4b4; --line: rgba(255, 255, 255, .08); --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
    --accent: #0a84ff; --accent-2: #5eb0ff; --accent-soft: rgba(10, 132, 255, .22); --on-accent: #ffffff;
    --manila: #ffc368; --manila-bg: rgba(110, 76, 24, .55); --manila-line: rgba(255, 179, 64, .30);
    --crit: #ff6b62; --crit-bg: rgba(255, 69, 58, .18); --warn: #ffb547; --warn-bg: rgba(255, 159, 10, .18);
    --ok: #4fdc72; --ok-bg: rgba(48, 209, 88, .16); --info: #6aabff; --info-bg: rgba(10, 132, 255, .2);
    --bar-high: #ff453a; --bar-medium: #ff9f0a; --bar-low: #30d158;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px -12px rgba(0, 0, 0, .6);
    --shadow-lg: 0 40px 90px -20px rgba(0, 0, 0, .75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #06090f;
  --orb-1: rgba(10, 132, 255, .34); --orb-2: rgba(40, 200, 180, .20); --orb-3: rgba(130, 90, 255, .28); --orb-4: rgba(255, 130, 70, .15);
  --glass: rgba(30, 34, 46, .52); --glass-strong: rgba(44, 48, 62, .82); --glass-soft: rgba(255, 255, 255, .035);
  --glass-edge: rgba(255, 255, 255, .10); --glass-hi: rgba(255, 255, 255, .16);
  --sheen: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, 0) 40%);
  --scrim: rgba(0, 0, 0, .45);
  --ink: #f2f4f8; --muted: #9ba4b4; --line: rgba(255, 255, 255, .08); --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
  --accent: #0a84ff; --accent-2: #5eb0ff; --accent-soft: rgba(10, 132, 255, .22); --on-accent: #ffffff;
  --manila: #ffc368; --manila-bg: rgba(110, 76, 24, .55); --manila-line: rgba(255, 179, 64, .30);
  --crit: #ff6b62; --crit-bg: rgba(255, 69, 58, .18); --warn: #ffb547; --warn-bg: rgba(255, 159, 10, .18);
  --ok: #4fdc72; --ok-bg: rgba(48, 209, 88, .16); --info: #6aabff; --info-bg: rgba(10, 132, 255, .2);
  --bar-high: #ff453a; --bar-medium: #ff9f0a; --bar-low: #30d158;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px -12px rgba(0, 0, 0, .6);
  --shadow-lg: 0 40px 90px -20px rgba(0, 0, 0, .75);
  color-scheme: dark;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: rgba(250, 251, 253, .94); --glass-strong: rgba(255, 255, 255, .97); }
  :root[data-theme="dark"] { --glass: rgba(28, 32, 42, .95); --glass-strong: rgba(40, 44, 56, .97); }
}
@media (prefers-reduced-transparency: reduce) {
  :root { --glass: rgba(250, 251, 253, .97); --glass-strong: #ffffff; --blur: none; }
  :root[data-theme="dark"] { --glass: rgba(26, 30, 40, .98); --glass-strong: #2c303e; }
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; letter-spacing: -.003em; }
[hidden] { display: none !important; }
.wallpaper { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background:
  radial-gradient(42vmax 38vmax at 8% 6%, var(--orb-1), transparent 70%),
  radial-gradient(36vmax 34vmax at 92% 14%, var(--orb-3), transparent 70%),
  radial-gradient(40vmax 36vmax at 78% 96%, var(--orb-2), transparent 70%),
  radial-gradient(30vmax 28vmax at 22% 88%, var(--orb-4), transparent 70%),
  var(--bg); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: 2.05rem; font-weight: 700; line-height: 1.1; letter-spacing: -.028em; }
h2 { font-size: 1.06rem; font-weight: 650; letter-spacing: -.012em; }
h3 { font-size: .95rem; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 1.5px var(--accent) !important; }
.mono { font-family: var(--f-mono); font-size: .84em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.eyebrow { font: 600 .72rem/1.2 var(--f-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* ---------- glass material ---------- */
.side, .card, .tile, .due-box, .actionbar, .stepper, .col, .banner, .dlg, #toast {
  background: var(--sheen), var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow);
}

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.side { display: flex; flex-direction: column; gap: 22px; padding: 18px 12px; position: sticky; top: 12px; margin: 12px 0 12px 12px; height: calc(100vh - 24px); overflow-y: auto; border-radius: 26px; }
.brand { display: flex; gap: 11px; align-items: center; padding: 2px 8px; }
.mark { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(140deg, #64d2ff, #007aff 55%, #5e5ce6); color: #fff; display: grid; place-items: center; font: 700 .7rem var(--f-display); letter-spacing: .03em; flex: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 14px -4px rgba(0, 122, 255, .55); }
.app-name { font: 700 1rem/1.15 var(--f-display); letter-spacing: -.015em; }
.firm { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 500; transition: background .15s; }
.nav a:hover { background: var(--fill); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 6px 16px -6px rgba(0, 122, 255, .6); }
.nav .count { font: 600 .72rem var(--f-body); font-variant-numeric: tabular-nums; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 99px; background: var(--fill); color: var(--muted); }
.nav .count.hot { background: var(--bar-high); color: #fff; }
.nav a[aria-current="page"] .count { background: rgba(255, 255, 255, .25); color: #fff; }
.side-foot { margin-top: auto; padding: 12px 10px 2px; border-top: 1px solid var(--line); display: grid; gap: 2px; font-size: .8rem; color: var(--muted); }
.side-foot strong { color: var(--ink); font-weight: 600; }

.main { min-width: 0; padding-block: 30px 72px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; max-width: 1380px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
.page-head .lede { color: var(--muted); max-width: 64ch; margin-top: 6px; font-size: .95rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 11px 12px 11px 18px; border-radius: 18px; background: var(--sheen), var(--manila-bg); border-color: var(--manila-line); font-size: .88rem; }
.banner strong { color: var(--manila); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--glass-edge); background: var(--glass-strong); color: var(--ink); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: .86rem; cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2; box-shadow: inset 0 1px 0 var(--glass-hi), 0 1px 2px rgba(15, 23, 42, .06); transition: transform .12s, filter .15s, background .15s; }
.btn:hover { color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 6px 16px -6px rgba(0, 122, 255, .7); }
.btn.primary:hover { filter: brightness(1.06); color: var(--on-accent); }
.btn.danger { color: var(--crit); }
.btn.danger.solid { background: linear-gradient(180deg, #ff6259, #ff3b30); color: #fff; border-color: transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 6px 16px -6px rgba(255, 59, 48, .6); }
.btn.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--accent); padding-inline: 8px; }
.btn.quiet:hover { background: var(--accent-soft); }
.btn.sm { padding: 5px 12px; font-size: .78rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(.4); transform: none; }
.field { display: grid; gap: 5px; font-size: .78rem; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea, .inp { border: 1px solid var(--line); background: var(--glass-strong); border-radius: var(--r-sm); padding: 8px 11px; font-weight: 400; font-size: .9rem; color: var(--ink); min-width: 0; width: 100%; box-shadow: inset 0 1px 2px rgba(15, 23, 42, .04); transition: box-shadow .15s, border-color .15s; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 70px; }
.inp.sm { padding: 5px 9px; font-size: .82rem; width: auto; border-radius: 10px; }
.inp.search { border-radius: 999px; padding: 8px 16px; background: var(--fill); border-color: transparent; box-shadow: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.span2 { grid-column: span 2; }
.check { display: inline-flex; gap: 9px; align-items: flex-start; font-size: .88rem; cursor: pointer; }
.check input { margin-top: 3px; }
input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; }

/* ---------- chips & pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .74rem; font-weight: 600; white-space: nowrap; line-height: 1.55; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.crit { color: var(--crit); background: var(--crit-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.ok { color: var(--ok); background: var(--ok-bg); }
.info { color: var(--info); background: var(--info-bg); }
.neutral { color: var(--muted); background: var(--fill); }
.manila-chip { color: var(--manila); background: var(--manila-bg); }
.tag { display: inline-block; font-size: .7rem; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--fill); color: var(--muted); white-space: nowrap; }

/* ---------- cards & tables ---------- */
.card { border-radius: var(--r); min-width: 0; overflow: hidden; }
.card > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 18px 20px 12px; }
.card > header p { color: var(--muted); font-size: .82rem; margin-top: 1px; }
.card .body { padding: 0 20px 20px; }
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .86rem; }
.t th { text-align: left; font: 600 .74rem/1.2 var(--f-body); color: var(--muted); padding: 9px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--glass-soft); white-space: nowrap; }
.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t th:first-child, .t td:first-child { padding-left: 20px; }
.t th:last-child, .t td:last-child { padding-right: 20px; }
.t tbody tr:last-child td { border-bottom: 0; }
.t tr.click { cursor: pointer; }
.t tbody tr { transition: background .12s; }
.t tbody tr:hover td { background: var(--glass-soft); }
.t .name { font-weight: 600; color: var(--ink); text-decoration: none; }
.t .name:hover { color: var(--accent); }
.t .sub { display: block; color: var(--muted); font-size: .75rem; font-family: var(--f-mono); }
.t td.right, .t th.right { text-align: right; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }

.meter { display: inline-flex; align-items: center; gap: 8px; }
.meter .track { width: 64px; height: 6px; background: var(--fill-strong); border-radius: 99px; overflow: hidden; }
.meter .fill { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.meter .fill.ok { background: var(--bar-low); }
.meter .fill.warn { background: var(--bar-medium); }

/* ---------- overview ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.tile { --tone: var(--accent); border-radius: 20px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; position: relative; overflow: hidden; color: var(--ink); transition: transform .15s, box-shadow .15s; }
.tile::before { content: ""; position: absolute; width: 150px; height: 150px; right: -50px; top: -60px; border-radius: 50%; background: var(--tone); opacity: .22; filter: blur(34px); pointer-events: none; }
.tile:hover { transform: translateY(-2px); }
.tile .k { font: 700 2.15rem/1.05 var(--f-display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; order: 2; margin-top: 6px; }
.tile .l { font-size: .8rem; font-weight: 600; display: flex; align-items: center; gap: 7px; order: 1; }
.tile .l::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 22%, transparent); }
.tile .s { font-size: .75rem; color: var(--muted); order: 3; }
.tile.is-crit { --tone: var(--bar-high); } .tile.is-crit .k { color: var(--crit); }
.tile.is-warn { --tone: var(--bar-medium); } .tile.is-warn .k { color: var(--warn); }
.tile.is-info { --tone: var(--accent); }
.tile.is-ok { --tone: var(--bar-low); }
.tile.is-manila { --tone: #ffb340; }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { fill: var(--muted); font: 500 10.5px var(--f-body); }
.chart .ax-strong { fill: var(--crit); font: 700 10.5px var(--f-body); }
.chart .val { fill: var(--ink); font: 650 11px var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .sep { stroke: var(--muted); stroke-opacity: .5; stroke-width: 1; stroke-dasharray: 2 4; }
.r-high { fill: var(--bar-high); } .r-medium { fill: var(--bar-medium); } .r-low { fill: var(--bar-low); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.legend .high { background: var(--bar-high); } .legend .medium { background: var(--bar-medium); } .legend .low { background: var(--bar-low); }
.mix { display: grid; gap: 13px; }
.mix-row { display: grid; grid-template-columns: 66px minmax(0, 1fr) 58px; gap: 10px; align-items: center; font-size: .85rem; }
.mix-row > :last-child { text-align: right; }
.mix-row .bar { height: 8px; border-radius: 99px; background: var(--fill-strong); overflow: hidden; }
.mix-row .bar span { display: block; height: 100%; border-radius: 99px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.facts div { display: grid; gap: 2px; padding: 10px 12px; border-radius: 14px; background: var(--glass-soft); }
.facts b { font: 700 1.3rem var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

.sev { display: inline-block; min-width: 64px; text-align: center; font-size: .72rem; font-weight: 650; padding: 3px 10px; border-radius: 99px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px 20px; }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 12px; background: var(--fill); }
.seg button { border: 0; background: transparent; padding: 5px 12px; font-size: .8rem; font-weight: 600; color: var(--ink); cursor: pointer; border-radius: 9px; transition: background .15s, box-shadow .15s; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); box-shadow: 0 1px 3px rgba(15, 23, 42, .12), 0 0 0 .5px rgba(15, 23, 42, .04); }

/* ---------- pipeline ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding: 2px 2px 8px; }
.col { border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.col > header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 6px 4px; }
.col > header .n { font: 600 .74rem var(--f-body); color: var(--muted); background: var(--fill); padding: 1px 8px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.col > p { font-size: .76rem; color: var(--muted); padding: 0 6px 4px; margin-top: -4px; }
.kcard { background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 15px; padding: 11px 12px; display: grid; gap: 6px; cursor: pointer; box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 8px -2px rgba(15, 23, 42, .1); transition: transform .15s; }
.kcard:hover { transform: translateY(-1px); }
.kcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }

<script>
(() => {
'use strict';

/* =========================================================
   Basics
   ========================================================= */
const KEY = 'kyc-refresh-desk.v1';
const DAY = 86400000;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const clone = o => JSON.parse(JSON.stringify(o));

/* =========================================================
   Reference data
   ========================================================= */
const TYPES = { individual: 'Individual', company: 'Company', trust: 'Trust', partnership: 'Partnership' };
const TYPE_CODE = { individual: 'IND', company: 'CORP', trust: 'TRU', partnership: 'PTN' };
const RISKS = ['high', 'medium', 'low'];
const RISK_CLS = { high: 'crit', medium: 'warn', low: 'ok' };

// when: all = always required, high = high-risk clients only, optional = keep if held
// refresh: re-obtained at every periodic review; expires: track an expiry date
const DOC_LIB = {
  individual: [
    { k: 'id', n: 'Certified passport or government photo ID', short: 'Passport / photo ID', when: 'all', expires: true },
    { k: 'poa', n: 'Proof of residential address (dated within 3 months)', short: 'Proof of address', when: 'all', refresh: true },
    { k: 'form', n: 'Signed client information form', short: 'Client information form', when: 'all', refresh: true },
    { k: 'sof', n: 'Source of funds and source of wealth declaration', short: 'SoF / SoW declaration', when: 'all', refresh: true },
    { k: 'sowev', n: 'Evidence of source of wealth (bank statements, sale deeds, payslips)', short: 'SoW evidence', when: 'high', refresh: true },
    { k: 'ref', n: 'Bank or professional reference', short: 'Reference letter', when: 'high', refresh: true },
    { k: 'tax', n: 'CRS / FATCA self-certification', short: 'CRS / FATCA self-cert', when: 'all' },
  ],
  company: [
    { k: 'coi', n: 'Certificate of incorporation', short: 'Certificate of incorporation', when: 'all' },
    { k: 'cgs', n: 'Certificate of good standing (issued within 6 months)', short: 'Good standing certificate', when: 'all', refresh: true },
    { k: 'mem', n: 'Memorandum and articles of association', short: 'M&A', when: 'all' },
    { k: 'rod', n: 'Register of directors', short: 'Register of directors', when: 'all', refresh: true },
    { k: 'rom', n: 'Register of members / shareholders', short: 'Register of members', when: 'all', refresh: true },
    { k: 'bo', n: 'Beneficial ownership declaration', short: 'BO declaration', when: 'all', refresh: true },
    { k: 'chart', n: 'Ownership and control structure chart', short: 'Structure chart', when: 'all', refresh: true },

    { k: 'fin', n: 'Description of business activity and latest financial statements', short: 'Financial statements', when: 'high', refresh: true },
    { k: 'sof', n: 'Source of funds declaration', short: 'SoF declaration', when: 'all', refresh: true },
    { k: 'tax', n: 'CRS / FATCA entity self-certification', short: 'CRS / FATCA self-cert', when: 'all' },
  ],
  trust: [

    { k: 'trustee', n: 'Trustee details (incorporation documents if a corporate trustee)', short: 'Trustee details', when: 'all', refresh: true },
    { k: 'sched', n: 'Schedule of settlor, protector and beneficiaries', short: 'Parties schedule', when: 'all', refresh: true },
    { k: 'sow', n: 'Settlor source of wealth declaration and evidence', short: 'Settlor SoW', when: 'all', refresh: true },

    { k: 'low', n: 'Letter of wishes', short: 'Letter of wishes', when: 'optional' },
    { k: 'tax', n: 'CRS / FATCA trust self-certification', short: 'CRS / FATCA self-cert', when: 'all' },
  ],
  partnership: [
    { k: 'pa', n: 'Partnership agreement', short: 'Partnership agreement', when: 'all' },
    { k: 'reg', n: 'Certificate of registration', short: 'Certificate of registration', when: 'all' },
    { k: 'rop', n: 'Register of partners', short: 'Register of partners', when: 'all', refresh: true },
    { k: 'bo', n: 'Beneficial ownership declaration', short: 'BO declaration', when: 'all', refresh: true },
    { k: 'res', n: 'Authorised signatory list', short: 'Signatory list', when: 'all', refresh: true },
    { k: 'sof', n: 'Source of funds declaration', short: 'SoF declaration', when: 'all', refresh: true },
    { k: 'tax', n: 'CRS / FATCA entity self-certification', short: 'CRS / FATCA self-cert', when: 'all' },
  ],
};

const ROLES = {
  individual: ['Joint client', 'Power of attorney', 'Authorised representative'],
  company: ['Director', 'Beneficial owner', 'Shareholder', 'Authorised signatory', 'Company secretary'],
  trust: ['Settlor', 'Trustee', 'Protector', 'Beneficiary', 'Enforcer'],
  partnership: ['General partner', 'Limited partner', 'Beneficial owner', 'Authorised signatory'],
};

const RISK_FACTORS = [
  { k: 'jur', n: 'Country of residence or incorporation', o: [['Low risk', 0], ['Medium risk', 1], ['High risk', 3]] },
  { k: 'pep', n: 'Politically exposed person', o: [['No', 0], ['Yes (PEP, family member or close associate)', 3]] },
  { k: 'svc', n: 'Service provided', o: [['Litigation or general advice', 0], ['Corporate services', 2], ['Real estate conveyancing', 2], ['Trust administration', 2]] },
  { k: 'chan', n: 'How the relationship is conducted', o: [['Face to face', 0], ['Not face to face', 1], ['Through an introducer', 2]] },
  { k: 'sow', n: 'Source of wealth', o: [['Clear and documented', 0], ['Some complexity', 1], ['Complex or hard to verify', 2]] },
  { k: 'struct', n: 'Ownership structure', o: [['Natural person', 0], ['Single-layer entity', 1], ['Multi-layer or nominee', 2]] },
  { k: 'media', n: 'Adverse media', o: [['None found', 0], ['Found and assessed', 3]] },
];

const STAGES = [
  { k: 'awaiting', n: 'Awaiting client', d: 'Request sent. Waiting for documents.' },
  { k: 'verify', n: 'Verify documents', d: 'Check certification, dates and completeness.' },
  { k: 'screening', n: 'Screening & risk', d: 'Sanctions, PEP and adverse media. Re-rate risk.' },
  { k: 'signoff', n: 'MLRO sign-off', d: 'Reviewer approves and the next date is set.' },
];
const stageName = k => (STAGES.find(s => s.k === k) || {}).n || '';

const DOC_STATUS = {
  missing: { n: 'Outstanding', cls: 'warn' },
  requested: { n: 'Requested', cls: 'info' },
  received: { n: 'To verify', cls: 'warn' },
  verified: { n: 'Verified', cls: 'ok' },
  expired: { n: 'Expired', cls: 'crit' },
};

const SCREEN_RESULTS = ['Clear, no matches', 'Potential match, discounted', 'PEP confirmed, enhanced due diligence', 'True match, escalated to MLRO'];
const METHODS = ['Letter by post', 'Email', 'Phone call', 'In person at office'];

const DEFAULT_SETTINGS = {
  firm: '', user: 'Compliance Officer', title: 'Compliance Officer', mlro: '',
  cycles: { high: 12, medium: 24, low: 36 },
  screen: { high: 6, medium: 12, low: 12 },
  lead: 90, deadline: 30, chase: [14, 30, 60], expiryWarn: 60, fileOutDays: 14, pepTail: 12,
};

/* =========================================================
   State
   ========================================================= */
let storageOK = true;
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { storageOK = false; return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
}
function emptyState(settings) {
  return { v: 1, sample: false, seq: 100, settings: settings || clone(DEFAULT_SETTINGS), clients: [] };
}

let S;

const get = id => S.clients.find(c => c.id === id);
const active = () => S.clients.filter(c => c.status !== 'exited');
const nextId = () => `CL-${String(++S.seq).padStart(4, '0')}`;
const me = () => S.settings.user || 'Compliance Officer';
function log(c, t, d) { c.history.unshift({ d: d || iso(TODAY), t, by: me() }); }

function defs(c) { return DOC_LIB[c.type].filter(t => t.when !== 'high' || c.risk === 'high'); }
function reqDefs(c) { return defs(c).filter(t => t.when !== 'optional'); }
function defOf(c, k) { return DOC_LIB[c.type].find(t => t.k === k); }
function doc(c, k) { return c.docs[k] || (c.docs[k] = { s: 'missing', rec: '', exp: '', paper: false, scan: false, att: null, note: '' }); }
function docState(d) { return d.exp && parse(d.exp) < TODAY ? 'expired' : d.s; }
const expDays = s => (s ? diffDays(TODAY, parse(s)) : null);
const docOK = d => docState(d) === 'verified';
const partyOK = p => p.idOk && p.poaOk && !(p.idExp && parse(p.idExp) < TODAY);
function nextReview(c) { return addMonths(parse(c.last), S.settings.cycles[c.risk]); }
const daysToReview = c => diffDays(TODAY, nextReview(c));
function docProgress(c) { const r = reqDefs(c); return { ok: r.filter(t => docOK(doc(c, t.k))).length, n: r.length }; }
function scanProgress(c) {
  let n = 0, s = 0;
  for (const t of defs(c)) { const d = c.docs[t.k]; if (d && (d.s === 'received' || d.s === 'verified')) { n++; if (d.scan) s++; } }

function screenStale(c) { return !c.screening || addMonths(parse(c.screening.date), S.settings.screen[c.risk]) < TODAY; }

function suggested(c) { if (isPep(c)) return 'high'; const s = raScore(c); return s >= 8 ? 'high' : s >= 4 ? 'medium' : 'low'; }

const SEV = [['Urgent', 'crit'], ['High', 'warn'], ['Due', 'info'], ['Watch', 'neutral']];
function tasks() {
  const s = S.settings, out = [];
  for (const c of active()) {
    const days = daysToReview(c), r = c.refresh;
    const add = (sev, kind, text, act, label, type) => out.push({ c, sev, kind, text, act, label, type });
    if (!r) {
      if (days < 0) add(c.risk === 'high' ? 0 : 1, 'overdue', `Periodic review overdue by ${plural(-days, 'day')}`, 'start', 'Start refresh');
      else if (days <= 30) add(2, 'due', `Review due in ${plural(days, 'day')}, not started`, 'start', 'Start refresh');
    } else if (r.stage === 'awaiting') {
      const waited = diffDays(parse(r.requested), TODAY);
      const [c1, c2, c3] = s.chase;
      if (r.escalated) add(1, 'escalated', `Escalated to MLRO ${fmt(r.escalated)}. Client still has not responded`, 'open', 'Open file');
      else if (waited >= c3) add(0, 'escalate', `No response after ${waited} days. Escalate to MLRO`, 'escalate', 'Escalate');
      else if (waited >= c2 && r.chases < 2) add(1, 'chase', `Requested ${waited} days ago. Send final reminder`, 'chase', 'Log reminder');
      else if (waited >= c1 && r.chases < 1) add(2, 'chase', `Requested ${waited} days ago. Send first reminder`, 'chase', 'Log reminder');
    } else if (r.stage === 'verify') add(2, 'verify', 'Documents received. Verify and certify', 'open', 'Verify');
    else if (r.stage === 'screening') add(2, 'screening', 'Run sanctions, PEP and adverse media screening', 'screen', 'Record screening');
    else if (r.stage === 'signoff') add(2, 'signoff', 'Ready for MLRO sign-off', 'signoff', 'Sign off');

    for (const t of defs(c)) {
      const d = c.docs[t.k];
      if (!d || !d.exp || d.s === 'requested') continue;
      const e = expDays(d.exp);
      if (e < 0) add(1, 'expired', `${t.short} expired ${fmt(d.exp)}`, 'open', 'Open file');
      else if (e <= s.expiryWarn) add(3, 'expiring', `${t.short} expires ${fmt(d.exp)} (${plural(e, 'day')})`, 'open', 'Open file');
    }
    for (const p of c.parties) {
      if (!p.idExp || p.req) continue;
      const e = expDays(p.idExp);
      if (e < 0) add(1, 'expired', `ID for ${p.name} (${p.role}) expired ${fmt(p.idExp)}`, 'open', 'Open file');
      else if (e <= s.expiryWarn) add(3, 'expiring', `ID for ${p.name} (${p.role}) expires ${fmt(p.idExp)}`, 'open', 'Open file');
    }
    if (c.pep && c.pep.status === 'current' && !c.pep.approvedBy) add(1, 'pep', 'PEP: record the public function and senior management approval', 'decide', 'Record approval', 'pepupd');
    const tail = pepTailEnd(c);
    if (c.pep && c.pep.status === 'former' && tail && !isPep(c) && c.risk === 'high' && c.last < iso(tail) && !c.decisions.some(x => x.d >= iso(tail) && ['lower', 'review'].includes(x.type))) add(2, 'peptail', `Former PEP: enhanced measures ended ${fmtD(tail)}. Decide whether to lower the rating`, 'decide', 'Review rating', 'lower');
    if (c.status === 'restricted' && !r) add(1, 'restricted', 'Services restricted with no review in progress. Start a review or decide on the restriction', 'decide', 'Decide', 'lift');
    if (!r && screenStale(c)) add(2, 'rescreen', `Screening last run ${c.screening ? fmt(c.screening.date) : 'never'}. Re-screen`, 'screen', 'Record screening');
    if (c.file.out) {
      const o = diffDays(parse(c.file.out.since), TODAY);
      if (o >= s.fileOutDays) add(3, 'file', `Paper file out with ${c.file.out.to} for ${o} days`, 'checkin', 'Mark returned');
    }
  }
  return out.sort((a, b) => a.sev - b.sev || a.c.name.localeCompare(b.c.name));
}

function dueChart(A) {
  const b = Array.from({ length: 13 }, (_, i) => ({ high: 0, medium: 0, low: 0, i }));
  for (const c of A) {
    const nr = nextReview(c);
    if (nr < TODAY) { b[0][c.risk]++; continue; }
    const off = (nr.getFullYear() - TODAY.getFullYear()) * 12 + nr.getMonth() - TODAY.getMonth();
    if (off < 12) b[off + 1][c.risk]++;
  }
  const tot = b.map(x => x.high + x.medium + x.low);
  const max = Math.max(1, ...tot);
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const W = 660, H = 230, L = 30, R = 8, T = 18, B = 40;
  const cw = (W - L - R) / 13, bw = cw * .58, y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  let bars = '';
  b.forEach((x, i) => {
    const cx = L + cw * i + cw / 2;
    let acc = 0;
    for (const r of RISKS) {
      if (!x[r]) continue;
      const y0 = y(acc), y1 = y(acc + x[r]);
      bars += `<rect class="r-${r}" x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" rx="3"><title>${x[r]} ${r} risk</title></rect>`;
      acc += x[r];
    }
    if (tot[i]) bars += `<text class="val" x="${cx}" y="${y(tot[i]) - 5}" text-anchor="middle">${tot[i]}</text>`;
    let label, cls = 'ax';
    if (i === 0) { label = 'Overdue'; cls = 'ax-strong'; }
    else { const m = (TODAY.getMonth() + i - 1) % 12; label = MONTHS[m]; if (m === 0) bars += `<text class="ax" x="${cx}" y="${H - B + 30}" text-anchor="middle">${TODAY.getFullYear() + Math.floor((TODAY.getMonth() + i - 1) / 12)}</text>`; }
    bars += `<text class="${cls}" x="${cx}" y="${H - B + 16}" text-anchor="middle">${label}</text>`;
  });
  const sepX = L + cw;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Number of reviews overdue and due in each of the next 12 months">${g}<line class="sep" x1="${sepX}" x2="${sepX}" y1="${T - 6}" y2="${H - B}"/>${bars}</svg>`;
}

function filteredClients() {
  const q = F.q.trim().toLowerCase(), s = S.settings;
  const T = F.bucket === 'expiry' || F.bucket === 'chase' ? tasks() : [];
  return S.clients.filter(c => {
    if (F.bucket !== 'exited' && c.status === 'exited') return false;
    if (q && ![c.name, c.id, c.file.ref, c.country, c.contact].join(' ').toLowerCase().includes(q)) return false;
    if (F.risk && c.risk !== F.risk) return false;
    if (F.type && c.type !== F.type) return false;
    const d = daysToReview(c);
    switch (F.bucket) {
      case 'overdue': return d < 0;
      case 'due': return d >= 0 && d <= s.lead;
      case 'inprog': return !!c.refresh;
      case 'current': return d > s.lead && !c.refresh;
      case 'restricted': return c.status === 'restricted';
      case 'exited': return c.status === 'exited';
      case 'pep': return !!c.pep;
      case 'expiry': return T.some(t => t.c === c && (t.kind === 'expired' || t.kind === 'expiring'));
      case 'chase': return T.some(t => t.c === c && (t.kind === 'chase' || t.kind === 'escalate'));
      default: return true;
    }
  }).sort((a, b) => daysToReview(a) - daysToReview(b));
}

function viewClient(c) {
  const s = S.settings, r = c.refresh, d = daysToReview(c), nr = nextReview(c);
  const dueCls = d < 0 ? 'crit' : d <= 30 ? 'warn' : d <= s.lead ? 'info' : 'ok';
  const dueTxt = d < 0 ? `Overdue by ${plural(-d, 'day')}` : d === 0 ? 'Due today' : `In ${plural(d, 'day')}`;
  const si = r ? STAGES.findIndex(x => x.k === r.stage) : -1;
  const steps = [{ n: 'Due', d: 'Review date reached' }, ...STAGES];
  const stepper = `<div class="stepper" aria-label="Refresh progress">${steps.map((x, i) => {
    const cls = !r ? (i === 0 && d <= s.lead ? 'now' : '') : i - 1 < si ? 'done' : i - 1 === si ? 'now' : '';
    return `<div class="step ${cls}"><span class="idx">${cls === 'done' ? 'Done' : 'Step ' + (i + 1)}</span><b>${x.n}</b></div>`;
  }).join('')}</div>`;

  // stage action bar
  let bar = '';
  const g = gate(c);
  if (!r) {
    bar = `<span class="why">${d <= s.lead ? 'This review is due. Start the refresh to choose what to request and draft the letter.' : `No refresh due until ${fmtD(nr)}. You can start one early after a trigger event (new owner, adverse media, unusual activity).`}</span><button class="btn ${d <= s.lead ? 'primary' : ''}" data-act="start" data-id="${c.id}">Start refresh</button>`;
  } else if (r.stage === 'awaiting') {
    const out = outstanding(c);

  } else if (r.stage === 'verify') {

      <section class="card">
        <header><div><h2>Documents</h2><p>${dp.ok} of ${dp.n} required documents verified · ${sp.s} of ${sp.n} on file scanned</p></div><div class="row"><button class="btn sm" data-act="checklist" data-id="${c.id}">File checklist</button></div></header>
        <div class="scroll">${docsTable(c)}</div>

      </section>
      ${decisionsCard(c)}
      <section class="card">
        <header><div><h2>Outreach</h2><p>Requests and reminders sent to this client</p></div><button class="btn sm" data-act="letter" data-id="${c.id}" data-kind="${r && r.chases ? 'final' : r ? 'reminder' : 'request'}">Draft letter</button></header>
        <div class="body">${c.outreach.length ? `<ul class="timeline">${c.outreach.map(x => `<li><time>${x.d}</time><span><b>${esc(x.kind)}</b> · ${esc(x.m)}<br><span class="muted">${esc(x.note)}${x.by ? ' · ' + esc(x.by) : ''}</span></span></li>`).join('')}</ul>` : '<p class="muted small">No contact recorded.</p>'}</div>
      </section>
      <section class="card">
        <header><div><h2>Audit trail</h2><p>Every change made to this file</p></div></header>
        <div class="body"><ul class="timeline">${c.history.slice(0, 40).map(h => `<li><time>${h.d}</time><span>${esc(h.t)} <span class="muted">· ${esc(h.by)}</span></span></li>`).join('')}</ul></div>

        <div class="row">${o ? `<button class="btn sm" data-act="checkin" data-id="${c.id}">Mark returned</button>` : `<button class="btn sm" data-act="checkout" data-id="${c.id}">Check out</button>`}<button class="btn sm" data-act="checklist" data-id="${c.id}">Print cover sheet</button></div>

function docsTable(c) {
  const rows = defs(c);
  return `<table class="t docs"><thead><tr><th>Document</th><th>Status</th><th>Received</th><th>Expires</th><th>On paper</th><th>Scan</th></tr></thead><tbody>
  ${rows.map(t => {
    const d = doc(c, t.k), st = docState(d), e = expDays(d.exp);
    const tags = [t.refresh ? 'Each review' : 'Once', t.when === 'high' ? 'High risk' : '', t.when === 'optional' ? 'Optional' : ''].filter(Boolean);
    const sel = `<select class="st ${DOC_STATUS[d.s].cls}" id="doc-${t.k}-s" data-doc="${t.k}" data-f="s" data-id="${c.id}" aria-label="Status">${['missing', 'requested', 'received', 'verified'].map(k => `<option value="${k}" ${d.s === k ? 'selected' : ''}>${DOC_STATUS[k].n}</option>`).join('')}</select>`;
    return `<tr><td><span class="doc-name">${esc(t.n)}</span><span class="doc-tags">${tags.map(x => `<span class="tag">${x}</span>`).join('')}${st === 'expired' ? '<span class="pill crit plain">Expired</span>' : e != null && e <= S.settings.expiryWarn ? `<span class="pill warn plain">Expires in ${e}d</span>` : ''}</span></td>
      <td>${sel}</td>
      <td><input class="inp sm" type="date" id="doc-${t.k}-rec" data-doc="${t.k}" data-f="rec" data-id="${c.id}" value="${d.rec || ''}" aria-label="Date received"></td>
      <td><input class="inp sm" type="date" id="doc-${t.k}-exp" data-doc="${t.k}" data-f="exp" data-id="${c.id}" value="${d.exp || ''}" aria-label="Expiry date"></td>
      <td><input type="checkbox" id="doc-${t.k}-paper" data-doc="${t.k}" data-f="paper" data-id="${c.id}" ${d.paper ? 'checked' : ''} aria-label="Original or certified copy on the paper file"></td>
      <td><span class="scanbox"><input type="checkbox" id="doc-${t.k}-scan" data-doc="${t.k}" data-f="scan" data-id="${c.id}" ${d.scan ? 'checked' : ''} aria-label="Scanned">${d.att ? `<button class="btn sm quiet" data-act="viewatt" data-id="${c.id}" data-k="${t.k}">View</button>` : `<button class="btn sm quiet" data-act="attach" data-id="${c.id}" data-k="${t.k}">Attach</button>`}</span></td></tr>`;
  }).join('')}</tbody></table>`;
}
function partyHint(c) {
  return { individual: 'Joint clients and anyone acting for the client', company: 'Directors, beneficial owners, shareholders and signatories', trust: 'Settlor, trustees, protector and beneficiaries', partnership: 'Partners, beneficial owners and signatories' }[c.type] + '. Each needs certified ID and proof of address.';
}
function partiesTable(c) {
  const rows = c.parties.map(p => {
    const e = expDays(p.idExp);
    const flag = e == null ? '' : e < 0 ? '<span class="pill crit plain">ID expired</span>' : e <= S.settings.expiryWarn ? `<span class="pill warn plain">ID expires in ${e}d</span>` : '';
    return `<tr><td><b>${esc(p.name)}</b> ${p.req ? '<span class="pill info plain">Requested</span>' : ''} ${flag}</td><td>${esc(p.role)}</td><td class="num mono">${p.pct !== '' && p.pct != null ? esc(p.pct) + '%' : '—'}</td>
      <td><input class="inp sm" type="date" id="party-${p.id}-idExp" data-party="${p.id}" data-f="idExp" data-id="${c.id}" value="${p.idExp || ''}" aria-label="ID expiry"></td>
      <td><input type="checkbox" id="party-${p.id}-idOk" data-party="${p.id}" data-f="idOk" data-id="${c.id}" ${p.idOk ? 'checked' : ''} aria-label="Certified ID verified"></td>
      <td><input type="checkbox" id="party-${p.id}-poaOk" data-party="${p.id}" data-f="poaOk" data-id="${c.id}" ${p.poaOk ? 'checked' : ''} aria-label="Proof of address verified"></td>
      <td class="right"><button class="btn sm quiet" data-act="delparty" data-id="${c.id}" data-p="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button></td></tr>`;
  }).join('');
  return `<table class="t"><thead><tr><th>Name</th><th>Role</th><th>Owns</th><th>ID expires</th><th>ID verified</th><th>Address verified</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="muted small">No connected parties recorded.</td></tr>'}
  <tr><td><input class="inp sm" id="np-name" placeholder="Full name" style="width:100%"></td><td><select class="inp sm" id="np-role">${ROLES[c.type].map(r => `<option>${r}</option>`).join('')}</select></td><td><input class="inp sm" id="np-pct" type="number" min="0" max="100" placeholder="%" style="width:64px"></td><td><input class="inp sm" id="np-exp" type="date" aria-label="ID expiry"></td><td colspan="3" class="right"><button class="btn sm" data-act="addparty" data-id="${c.id}">Add party</button></td></tr></tbody></table>`;
}

function outstanding(c) {
  const items = reqDefs(c).filter(t => ['missing', 'requested', 'expired'].includes(docState(doc(c, t.k)))).map(t => t.n);
  c.parties.forEach(p => { if (p.req || (p.idExp && !partyOK(p))) items.push(`Certified ID and proof of address for ${p.name} (${p.role})`); });
  return items;
}
function gate(c) {
  const r = c.refresh; if (!r) return null;
  if (r.stage === 'verify') {
    const miss = reqDefs(c).filter(t => !docOK(doc(c, t.k))).map(t => t.short);
    c.parties.filter(p => !partyOK(p)).forEach(p => miss.push(`${p.name} ID/address`));
    return miss.length ? miss : null;
  }
  if (r.stage === 'screening') return c.screening && c.screening.date >= r.started ? null : ['Screening not recorded for this review'];
  return null;
}

/* =========================================================
   Modal + toast
   ========================================================= */
function modal(title, body, buttons, opts = {}) {
  const root = $('#modal');
  root.innerHTML = `<div class="scrim" data-close></div><div class="dlg ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><header><h2 id="dlg-t">${esc(title)}</h2><button class="x" data-close aria-label="Close">×</button></header><div class="dlg-b">${body}<p class="err" id="dlg-err" hidden></p></div><footer></footer></div>`;
  const foot = $('footer', root), dlg = $('.dlg', root);
  [{ label: opts.cancel || 'Cancel', cls: '', fn: () => true }, ...buttons].forEach(b => {
    if (b.hidden) return;
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.textContent = b.label;
    el.addEventListener('click', async () => { const res = await b.fn(dlg); if (res !== false) closeModal(); });
    foot.append(el);
  });
  root.hidden = false;
  const first = $('input:not([type=checkbox]), select, textarea', dlg);
  (first || $('footer .btn:last-child', root)).focus();
  return dlg;
}
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
function fail(dlg, msg) { const e = $('#dlg-err', dlg); e.textContent = msg; e.hidden = false; return false; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }
const methodSel = (id, v) => `<select id="${id}">${METHODS.map(m => `<option ${m === v ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
function later(fn) { setTimeout(fn, 0); }
function commit(msg) { save(); render(); if (msg) toast(msg); }

/* ---------- start refresh ---------- */
function modalStart(c) {
  const s = S.settings, horizon = s.cycles[c.risk] * 30;
  const items = defs(c).map(t => {
    const d = doc(c, t.k), st = docState(d), e = expDays(d.exp);
    let why = '', pre = false;
    if (st === 'expired') { why = 'Expired'; pre = true; }
    else if (st === 'missing' && t.when !== 'optional') { why = 'Not on file'; pre = true; }
    else if (e != null && e <= horizon) { why = `Expires ${fmt(d.exp)}, before the next cycle ends`; pre = true; }
    else if (t.refresh) { why = 'Updated at every review'; pre = true; }
    else why = t.when === 'optional' ? 'Optional' : `On file since ${fmt(d.rec)}`;
    return { v: 'd:' + t.k, n: t.n, why, pre };
  });
  c.parties.forEach(p => {
    const e = expDays(p.idExp);
    const pre = !p.idOk || !p.poaOk || (e != null && e <= horizon);
    items.push({ v: 'p:' + p.id, n: `Certified ID and proof of address: ${p.name} (${p.role})`, why: e == null ? (pre ? 'Not verified' : 'No expiry recorded') : e < 0 ? 'ID expired' : `ID expires ${fmt(p.idExp)}`, pre });
  });
  const body = `
    <p>Choose what to ask ${esc(c.name)} for. Items that change at every review, or that are missing or expiring, are already ticked.</p>
    <div class="reqlist">${items.map((x, i) => `<label class="check" for="rq${i}"><input type="checkbox" id="rq${i}" name="req" value="${x.v}" ${x.pre ? 'checked' : ''}><span>${esc(x.n)}<span class="why">${esc(x.why)}</span></span></label>`).join('')}</div>
    <div class="grid2"><label class="field" for="st-m">How the request is sent${methodSel('st-m', c.email ? 'Email' : 'Letter by post')}</label><label class="field" for="st-d">Date sent<input type="date" id="st-d" value="${iso(TODAY)}"></label></div>`;
  modal(`Start refresh: ${c.name}`, body, [{ label: 'Start refresh and draft letter', cls: 'primary', fn: dlg => {
    const keys = $$('input[name=req]:checked', dlg).map(i => i.value);
    if (!keys.length) return fail(dlg, 'Tick at least one item to request.');

/* ---------- stage moves ---------- */
function advance(c) {
  const r = c.refresh; if (!r) return;

    if (!out.length) return go2();
    modal('Documents received?', `<p>${plural(out.length, 'item')} still marked as outstanding:</p><div class="callout warn"><ul>${out.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><p class="note">Moving on is fine if the documents are in hand but not yet logged. Update each document's status during verification.</p>`,

/* ---------- risk status decisions ---------- */

}
const opts = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
function decisionFields(c, type, toRisk) {

  }
  if (type === 'pepoff') {

      <p class="callout info">Enhanced measures continue for ${s.pepTail} months after this date (set in Settings), and the rating stays High until then. When the period ends, the worklist asks you to decide whether to lower it.</p>`;
  }
  if (type === 'raise' || type === 'lower') {

      ${block ? `<p class="callout crit">A PEP must stay High. Remove PEP status first${c.pep.status === 'former' ? `, or wait until enhanced measures end on ${fmtD(pepTailEnd(c))}` : ''}.</p>` : `<p class="note" id="dc-prev"></p>`}`;
  }
  return {
    restrict: '<p class="callout warn">The client is flagged as restricted. Stop providing services until the restriction is lifted. The worklist keeps it in view until a decision is made.</p>',
    lift: `<p class="callout info">Services resume.${c.refresh ? ' A review is still in progress.' : daysToReview(c) < 0 ? ' The periodic review is still overdue.' : ''}</p>`,
    exit: '<p class="callout warn">Any refresh in progress is cancelled and the client leaves the worklist. Keep the records for the retention period your policy and the law require. If the exit follows a suspicion of money laundering, consider a report to the Financial Intelligence Agency, and do not tip off the client.</p>',

}

    <div id="dc-x" style="display:grid;gap:14px"></div>

function recordDecision(c, dlg) {
  const s = S.settings, type = $('#dc-t', dlg).value, d = $('#dc-d', dlg).value || iso(TODAY);
  const by = $('#dc-by', dlg).value.trim(), reason = $('#dc-r', dlg).value.trim();
  const isPepType = type === 'pep' || type === 'pepupd';
  if (isPepType && !$('#dp-pos', dlg).value.trim()) return fail(dlg, 'Enter the public function or position.');
  if (isPepType && $('#dp-rel', dlg).value !== 'PEP' && !$('#dp-pn', dlg).value.trim()) return fail(dlg, 'Enter the name of the PEP the client is connected to.');
  if (type === 'pepoff' && !$('#dp-ceased', dlg).value) return fail(dlg, 'Enter the date the person left the public function.');
  if (type === 'lower' && isPep(c)) return fail(dlg, 'A PEP must stay rated High.');
  if (!reason) return fail(dlg, 'Give the reason for this decision. It goes on the decision note and the audit trail.');
  if (!by) return fail(dlg, isPepType ? 'Enter who in senior management approved the relationship.' : 'Enter who approved this decision.');
  const dec = { id: 'd' + Date.now().toString(36), d, type, reason, by, recordedBy: me(), from: '', to: '', effects: [] };
  const fx = dec.effects, oldRisk = c.risk;
  if (isPepType) {

    c.pep = newPep({ relation: $('#dp-rel', dlg).value, category: $('#dp-cat', dlg).value, pepName: $('#dp-pn', dlg).value.trim(), position: $('#dp-pos', dlg).value.trim(), country: $('#dp-cty', dlg).value.trim(), since: $('#dp-since', dlg).value, source: $('#dp-src', dlg).value, approvedBy: by, approvedOn: d });
    dec.pep = clone(c.pep);
    if (c.risk !== 'high') c.risk = 'high';
  } else if (type === 'pepoff') {
    c.pep = Object.assign(newPep(), c.pep, { status: 'former', ceased: $('#dp-ceased', dlg).value });
    dec.from = 'PEP'; dec.to = 'Former PEP'; dec.pep = clone(c.pep);
    fx.push(isPep(c) ? `Enhanced measures and High rating continue until ${fmtD(pepTailEnd(c))}` : 'The enhanced-measures period has already ended. Decide whether to lower the rating');
  } else if (type === 'raise' || type === 'lower') {
    const nr = $('#dc-risk', dlg).value;

  } else if (type === 'restrict') { dec.from = 'Active'; dec.to = 'Restricted'; c.status = 'restricted'; fx.push('Services suspended until the restriction is lifted'); }
  else if (type === 'lift') { dec.from = 'Restricted'; dec.to = 'Active'; c.status = 'active'; fx.push('Services resume'); }
  else if (type === 'exit') {
    dec.from = cap(c.status === 'restricted' ? 'restricted' : 'active'); dec.to = 'Exited'; c.status = 'exited';
    if (c.refresh) { c.refresh = null; c.parties.forEach(p => { p.req = false; }); fx.push('Refresh in progress cancelled'); }
    fx.push('Client removed from the active register and worklist');
  } else if (type === 'reinstate') { dec.from = 'Exited'; dec.to = 'Active'; c.status = 'active'; }
  if (c.risk !== oldRisk) {
    if (isPepType) fx.push(`Risk rating raised from ${cap(oldRisk)} to High`);
    fx.push(`Next review ${fmtD(nextReview(c))} (every ${s.cycles[c.risk]} months)`, `Screening every ${s.screen[c.risk]} months`);
    const edd = DOC_LIB[c.type].filter(t => t.when === 'high');

  const startRf = !c.refresh && !$('#dc-rf-w', dlg).hidden && $('#dc-rf', dlg).checked;

}

/* =========================================================
   Scans (IndexedDB, this browser only)
   ========================================================= */
const ATT = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (this.db) return res(this.db);
      let r; try { r = indexedDB.open('kyc-refresh-desk-files', 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('files', mode); const out = fn(t.objectStore('files')); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
  },
  put(id, rec) { return this.tx('readwrite', s => s.put(rec, id)); },
  get(id) { return this.tx('readonly', s => s.get(id)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  clear() { return this.tx('readwrite', s => s.clear()); },
  async all() {
    const keys = await this.tx('readonly', s => s.getAllKeys());
    const out = [];
    for (const k of keys || []) out.push([k, await this.get(k)]);
    return out;
  },
};

/* =========================================================

   ========================================================= */
function download(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
}
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataToBlob(u) {
  const [h, b64] = u.split(','); const type = (h.match(/data:([^;]+)/) || [])[1] || '';
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

function exportCSV() {
  const head = ['id', 'name', 'type', 'risk', 'pep', 'country', 'service', 'status', 'last_review', 'next_review', 'refresh_stage', 'docs_verified', 'docs_required', 'file_ref', 'file_location', 'file_status', 'contact', 'email', 'phone'];

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function normDate(s) {
  s = (s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/))) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`; // day first
  return '';
}

  if (!head.includes('name')) { modal('Column missing', `<p>The first row must contain column names, including <b>name</b>. Use this layout:</p><textarea class="letter" style="min-height:120px" readonly>${esc(CSV_TEMPLATE)}</textarea>`, [], { cancel: 'Close' }); return; }
  const parsed = rows.slice(1).map(r => {
    const t = col(r, 'type').toLowerCase();
    const type = /^ind|person|natural/.test(t) ? 'individual' : /^tru/.test(t) ? 'trust' : /^part|lp$|llp/.test(t) ? 'partnership' : t ? 'company' : 'individual';
    const rk = col(r, 'risk', 'risk_rating').toLowerCase();
    const risk = rk.startsWith('h') ? 'high' : rk.startsWith('l') ? 'low' : 'medium';
    return { r, type, risk, last: normDate(col(r, 'last_review', 'last_review_date', 'review_date', 'onboarded')) };
  }).filter(x => col(x.r, 'name'));
  const noDate = parsed.filter(x => !x.last).length;
  const body = `<p>Ready to add ${plural(parsed.length, 'client')}. Each starts with every document marked <b>Outstanding</b>, so open each file and record what is already on paper.</p>
    ${noDate ? `<p class="callout warn">${plural(noDate, 'row')} had no readable last review date (use YYYY-MM-DD or DD/MM/YYYY). Those clients will show as due today.</p>` : ''}
    ${S.sample ? '<label class="check" for="im-clear"><input type="checkbox" id="im-clear" checked> Remove the sample clients first</label>' : ''}`;
  modal('Import clients', body, [{ label: `Import ${parsed.length}`, cls: 'primary', fn: dlg => {
    if (S.sample && $('#im-clear', dlg) && $('#im-clear', dlg).checked) { S.clients = []; S.sample = false; }
    parsed.forEach(({ r, type, risk, last }) => {
      const id = nextId();
      const c = { id, name: col(r, 'name'), type, risk, country: col(r, 'country', 'jurisdiction') || 'Not recorded', status: 'active', contact: col(r, 'contact', 'contact_person') || col(r, 'name'), email: col(r, 'email'), phone: col(r, 'phone', 'telephone'), address: col(r, 'address'), rm: col(r, 'partner', 'rm', 'responsible_partner'), onboarded: normDate(col(r, 'onboarded', 'onboarding_date')) || '', last: last || iso(addMonths(TODAY, -S.settings.cycles[risk])), note: '',
        ra: { jur: 0, pep: /^y|true|1/i.test(col(r, 'pep')) ? 1 : 0, svc: 0, chan: 0, sow: 0, struct: type === 'individual' ? 0 : 1, media: 0 },
        docs: {}, parties: [], outreach: [], history: [{ d: iso(TODAY), t: 'Client imported from CSV register.', by: me() }], reviews: [], refresh: null, screening: null, decisions: [],
        pep: /^y|true|1/i.test(col(r, 'pep')) ? newPep() : null,
        file: { ref: col(r, 'file_ref', 'file_reference', 'file') || `${TYPE_CODE[type]}/${id.slice(3)}`, loc: col(r, 'file_location', 'location') || 'Not recorded', out: null } };
      if (c.pep) c.risk = 'high';
      DOC_LIB[type].forEach(d => doc(c, d.k));
      S.clients.push(c);
    });
    commit(`${plural(parsed.length, 'client')} imported`);
    later(() => go('clients'));
  } }]);
}
function importBackup(text) {
  let data; try { data = JSON.parse(text); } catch (e) { data = null; }
  if (!data || data.app !== 'kyc-refresh-desk' || !data.state) { toast('That file is not a KYC Refresh Desk backup.'); return; }
  const n = data.state.clients.length, f = Object.keys(data.files || {}).length;
  modal('Restore backup', `<p>Restore ${plural(n, 'client')} and ${plural(f, 'scan')} from ${fmt((data.exported || '').slice(0, 10))}?</p><p class="callout warn">This replaces every record currently in this browser.</p>`,
    [{ label: 'Replace and restore', cls: 'danger solid', fn: async () => {
      S = migrate(data.state); S.settings = Object.assign(clone(DEFAULT_SETTINGS), S.settings || {});
      try { await ATT.clear(); for (const [id, x] of Object.entries(data.files || {})) await ATT.put(id, { name: x.name, type: x.type, size: x.size, added: x.added, blob: dataToBlob(x.data) }); } catch (e) { toast('Records restored, but scans could not be saved in this browser.'); }
      commit('Backup restored'); later(() => go('overview'));
    } }]);
}
let importMode = 'csv';
$('#importpick').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => (importMode === 'json' ? importBackup(r.result) : importCSV(r.result));
  r.readAsText(f);
});

/* =========================================================
   Events
   ========================================================= */
const ACT = {
  nav: el => go(el.dataset.to),
  open: el => go('client-' + el.dataset.id),
  add: () => modalClient(null),
  edit: el => modalClient(get(el.dataset.id)),
  start: el => modalStart(get(el.dataset.id)),
  chase: el => modalChase(get(el.dataset.id)),
  escalate: el => modalEscalate(get(el.dataset.id)),
  advance: el => advance(get(el.dataset.id)),
  screen: el => modalScreen(get(el.dataset.id)),
  signoff: el => modalSignoff(get(el.dataset.id)),
  letter: el => modalLetter(get(el.dataset.id), el.dataset.kind),
  checklist: el => modalChecklist(get(el.dataset.id)),
  checkout: el => modalCheckout(get(el.dataset.id)),
  checkin: el => checkin(get(el.dataset.id)),
  attach: el => { pendingAttach = { c: get(el.dataset.id), k: el.dataset.k }; $('#filepick').click(); },
  viewatt: el => viewAttachment(get(el.dataset.id), el.dataset.k),
  alltasks: () => { showAllTasks = !showAllTasks; render(); },
  bucket: el => { F.bucket = el.dataset.b; render(); },
  tile: el => {
    const f = el.dataset.f;
    if (f === 'files') return go('files');
    if (f === 'chase') return go('outreach');
    if (f === 'inprog') return go('pipeline');
    Object.assign(F, { q: '', risk: '', type: '', bucket: f });
    go('clients');
  },
  decide: el => modalDecision(get(el.dataset.id), el.dataset.type, el.dataset.risk),
  decnote: el => { const c = get(el.dataset.id); modalDecisionNote(c, c.decisions.find(x => x.id === el.dataset.dec)); },
  addparty: el => {
    const c = get(el.dataset.id), name = $('#np-name').value.trim();
    if (!name) { toast('Enter the party’s full name.'); $('#np-name').focus(); return; }
    const p = { id: 'p' + Date.now().toString(36), name, role: $('#np-role').value, pct: $('#np-pct').value, idExp: $('#np-exp').value, idOk: false, poaOk: false, req: !!c.refresh };
    c.parties.push(p);
    log(c, `Connected party added: ${name} (${p.role}).`);
    commit('Party added');
  },
  delparty: el => {
    const c = get(el.dataset.id), p = c.parties.find(x => x.id === el.dataset.p);
    modal('Remove connected party', `<p>Remove ${esc(p.name)} (${esc(p.role)}) from this client? The removal is recorded in the audit trail.</p>`, [{ label: 'Remove', cls: 'danger solid', fn: () => {
      c.parties = c.parties.filter(x => x !== p); log(c, `Connected party removed: ${p.name} (${p.role}).`); commit('Party removed');
    } }]);
  },
  cancelrefresh: el => {
    const c = get(el.dataset.id);
    modal('Cancel this refresh', `<p>Cancel the refresh in progress for ${esc(c.name)}? Document statuses stay as they are and the review date is unchanged.</p><label class="field" for="cr-n">Reason<input id="cr-n" placeholder="e.g. Client exiting, started in error"></label>`, [{ label: 'Cancel refresh', cls: 'danger solid', fn: dlg => {
      const why = $('#cr-n', dlg).value.trim();
      if (!why) return fail(dlg, 'Give a reason. It is recorded in the audit trail.');
      c.refresh = null; c.parties.forEach(p => { p.req = false; }); log(c, `Refresh cancelled: ${why}`); commit('Refresh cancelled');
    } }], { cancel: 'Keep it' });
  },
  backup: () => exportBackup(),
  restore: () => { importMode = 'json'; $('#importpick').accept = '.json,application/json'; $('#importpick').click(); },
  exportcsv: () => exportCSV(),
  importcsv: () => {
    modal('Import clients from CSV', `<p>Bring in your existing client register from a spreadsheet. Save it as CSV with column names in the first row. Only <b>name</b> is required; these are also read:</p>
      <textarea class="letter" style="min-height:110px" readonly id="csv-tpl">${esc(CSV_TEMPLATE)}</textarea>
      <p class="note">Type can be individual, company, trust or partnership. Risk can be high, medium or low. Dates as YYYY-MM-DD or DD/MM/YYYY.</p>`,
      [{ label: 'Copy template', fn: d => { copyText($('#csv-tpl', d)); return false; } },
       { label: 'Choose CSV file', cls: 'primary', fn: () => { importMode = 'csv'; $('#importpick').accept = '.csv,text/csv'; $('#importpick').click(); } }]);
  },
  loadsample: () => modal('Load sample clients', '<p>Replace every record in this browser with the fictional sample clients? Your settings are kept.</p>', [{ label: 'Load sample clients', cls: 'danger solid', fn: async () => {
    S = seed(S.settings); try { await ATT.clear(); } catch (e) { /* none */ } commit('Sample clients loaded'); later(() => go('overview'));
  } }]),
  erase: () => modal('Erase all records', '<p>Delete every client, document record, scan and audit entry stored in this browser? Settings are kept.</p><p class="callout crit">This cannot be undone. Save a backup first if you may need these records.</p><label class="field" for="er-c">Type ERASE to confirm<input id="er-c" autocomplete="off"></label>', [{ label: 'Erase everything', cls: 'danger solid', fn: async dlg => {
    if ($('#er-c', dlg).value.trim() !== 'ERASE') return fail(dlg, 'Type ERASE in capitals to confirm.');
    S = emptyState(S.settings); try { await ATT.clear(); } catch (e) { /* none */ } commit('All records erased'); later(() => go('overview'));
  } }]),
};

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  // let real links and form controls inside clickable rows behave normally
  if (el.tagName === 'TR' && e.target.closest('a, button, input, select')) return;
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if (e.key === 'Enter' && e.target.matches('.kcard')) e.target.click();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { F.q = e.target.value; renderClientRows(); }
});
document.addEventListener('change', e => {
  const el = e.target, ds = el.dataset;
  if (ds.filter) { F[ds.filter] = el.value; renderClientRows(); return; }
  if (ds.set) {
    const path = ds.set.split('.');
    let v = el.type === 'number' ? Math.max(Number(el.min) || 0, Number(el.value) || 0) : el.value.trim();
    let o = S.settings; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = v;
    save(); renderNav(); toast('Setting saved');
    return;
  }
  if (ds.doc) {
    const c = get(ds.id), t = defOf(c, ds.doc), d = doc(c, ds.doc), f = ds.f;
    const v = el.type === 'checkbox' ? el.checked : el.value;
    const old = d[f];
    d[f] = v;
    if (f === 's') {
      if ((v === 'received' || v === 'verified') && (!d.rec || (c.refresh && d.rec < c.refresh.started))) d.rec = iso(TODAY);
      if (v === 'received' && d.paper === false) d.paper = true;
      log(c, `${t.short}: ${DOC_STATUS[old].n} → ${DOC_STATUS[v].n}.`);
    } else if (f === 'exp') log(c, `${t.short}: expiry date set to ${v ? fmt(v) : 'none'}.`);
    else if (f === 'paper') log(c, `${t.short}: ${v ? 'original or certified copy placed on paper file' : 'removed from paper file'}.`);
    else if (f === 'scan') log(c, `${t.short}: marked as ${v ? 'scanned' : 'not scanned'}.`);
    save(); rerender();
    return;
  }
  if (ds.party) {
    const c = get(ds.id), p = c.parties.find(x => x.id === ds.party), f = ds.f;
    p[f] = el.type === 'checkbox' ? el.checked : el.value;
    if (f === 'idOk' || f === 'poaOk') log(c, `${p.name}: ${f === 'idOk' ? 'certified ID' : 'proof of address'} ${p[f] ? 'verified' : 'marked as not verified'}.`);
    if (f === 'idExp') log(c, `${p.name}: ID expiry set to ${p.idExp ? fmt(p.idExp) : 'none'}.`);
    if (p.req && partyOK(p)) p.req = false;
    save(); rerender();
    return;
  }
  if (ds.ra) {
    const c = get(ds.id), fct = RISK_FACTORS.find(x => x.k === ds.ra);
    c.ra[ds.ra] = Number(el.value);
    log(c, `Risk assessment: ${fct.n.toLowerCase()} set to "${fct.o[c.ra[ds.ra]][0]}". Score now ${raScore(c)}.`);
    save(); rerender();
  }
});
window.addEventListener('hashchange', route);

shell();
save();
route();
})();
</script>
</body>
