# Rebuilds the MLRO Morning Brief every weekday morning, publishes it to the
# gh-pages branch (served at https://<owner>.github.io/<repo>/) and sends the
# morning phone notification via ntfy (topic in compliance_dashboard/data/notify.json,
# or a repository secret NTFY_TOPIC to override it).
name: Compliance dashboard

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 10:00 UTC = 06:00 in Turks & Caicos (EDT), 05:00 in winter (EST)
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["compliance_dashboard/**", ".github/workflows/compliance-dashboard.yml"]

permissions:
  contents: write
  actions: write   # for the keep-alive step below

concurrency:
  group: compliance-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore feed cache
        uses: actions/cache@v4
        with:
          path: compliance_dashboard/cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - name: Test
        run: python -m unittest discover -s compliance_dashboard/tests
      - name: Build
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Only the morning schedule (or a manual run) sends a notification, not code pushes.
          NOTIFY: ${{ github.event_name != 'push' && '--notify' || '' }}
        run: python compliance_dashboard/run.py --no-open --out site $NOTIFY
      - name: Publish to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Morning brief $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      # GitHub disables scheduled workflows in public repos after 60 days with no
      # repository activity. Re-enable the workflow through the API, and if master
      # has had no commit for 45 days, add an empty keep-alive commit (the
      # documented definition of activity).
      - name: Keep the daily schedule alive
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/compliance-dashboard.yml/enable"
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit on master: ${age_days} days ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -q -m "Keep the daily compliance dashboard schedule active"
            git push origin HEAD:master
          fi
