# Temporary: inspect sanctions list download formats. Will be removed.
name: Probe sanctions files
on:
  push:
    branches: [claude/compliance-officer-dashboard-h2m3az]
    paths: [".github/workflows/probe-sanctions.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 ComplianceDashboard/1.0"
          for u in \
            https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.csv \
            https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.xml \
            https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.json \
            https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV \
            https://sanctionslistservice.ofac.treas.gov/api/download/SDN.CSV \
            https://www.treasury.gov/ofac/downloads/sdn.csv ; do
            echo "=================== $u"
            code=$(curl -sSL -A "$UA" -o f -w '%{http_code} %{url_effective} %{size_download}' "$u" || true)
            echo "HTTP $code"
            file f
            head -c 1500 f | cat -v; echo
            echo "--- lines: $(wc -l < f)"
          done
          echo "=========== UK xml structure"
          curl -sSL -A "$UA" -o uk.xml https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.xml || true
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, collections
          try:
              r = ET.parse("uk.xml").getroot()
          except Exception as e:
              print("xml err", e); raise SystemExit
          print("root", r.tag, r.attrib)
          kids = collections.Counter(c.tag for c in r); print(kids.most_common(5))
          first = next(c for c in r if kids[c.tag] > 5)
          def dump(e, d=0):
              if d > 4: return
              t = (e.text or "").strip()[:60]
              print("  "*d + e.tag, e.attrib or "", repr(t) if t else "")
              seen=set()
              for c in e:
                  if c.tag in seen and d>0: continue
                  seen.add(c.tag); dump(c, d+1)
          dump(first)
          PY
